<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var s86t=localStorage.getItem('strfry86_theme');if(s86t==='light'||s86t==='dark'){document.documentElement.style.colorScheme=s86t;}}catch(e){}</script>
<title>strfry-86 — activity</title>
<style>
:root { color-scheme: light dark; }
#theme-btn { position: fixed; top: 0.5em; right: 0.5em; }
body { background: Canvas; color: CanvasText; max-width: 40em; margin: 0 auto; padding: 0 1em; }
li, pre { overflow-wrap: anywhere; }
pre { white-space: pre-wrap; }
@media (max-width: 600px) { body { font-size: 1.15em; } }
header.s86-hdr { position: sticky; top: 0; background: Canvas; padding: 0.5em 0; z-index: 1; }
header.s86-hdr a.s86-logo { text-decoration: none; color: inherit; }
header.s86-hdr nav a { margin-right: 0.75em; }
</style>
</head>
<body>
<h1>Activity</h1>
<p id="status"></p>
<p id="feed-age"></p>
<div id="feed-container"></div>
<script src="/common86.js"></script>
<script>
// Public landing: kind, timestamp, event id only. No pubkeys, content, or
// npubs — the server strips the payload; this page never asks for more.
var KNOWN_KINDS = {
  0: 'profile', 1: 'note', 5: 'deletion', 6: 'repost', 7: 'reaction',
  1059: 'gift wrap', 1984: 'report', 9735: 'zap receipt',
  10002: 'relay list', 10050: 'DM relay list', 30023: 'long-form'
};
var POLL_MS = 8000;
var adminPubkey = null;
var pollTimer = null;

var statusEl = document.getElementById('status');
var feedAgeEl = document.getElementById('feed-age');
var feedContainer = document.getElementById('feed-container');
var chrome = s86BuildPageChrome(statusEl);
var loginBtn = chrome.loginBtn;

function setStatus(text) {
  statusEl.textContent = text;
}

function kindLabel(kind) {
  return KNOWN_KINDS[kind] ? (kind + ' ' + KNOWN_KINDS[kind]) : String(kind);
}

function shortId(id) {
  if (!id || id.length < 16) {
    return id || '';
  }
  return id.slice(0, 8) + '…' + id.slice(-8);
}

function renderFeed(data) {
  feedContainer.textContent = '';
  if (data.error) {
    feedAgeEl.textContent = 'could not run — ' + data.error;
    return;
  }
  if (data.scanned_at != null) {
    feedAgeEl.textContent = 'updated ' + s86FormatDate(data.scanned_at)
      + ' (' + s86FormatRelativeAge(data.scanned_at) + ')';
  } else {
    feedAgeEl.textContent = '';
  }
  var events = data.events || [];
  if (events.length === 0) {
    feedContainer.appendChild(s86El('p', 'no events yet'));
    return;
  }
  var table = document.createElement('table');
  var thead = document.createElement('thead');
  var hr = document.createElement('tr');
  ['kind', 'time', 'event id'].forEach(function (label) {
    hr.appendChild(s86El('th', label));
  });
  thead.appendChild(hr);
  table.appendChild(thead);
  var tbody = document.createElement('tbody');
  events.forEach(function (ev) {
    var tr = document.createElement('tr');
    tr.appendChild(s86El('td', kindLabel(ev.kind)));
    tr.appendChild(s86El('td', s86FormatDate(ev.created_at)));
    var idTd = document.createElement('td');
    idTd.textContent = shortId(ev.id);
    idTd.title = ev.id || '';
    tr.appendChild(idTd);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  feedContainer.appendChild(table);
}

function loadFeed() {
  return fetch('/api/activity')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      renderFeed(data);
    })
    .catch(function () {
      feedAgeEl.textContent = '';
      feedContainer.textContent = '';
      setStatus('failed to load activity feed');
    });
}

function onLogin() {
  setStatus('logged in as admin');
}

s86WireLogin(loginBtn, statusEl, function () { return adminPubkey; }, onLogin);

// Resolve admin pubkey so login works (same public endpoint as bans).
fetch('/api/banned')
  .then(function (res) { return res.json(); })
  .then(function (data) {
    adminPubkey = data.admin;
    s86TryAutoLogin(adminPubkey, loginBtn, statusEl, onLogin);
  })
  .catch(function () {});

loadFeed();
pollTimer = setInterval(loadFeed, POLL_MS);
</script>
</body>
</html>
