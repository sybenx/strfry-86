<title>Audit log — strfry-86</title>
<style>
/* strfry-86 style block — canonical source. tools/stamp_style.py copies this
   file verbatim into every page's <style>, so "identical character-for-character
   on every page" is enforced by a command, not by discipline. Edit here only.

   Colours resolve through light-dark(), which reads the SAME color-scheme value
   the theme button and the anti-flash <script> already set on <html> — the
   toggle mechanism of WHY.md §3 is unchanged, only its palette is now ours.
   Where light-dark() is unsupported the @supports block below hands every token
   back to a system colour, i.e. back to the browser-default rendering this
   project shipped before the paint. */
:root {
  color-scheme: light dark;
  --paper:   light-dark(oklch(.985 .004 60),        oklch(.155 .005 60));
  --surface: light-dark(oklch(1 0 0),               oklch(.205 .005 60));
  --ink:     light-dark(oklch(.18 .005 60),         oklch(.93 .004 60));
  --muted:   light-dark(oklch(.18 .005 60 / .55),   oklch(.93 .004 60 / .55));
  --rule:    light-dark(oklch(.18 .005 60 / .15),   oklch(.93 .004 60 / .18));
  --hair:    light-dark(oklch(.18 .005 60 / .08),   oklch(.93 .004 60 / .1));
  --wash:    light-dark(oklch(.18 .005 60 / .06),   oklch(.93 .004 60 / .08));
  --accent:  light-dark(oklch(.45 .18 25),          oklch(.72 .16 25));
  --good:    light-dark(oklch(.5 .12 145),          oklch(.75 .14 145));
  --term-bg: oklch(.14 .005 60);
  --term-fg: oklch(.9 .01 145);
  --term-edge: oklch(.3 .01 60);
  --serif: Georgia, "PT Serif", "Iowan Old Style", "Times New Roman", serif;
  --sans: "Helvetica Neue", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, "IBM Plex Mono", monospace;
}
@supports not (color: light-dark(#000, #fff)) {
  :root { --paper:Canvas; --surface:Canvas; --ink:CanvasText; --muted:GrayText;
          --rule:GrayText; --hair:GrayText; --wash:transparent;
          --accent:LinkText; --good:CanvasText; }
}
* { box-sizing:border-box; }
body { max-width:68em; margin:0 auto; padding:0 1.5em 4em; font-size:.94rem;
       line-height:1.55; font-family:var(--sans);
       background:var(--paper); color:var(--ink); }           /* WHY.md §3 */
h1, h2 { font-family:var(--serif); font-weight:700; letter-spacing:-.01em; margin:0 0 .4rem; }
h1 { font-size:1.7rem; }
h2 { font-size:1.2rem; margin-top:2.2rem; }
h3 { font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.1em;
     color:var(--muted); margin:1.6rem 0 .5rem; }
p { margin:.5rem 0; }
a { color:var(--accent); text-underline-offset:2px; }
li { overflow-wrap:anywhere; }
code { font-family:var(--mono); font-size:.85em; }
.mono { font-family:var(--mono); font-size:.9em; }
.nowrap { white-space:nowrap; }      /* already-truncated ids — never wrapped mid-key */
.muted, #status, #feed-age, #provenance-line, #truncated-line { color:var(--muted); }
.page-head { display:flex; align-items:baseline; justify-content:space-between;
             gap:1em; flex-wrap:wrap; }
.badge { font-family:var(--mono); font-size:.72rem; padding:.15em .5em; white-space:nowrap;
         background:var(--wash); border:1px solid var(--rule); border-radius:6px; }
.pill { display:inline-flex; align-items:center; gap:.45em; font-family:var(--mono);
        font-size:.7rem; letter-spacing:.08em; padding:.35em .75em;
        border:1px solid currentColor; border-radius:8px; color:var(--muted); }
.pill.live { color:var(--good); }
.pill .dot { width:.45em; height:.45em; border-radius:50%; background:currentColor; }
.chip { display:inline-block; font-family:var(--mono); font-size:.7rem; padding:.2em .6em;
        border:1px solid currentColor; border-radius:6px; color:var(--muted); }
.chip.good { color:var(--good); }
.chip.bad { color:var(--accent); }
.chips { display:flex; flex-wrap:wrap; gap:.4em; margin:.6rem 0; }
button.chip.cmd { font-weight:400; background:transparent; color:var(--ink);
                  border-color:var(--rule); }
button.chip.cmd:hover { background:var(--ink); color:var(--paper); }
/* Identity dot, never an avatar: the hue comes from the pubkey itself, so no
   row on any page ever fetches an image from a stranger's host. */
.idot { width:.75em; height:.75em; border-radius:50%; flex:none;
        background:oklch(.65 .11 var(--h, 0)); }
.idot.unknown { background:var(--rule); }
.idot.big { width:4.5em; height:4.5em; }
.profile-head { display:flex; gap:1.5em; align-items:flex-start; padding-bottom:1.4rem;
                margin-bottom:1.2rem; border-bottom:1px solid var(--rule); }
.profile-head .profile-id { flex:1; min-width:0; }
.profile-head .profile-id > * { margin:.25rem 0; }
.profile-head h2 { font-size:1.5rem; margin:0; }
/* Identity stays a real table-cell. display:flex on the <td> itself took it
   out of table layout, so its border-bottom sat at a different height from
   every sibling cell after the avatar was replaced by a small colour dot.
   Flex lives on the inner .idrow; the cell keeps vertical-align so the
   divider line is one continuous rule across the row. */
td.identity { max-width:15em; white-space:nowrap; vertical-align:middle; }
td.identity .idrow { display:flex; align-items:center; gap:.4em; min-width:0;
                     line-height:1.2; }
td.identity .idrow > :last-child { overflow:hidden; text-overflow:ellipsis;
                                   min-width:0; }
td.num { font-family:var(--mono); font-size:.9em; }
td.num.bad { color:var(--accent); }
td.pick { width:1.5em; }
td.action { text-align:right; white-space:nowrap; }
/* A clipped cell must not be allowed to size its column, or one long note
   pushes every other column off the page. max-width:0 hands the column its
   width from the table instead; `.grow` then gives it whatever is left. */
td.clip { max-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
th.grow, td.grow { width:100%; }
.struck { text-decoration:line-through; }
/* A control that reads as a link but IS a button — it performs an action, so
   it must be a button for the keyboard and the screen reader both. */
button.linky { font-size:.78rem; font-weight:400; padding:.15em .3em; border:none;
               background:none; color:var(--accent); text-decoration:underline;
               text-underline-offset:2px; }
button.linky:hover:not(:disabled) { background:none; color:var(--accent); opacity:.7; }
.toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:.6em; margin:.7rem 0; }
.toolbar > input[type="search"], .toolbar > input[type="text"] { flex:1; min-width:12em; }
.modes { display:flex; flex-direction:column; gap:.3em; }
.modes label { display:flex; align-items:baseline; gap:.5em; font-size:.88rem; }
dl.tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(11em, 1fr));
           gap:1px; margin:1.2rem 0; background:var(--rule);
           border:1px solid var(--rule); border-radius:10px; overflow:hidden; }
dl.tiles .tile { background:var(--surface); padding:.9em 1em; }
dl.tiles dt { font-size:.68rem; font-weight:600; text-transform:uppercase;
              letter-spacing:.08em; color:var(--muted); }
dl.tiles dd { margin:.3rem 0 0; font-family:var(--serif); font-size:1.5rem;
              font-weight:700; letter-spacing:-.02em; }
dl.tiles .note { margin:.2rem 0 0; font-family:var(--mono); font-size:.68rem; color:var(--muted); }
dl.tiles .note.bad { color:var(--accent); }
.field-row { display:grid; grid-template-columns:16em 1fr; gap:1.2em;
             align-items:baseline; padding:.45em 0; }
.field-label { font-size:.85rem; color:var(--muted); }
.field-control input[type="text"], .field-control input[type="number"] { width:100%; max-width:24em; }
.field-control .note { margin:.2rem 0 0; font-size:.72rem; color:var(--muted); }
/* Destructive / dependency warnings on a setting (e.g. writePolicy.plugin).
   --accent is the project's "bad" colour; weight makes it read before the
   muted help line under it. */
.field-control .note.bad { color:var(--accent); font-weight:600; }
/* Compact progress: the "N of ~M" size figure is the one number that matters
   mid-run, so it steps out of the muted note colour into full ink + bold. */
.field-control .note .figure { color:var(--ink); font-weight:700;
                               font-family:var(--mono); }
/* Range shares the same chrome as settings buttons: ink border, 8px radius,
   sans label weight. The native track is replaced so it does not look like a
   browser default next to Save / Edit raw. */
.field-control input[type="range"] {
  -webkit-appearance: none; appearance: none;
  flex:1; min-width:10em; max-width:18em; height:2.35em; margin:0;
  font-family:var(--sans); font-size:.82rem; font-weight:600;
  color:var(--ink); background:transparent;
  border:1px solid var(--ink); border-radius:8px; cursor:pointer;
  padding:0 .7em;
}
.field-control input[type="range"]::-webkit-slider-runnable-track {
  height:2px; background:var(--rule); border-radius:1px;
}
.field-control input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width:1em; height:1em; margin-top:-.4em;
  background:var(--ink); border:1px solid var(--ink); border-radius:4px;
  cursor:pointer;
}
.field-control input[type="range"]::-moz-range-track {
  height:2px; background:var(--rule); border:none; border-radius:1px;
}
.field-control input[type="range"]::-moz-range-thumb {
  width:1em; height:1em;
  background:var(--ink); border:1px solid var(--ink); border-radius:4px;
  cursor:pointer;
}
.field-control .range-days {
  font-family:var(--sans); font-size:.82rem; font-weight:600;
  padding:.5em 1em; color:var(--ink); background:transparent;
  border:1px solid var(--ink); border-radius:8px; min-width:5.5em;
  text-align:center; white-space:nowrap;
}
textarea { width:100%; font-family:var(--mono); font-size:.78rem; line-height:1.6;
           padding:1em; resize:vertical; background:var(--term-bg); color:var(--term-fg);
           border:1px solid var(--term-edge); border-radius:14px; }
.console-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.2em; align-items:start; }
.console-grid h3 { display:flex; align-items:center; gap:.5em; }
.dot-inline { width:.5em; height:.5em; border-radius:50%; background:var(--good); flex:none; }
.dot-inline.warn { background:light-dark(oklch(.6 .14 80), oklch(.8 .14 80)); }
.dot-inline.off { background:var(--rule); }
table { width:100%; border-collapse:collapse; margin:.8rem 0 1.4rem; font-size:.92em; }
th, td { text-align:left; padding:.6em .7em; border-bottom:1px solid var(--hair);
         font-variant-numeric:tabular-nums; }
tbody th { font-weight:600; }        /* row label, not a column header */
thead th { font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em;
           line-height:1.25; color:var(--muted); border-top:2px solid var(--ink);
           border-bottom:1px solid var(--rule); }
/* Sortable list headers: a real button that wears the thead chrome, never a
   second sort-control row elsewhere on the page. Active column is ink so the
   ↑/↓ arrow is visible against the muted default. */
thead th.sortable { color:var(--muted); }
thead th.sortable[aria-sort="ascending"],
thead th.sortable[aria-sort="descending"] { color:var(--ink); }
button.th-sort { font:inherit; font-size:inherit; font-weight:inherit;
                 letter-spacing:inherit; text-transform:inherit;
                 color:inherit; background:none; border:none; padding:0;
                 margin:0; cursor:pointer; text-align:left; border-radius:0; }
button.th-sort:hover:not(:disabled) { background:none; color:var(--ink); }
td[colspan] { color:var(--muted); }  /* the "+ N more …" tail summary row */
tbody tr:hover { background:var(--wash); }
button { font-family:var(--sans); font-size:.82rem; font-weight:600; padding:.5em 1em;
         color:var(--ink); background:transparent; border:1px solid var(--ink);
         border-radius:8px; cursor:pointer; }
button:hover:not(:disabled) { background:var(--ink); color:var(--paper); }
button:disabled { opacity:.4; cursor:not-allowed; }
input, select, textarea { font-family:var(--mono); font-size:.82rem; padding:.5em .7em;
         color:var(--ink); background:var(--surface); border:1px solid var(--rule);
         border-radius:8px; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
details { background:var(--surface); border:1px solid var(--rule); border-radius:10px;
          padding:.6em .9em; margin:1rem 0; }
summary { cursor:pointer; font-size:.85rem; font-weight:600; }
hr { border:none; border-top:3px double var(--rule); margin:2.4rem 0; }
pre { white-space:pre-wrap; overflow-wrap:anywhere;                /* commands only — WHY.md §2 */
      font-family:var(--mono); font-size:.8rem; line-height:1.65; padding:1em 1.1em;
      background:var(--term-bg); color:var(--term-fg);
      border:1px solid var(--term-edge); border-radius:14px; }
pre#console-log, pre#decision-log { min-height:12em; max-height:26em; overflow:auto; }
/* A log line is one line. Wrapping a key across two rows makes a tail
   unreadable, so this panel scrolls sideways inside its own box — which the
   no-horizontal-scroll rule is about the PAGE, not about a terminal. */
pre#decision-log { white-space:pre; overflow-wrap:normal; }
pre#console-log:empty::before { content:"strfry console — read-only verbs only";
                                color:oklch(.6 .01 60); }
pre .good { color:oklch(.78 .1 145); }
pre .bad { color:oklch(.72 .16 25); }
pre .dim { color:oklch(.6 .01 60); }
/* Console answer (stdout): the one number that matters after a scan --count.
   Bold + good so it does not share weight with dimmed loguru leftovers. */
pre .console-answer { font-weight:700; }
.console-row { display:flex; align-items:center; gap:.5em; margin:.6rem 0; }
.console-row .prompt { font-family:var(--mono); color:var(--good); }
.console-row input { flex:1; }
#records-container p { padding-bottom:.6em; border-bottom:1px solid var(--hair); }
header#s86 { position:sticky; top:0; z-index:5; margin-bottom:1.4rem;
             background:var(--paper); border-bottom:3px double var(--rule); }
header#s86 .brand { display:flex; align-items:baseline; gap:.8em; padding:.9rem 0 .6rem; }
header#s86 a.logo { font-family:var(--serif); font-weight:bold; font-size:1.5rem;
                    letter-spacing:-.02em; white-space:nowrap;
                    text-decoration:none; color:inherit; }
header#s86 .tagline { font-size:.65rem; font-weight:600; letter-spacing:.14em;
                      text-transform:uppercase; color:var(--muted); }
header#s86 .spacer { flex:1; }
header#s86 .bar { display:flex; align-items:center; gap:.5em; flex-wrap:wrap;
                  border-top:1px solid var(--rule); }
header#s86 nav { display:flex; flex-wrap:wrap; }
header#s86 nav a { padding:.7em .75em; font-size:.82rem; font-weight:600;
                   color:var(--muted); text-decoration:none;
                   border-bottom:2px solid transparent; }
header#s86 nav a:hover { color:var(--ink); }
header#s86 nav a[aria-current="page"] { color:var(--ink); border-bottom-color:var(--accent); }
header#s86 input#q { flex:1; min-width:8em; max-width:24em; margin-left:auto; }
header#s86 button#theme-btn { border-color:var(--rule); padding:.45em .7em; }
@media (max-width:600px) {
  body { font-size:1rem; padding:0 1em 3em; }
  /* Nothing may push the page wider than the screen (rendering rule 5), so
     at phone widths every cell breaks an unbreakable key — an npub, a hex id,
     a nip-05 address — rather than let the table overflow. identity/action
     keep white-space:nowrap at desktop; they must drop it here too, not only
     the .nowrap class. */
  th, td { padding:.5em .35em; overflow-wrap:anywhere; }
  .nowrap { white-space:normal; }
  td.clip,
  td.identity,
  td.action { max-width:none; white-space:normal; }
  table { font-size:.85em; }
  /* iOS Safari zooms the page on focus when a control is under 16px. Match
     the body size so filter/search/console inputs stay at the current scale. */
  input, select, textarea, button { font-size:1rem; }
  button { min-height:2.75em; padding:.6em 1em; }
  header#s86 button#theme-btn,
  header#s86 button#login-btn { min-height:2.75em; }
  .toolbar > input[type="search"],
  .toolbar > input[type="text"] { min-width:0; }
  .console-grid { grid-template-columns:1fr; }
  .field-row { grid-template-columns:1fr; gap:.2em; }
  .profile-head { flex-direction:column; gap:1em; }
  .profile-head .idot.big { width:3em; height:3em; }
  header#s86 .brand { padding:.7rem 0 .45rem; gap:.5em; }
  header#s86 a.logo { font-size:1.3rem; }
  header#s86 .tagline { display:none; }
  header#s86 nav a { padding:.65em .45em; font-size:.78rem; }
  /* Search always owns its own row under the tabs — never squeezed beside them. */
  header#s86 input#q { flex-basis:100%; max-width:none; margin:0 0 .5em; min-width:0; }

  /* List tables (class cards): each row becomes a stacked card. Column labels
     come from data-label on the cell — figure/key-value tables never take
     this class. Sort headers restyle as a wrap of chips so reordering still
     works without a wide thead. */
  table.cards { display:block; width:100%; font-size:1em; }
  table.cards thead { display:block; margin:0 0 .85rem; }
  table.cards thead tr { display:flex; flex-wrap:wrap; gap:.35em; }
  table.cards thead th { display:block; border:none; padding:0;
                         text-transform:none; letter-spacing:normal; line-height:1.2; }
  table.cards thead th:not(.sortable) { display:none; }
  table.cards thead button.th-sort {
    display:inline-flex; align-items:center; min-height:2.5em;
    padding:.4em .65em; border:1px solid var(--rule); border-radius:6px;
    background:var(--surface); color:inherit; font-size:.78rem; font-weight:600;
    letter-spacing:.04em; text-transform:uppercase;
  }
  table.cards thead th[aria-sort="ascending"] button.th-sort,
  table.cards thead th[aria-sort="descending"] button.th-sort {
    border-color:var(--ink); color:var(--ink);
  }
  table.cards tbody { display:block; }
  table.cards tbody tr {
    display:block; background:var(--surface); border:1px solid var(--rule);
    border-radius:10px; padding:.55em .85em; margin:0 0 .65em;
  }
  table.cards tbody tr:hover { background:var(--wash); }
  /* Block layout (not grid) so multi-child cells — audit Detail, identity
     idrow + badge — keep their normal inline flow under the label strip. */
  table.cards tbody td {
    display:block; padding:.4em 0; border-bottom:1px solid var(--hair);
    max-width:none; white-space:normal; overflow:visible; text-overflow:unset;
  }
  table.cards tbody td:last-child { border-bottom:none; }
  table.cards tbody td[data-label]::before {
    content:attr(data-label); display:block; margin:0 0 .15em;
    font-size:.68rem; font-weight:600; text-transform:uppercase;
    letter-spacing:.08em; color:var(--muted); line-height:1.3;
  }
  table.cards tbody td.pick {
    border-bottom:1px solid var(--hair); padding:.15em 0 .45em;
  }
  table.cards tbody td.pick:empty { display:none; }
  table.cards tbody td.pick input[type="checkbox"] {
    width:1.25em; height:1.25em; vertical-align:middle;
  }
  table.cards tbody td.identity .idrow { min-width:0; }
  table.cards tbody td.action {
    display:flex; justify-content:flex-end; gap:.5em;
    border-bottom:none; padding-top:.55em;
  }
  table.cards tbody td.action:empty { display:none; }
  table.cards tbody td.action::before { content:none; }
  table.cards tbody td.clip { white-space:normal; max-width:none; }

  /* Feed cards only: two compact meta lines (time · kind / author), content
     keeps its stacked label, result is one inline line. Other card tables
     keep the full stacked data-label layout above. */
  table.cards.feed tbody td.time,
  table.cards.feed tbody td.kind {
    display:inline-flex; align-items:center; gap:.4em;
    width:auto; max-width:none; padding:.1em 0 .25em;
    border-bottom:none; white-space:nowrap;
  }
  table.cards.feed tbody td.time { padding-right:.15em; }
  table.cards.feed tbody td.time::before {
    display:inline; margin:0 .4em 0 0; vertical-align:baseline;
  }
  table.cards.feed tbody td.time::after {
    content:"·"; color:var(--muted); margin:0 .15em 0 .45em;
    font-weight:400; letter-spacing:0; text-transform:none;
  }
  table.cards.feed tbody td.kind::before { content:none; }
  table.cards.feed tbody td.identity {
    display:block; padding:.1em 0 .45em;
    border-bottom:1px solid var(--hair);
  }
  table.cards.feed tbody td.identity::before { content:none; }
  table.cards.feed tbody td.clip {
    display:block; padding:.45em 0;
    border-bottom:1px solid var(--hair);
  }
  table.cards.feed tbody td.result {
    display:flex; align-items:center; gap:.5em;
    padding:.4em 0 0; border-bottom:none;
  }
  table.cards.feed tbody td.result::before {
    display:inline; margin:0; vertical-align:baseline;
  }

  /* Users cards: identity without label, NIP-05 one line, Events · Reports ·
     Gift-wraps on one meta line, last-active inline, Ban via .action. */
  table.cards.users tbody td.identity {
    display:block; padding:.1em 0 .35em; border-bottom:none;
  }
  table.cards.users tbody td.identity::before { content:none; }
  table.cards.users tbody td.nip05 {
    display:flex; align-items:baseline; flex-wrap:wrap; gap:.35em .5em;
    padding:.15em 0 .4em; border-bottom:1px solid var(--hair);
    white-space:normal;
  }
  table.cards.users tbody td.nip05::before {
    display:inline; margin:0; flex:none; vertical-align:baseline;
  }
  table.cards.users tbody td.events,
  table.cards.users tbody td.reports,
  table.cards.users tbody td.giftwraps {
    display:inline-flex; align-items:center; gap:.35em;
    width:auto; max-width:none; padding:.35em 0 .15em;
    border-bottom:none; white-space:nowrap;
  }
  table.cards.users tbody td.events::before,
  table.cards.users tbody td.reports::before,
  table.cards.users tbody td.giftwraps::before {
    display:inline; margin:0; vertical-align:baseline;
  }
  table.cards.users tbody td.events::after,
  table.cards.users tbody td.reports::after {
    content:"·"; color:var(--muted); margin:0 .15em 0 .4em;
    font-weight:400; letter-spacing:0; text-transform:none;
  }
  table.cards.users tbody td.last {
    display:flex; align-items:center; gap:.5em;
    padding:.35em 0 .15em; border-bottom:1px solid var(--hair);
    white-space:nowrap;
  }
  table.cards.users tbody td.last::before {
    display:inline; margin:0; vertical-align:baseline;
  }

  /* Banned-pubkey cards: identity without label; banned · source · blocked
     on one meta line; reason keeps stacked free-text label. */
  table.cards.bans tbody td.identity {
    display:block; padding:.1em 0 .35em; border-bottom:none;
  }
  table.cards.bans tbody td.identity::before { content:none; }
  table.cards.bans tbody td.when,
  table.cards.bans tbody td.source,
  table.cards.bans tbody td.blocked {
    display:inline-flex; align-items:center; gap:.35em;
    width:auto; max-width:none; padding:.35em 0 .15em;
    border-bottom:none; white-space:nowrap;
  }
  table.cards.bans tbody td.when::before,
  table.cards.bans tbody td.blocked::before {
    display:inline; margin:0; vertical-align:baseline;
  }
  /* Source badge is self-explanatory — no SOURCE strip beside kind:spam. */
  table.cards.bans tbody td.source::before { content:none; }
  table.cards.bans tbody td.when::after,
  table.cards.bans tbody td.source::after {
    content:"·"; color:var(--muted); margin:0 .15em 0 .4em;
    font-weight:400; letter-spacing:0; text-transform:none;
  }
  table.cards.bans tbody td.reason {
    display:block; padding:.45em 0; border-bottom:none;
    white-space:normal;
  }

  /* Domain-receipt cards: domain as heading; banned · count on one meta
     line; reason stacked; Unban via .action. */
  table.cards.domains tbody td.domain {
    display:block; padding:.1em 0 .35em; border-bottom:none;
    font-weight:600;
  }
  table.cards.domains tbody td.domain::before { content:none; }
  table.cards.domains tbody td.when,
  table.cards.domains tbody td.count {
    display:inline-flex; align-items:center; gap:.35em;
    width:auto; max-width:none; padding:.35em 0 .15em;
    border-bottom:none; white-space:nowrap;
  }
  table.cards.domains tbody td.when::before {
    display:inline; margin:0; vertical-align:baseline;
  }
  /* Value already reads "n of m still banned" — no PUBKEYS strip. */
  table.cards.domains tbody td.count::before { content:none; }
  table.cards.domains tbody td.when::after {
    content:"·"; color:var(--muted); margin:0 .15em 0 .4em;
    font-weight:400; letter-spacing:0; text-transform:none;
  }
  table.cards.domains tbody td.reason {
    display:block; padding:.45em 0; border-bottom:1px solid var(--hair);
    white-space:normal;
  }
}
</style>
</head>
<body>
<div class="page-head">
  <h1>Audit Log</h1>
  <input id="filter-input" type="search" placeholder="filter audit log…" aria-label="filter audit log">
</div>
<p id="status"></p>
<div id="admin-section" style="display:none">
  <p class="muted">Every admin action this relay has taken, newest first. Undo acts on this log — it is the authority, not any browser's local storage.</p>
  <p id="truncated-line"></p>
  <div id="records-container"></div>
</div>
<script src="/common86.js"></script>
<script>
// The audit log is the ONLY undo authority in the project. Every other page
// shows at most one line pointing here.
var ACTION_LABELS = {
  ban: 'ban.pubkey',
  unban: 'unban.pubkey',
  reason: 'ban.reason',
  settings: 'config.update'
};

var adminPubkey = null;
var isAdmin = false;
var lastRecords = [];
var sortField = 'at';
var sortDir = 'desc';

var statusEl = document.getElementById('status');
var chrome = s86BuildPageChrome(statusEl);
var loginBtn = chrome.loginBtn;
var adminSection = document.getElementById('admin-section');
var filterInput = document.getElementById('filter-input');
var truncatedLine = document.getElementById('truncated-line');
var recordsContainer = document.getElementById('records-container');

function setStatus(text) { statusEl.textContent = text; }

function cmpStrEmptyLast(a, b) {
  if (!a && !b) { return 0; }
  if (!a) { return 1; }
  if (!b) { return -1; }
  return a < b ? -1 : (a > b ? 1 : 0);
}

var AUDIT_SORT = {
  at: function (a, b) { return (a.at || 0) - (b.at || 0); },
  admin: function (a, b) {
    return cmpStrEmptyLast((a.actor || '').toLowerCase(), (b.actor || '').toLowerCase());
  },
  action: function (a, b) {
    return cmpStrEmptyLast(actionLabel(a).toLowerCase(), actionLabel(b).toLowerCase());
  },
  detail: function (a, b) {
    return cmpStrEmptyLast(describeRecord(a).toLowerCase(), describeRecord(b).toLowerCase());
  }
};

function setSort(field, dir) {
  sortField = field;
  sortDir = dir;
  renderRecords(lastRecords);
}

function actionLabel(r) {
  if (r.type === 'ban' && r.domain) {
    return 'ban.domain';
  }
  return ACTION_LABELS[r.type] || (r.type || 'action');
}

function describeRecord(r) {
  var n = (r.pubkeys && r.pubkeys.length) || r.count || 0;
  if (r.type === 'ban') {
    return r.domain
      ? ('Banned ' + r.domain + ' — ' + n + ' pubkey(s) on its roster')
      : ('Banned ' + n + ' pubkey(s)');
  }
  if (r.type === 'unban') {
    return 'Unbanned ' + n + ' pubkey(s)';
  }
  if (r.type === 'reason') {
    return 'Set reason on ' + (r.count || n) + ' ban(s)';
  }
  if (r.type === 'settings') {
    var changed = r.changed || [];
    var what = changed.indexOf('<raw>') !== -1
      ? 'replaced the whole file'
      : changed.join(', ');
    return 'Edited ' + (r.target === 'relay' ? 'strfry.conf' : 'config.json') + ' — ' + what;
  }
  return r.type || 'action';
}

function canUndo(r) {
  if (r.undone) {
    return false;
  }
  return r.type === 'ban' || r.type === 'unban' || (r.type === 'reason' && r.entries);
}

function buildDetailCell(r) {
  var td = s86El('td', null, r.undone ? 'muted struck' : '');
  td.appendChild(document.createTextNode(describeRecord(r)));
  if (r.via) {
    td.appendChild(s86El('span', ' (' + r.via + ')', 'muted'));
  }
  if (r.pubkeys && r.pubkeys.length) {
    var keys = r.pubkeys.slice(0, 3).map(s86ShortKey).join(', ')
      + (r.pubkeys.length > 3 ? ' +' + (r.pubkeys.length - 3) + ' more' : '');
    var span = s86El('span', ' ' + keys, 'mono muted');
    span.title = r.pubkeys.join('\n');
    td.appendChild(span);
  }
  return s86DataLabel(td, 'Detail');
}

function renderRecords(records) {
  lastRecords = records || [];
  recordsContainer.textContent = '';
  if (lastRecords.length === 0) {
    recordsContainer.appendChild(s86El('p', 'no admin actions recorded yet'));
    return;
  }
  var sorted = s86SortRows(lastRecords, AUDIT_SORT[sortField] || AUDIT_SORT.at, sortDir);
  var table = document.createElement('table');
  table.className = 'cards';
  table.appendChild(s86BuildSortableTableHead([
    { label: 'Time', key: 'at', dir: 'desc' },
    { label: 'Admin', key: 'admin', dir: 'asc' },
    { label: 'Action', key: 'action', dir: 'asc' },
    { label: 'Detail', key: 'detail', dir: 'asc', grow: true },
    { label: '' }
  ], { field: sortField, dir: sortDir }, setSort));
  var tbody = document.createElement('tbody');
  sorted.forEach(function (r) {
    var tr = document.createElement('tr');

    var timeTd = s86El('td', r.at ? s86FormatRelativeAge(r.at) : 'unknown', 'mono nowrap muted');
    timeTd.title = r.at ? s86FormatDate(r.at) : '';
    s86DataLabel(timeTd, 'Time');
    tr.appendChild(timeTd);

    var actor = r.actor ? s86ShortKey(r.actor) : '—';
    var actorTd = s86El('td', actor, 'mono nowrap');
    actorTd.title = r.actor || '';
    s86DataLabel(actorTd, 'Admin');
    tr.appendChild(actorTd);

    var actionTd = document.createElement('td');
    actionTd.appendChild(s86El('span', actionLabel(r), 'badge'));
    s86DataLabel(actionTd, 'Action');
    tr.appendChild(actionTd);

    tr.appendChild(buildDetailCell(r));

    var undoTd = s86El('td', null, 'action');
    if (r.undone) {
      undoTd.appendChild(s86El('span', 'Undone', 'muted'));
    } else if (canUndo(r)) {
      var btn = s86El('button', 'Undo', 'linky');
      btn.type = 'button';
      btn.addEventListener('click', function () {
        btn.disabled = true;
        s86SignAndPost('/api/undo', { id: r.id })
          .then(function (result) {
            if (!result.ok) {
              setStatus('undo failed: ' + s86ErrMsg(result));
              btn.disabled = false;
              return;
            }
            setStatus('undone');
            return loadAudit();
          })
          .catch(function () {
            setStatus('undo failed');
            btn.disabled = false;
          });
      });
      undoTd.appendChild(btn);
    }
    tr.appendChild(undoTd);

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  recordsContainer.appendChild(table);
}

function loadAudit() {
  var q = filterInput.value.trim();
  return fetch('/api/audit?q=' + encodeURIComponent(q))
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var records = data.records || [];
      renderRecords(records);
      truncatedLine.textContent = (data.total || 0) > records.length
        ? ('showing newest ' + records.length + ' of ' + data.total.toLocaleString() + ' — filter to narrow')
        : '';
    })
    .catch(function () {
      setStatus('failed to load audit log');
    });
}

function onLogin() {
  isAdmin = true;
  adminSection.style.display = '';
  loadAudit();
}

s86WireLogin(loginBtn, statusEl, function () { return adminPubkey; }, onLogin);
filterInput.addEventListener('input', function () {
  if (isAdmin) {
    loadAudit();
  }
});

fetch('/api/banned')
  .then(function (res) { return res.json(); })
  .then(function (data) {
    adminPubkey = data.admin;
    s86TryAutoLogin(adminPubkey, loginBtn, statusEl, onLogin);
  })
  .catch(function () {});
</script>
</body>
</html>
