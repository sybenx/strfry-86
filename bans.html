<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico">
<script>try{var s86t=localStorage.getItem('strfry86_theme');if(s86t==='light'||s86t==='dark'){document.documentElement.style.colorScheme=s86t;}}catch(e){}</script>
<title>strfry-86 — bans</title>
<style>
/* strfry-86 style block — canonical source. tools/stamp_style.py copies this
   file verbatim into every page's <style>, so "identical character-for-character
   on every page" is enforced by a command, not by discipline. Edit here only.

   Colours resolve through light-dark(), which reads the SAME color-scheme value
   the theme button and the anti-flash <script> already set on <html> — the
   toggle mechanism of WHY.md §3 is unchanged, only its palette is now ours.
   Where light-dark() is unsupported the @supports block below hands every token
   back to a system colour, i.e. back to the browser-default rendering this
   project shipped before the paint. */
:root {
  color-scheme: light dark;
  --paper:   light-dark(oklch(.985 .004 60),        oklch(.155 .005 60));
  --surface: light-dark(oklch(1 0 0),               oklch(.205 .005 60));
  --ink:     light-dark(oklch(.18 .005 60),         oklch(.93 .004 60));
  --muted:   light-dark(oklch(.18 .005 60 / .55),   oklch(.93 .004 60 / .55));
  --rule:    light-dark(oklch(.18 .005 60 / .15),   oklch(.93 .004 60 / .18));
  --hair:    light-dark(oklch(.18 .005 60 / .08),   oklch(.93 .004 60 / .1));
  --wash:    light-dark(oklch(.18 .005 60 / .06),   oklch(.93 .004 60 / .08));
  --accent:  light-dark(oklch(.45 .18 25),          oklch(.72 .16 25));
  --good:    light-dark(oklch(.5 .12 145),          oklch(.75 .14 145));
  --term-bg: oklch(.14 .005 60);
  --term-fg: oklch(.9 .01 145);
  --term-edge: oklch(.3 .01 60);
  --serif: Georgia, "PT Serif", "Iowan Old Style", "Times New Roman", serif;
  --sans: "Helvetica Neue", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, "IBM Plex Mono", monospace;
}
@supports not (color: light-dark(#000, #fff)) {
  :root { --paper:Canvas; --surface:Canvas; --ink:CanvasText; --muted:GrayText;
          --rule:GrayText; --hair:GrayText; --wash:transparent;
          --accent:LinkText; --good:CanvasText; }
}
* { box-sizing:border-box; }
body { max-width:68em; margin:0 auto; padding:0 1.5em 4em; font-size:.94rem;
       line-height:1.55; font-family:var(--sans);
       background:var(--paper); color:var(--ink); }           /* WHY.md §3 */
h1, h2 { font-family:var(--serif); font-weight:700; letter-spacing:-.01em; margin:0 0 .4rem; }
h1 { font-size:1.7rem; }
h2 { font-size:1.2rem; margin-top:2.2rem; }
h3 { font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.1em;
     color:var(--muted); margin:1.6rem 0 .5rem; }
p { margin:.5rem 0; }
a { color:var(--accent); text-underline-offset:2px; }
li { overflow-wrap:anywhere; }
code { font-family:var(--mono); font-size:.85em; }
.mono { font-family:var(--mono); font-size:.9em; }
.nowrap { white-space:nowrap; }      /* already-truncated ids — never wrapped mid-key */
.muted, #status, #feed-age, #provenance-line, #truncated-line { color:var(--muted); }
.page-head { display:flex; align-items:baseline; justify-content:space-between;
             gap:1em; flex-wrap:wrap; }
.badge { font-family:var(--mono); font-size:.72rem; padding:.15em .5em; white-space:nowrap;
         background:var(--wash); border:1px solid var(--rule); border-radius:6px; }
.pill { display:inline-flex; align-items:center; gap:.45em; font-family:var(--mono);
        font-size:.7rem; letter-spacing:.08em; padding:.35em .75em;
        border:1px solid currentColor; border-radius:8px; color:var(--muted); }
.pill.live { color:var(--good); }
.pill .dot { width:.45em; height:.45em; border-radius:50%; background:currentColor; }
table { width:100%; border-collapse:collapse; margin:.8rem 0 1.4rem; font-size:.92em; }
th, td { text-align:left; padding:.6em .7em; border-bottom:1px solid var(--hair);
         font-variant-numeric:tabular-nums; }
tbody th { font-weight:600; }        /* row label, not a column header */
thead th { font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em;
           line-height:1.25; color:var(--muted); border-top:2px solid var(--ink);
           border-bottom:1px solid var(--rule); }
td[colspan] { color:var(--muted); }  /* the "+ N more …" tail summary row */
tbody tr:hover { background:var(--wash); }
button { font-family:var(--sans); font-size:.82rem; font-weight:600; padding:.5em 1em;
         color:var(--ink); background:transparent; border:1px solid var(--ink);
         border-radius:8px; cursor:pointer; }
button:hover:not(:disabled) { background:var(--ink); color:var(--paper); }
button:disabled { opacity:.4; cursor:not-allowed; }
input, select, textarea { font-family:var(--mono); font-size:.82rem; padding:.5em .7em;
         color:var(--ink); background:var(--surface); border:1px solid var(--rule);
         border-radius:8px; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
details { background:var(--surface); border:1px solid var(--rule); border-radius:10px;
          padding:.6em .9em; margin:1rem 0; }
summary { cursor:pointer; font-size:.85rem; font-weight:600; }
hr { border:none; border-top:3px double var(--rule); margin:2.4rem 0; }
pre { white-space:pre-wrap; overflow-wrap:anywhere;                /* commands only — WHY.md §2 */
      font-family:var(--mono); font-size:.8rem; line-height:1.65; padding:1em 1.1em;
      background:var(--term-bg); color:var(--term-fg);
      border:1px solid var(--term-edge); border-radius:14px; }
pre#console-log { min-height:6em; max-height:26em; overflow:auto; }
pre#console-log:empty::before { content:"strfry console — read-only verbs only";
                                color:oklch(.6 .01 60); }
.console-row { display:flex; align-items:center; gap:.5em; margin:.6rem 0; }
.console-row .prompt { font-family:var(--mono); color:var(--good); }
.console-row input { flex:1; }
#records-container p { padding-bottom:.6em; border-bottom:1px solid var(--hair); }
header#s86 { position:sticky; top:0; z-index:5; margin-bottom:1.4rem;
             background:var(--paper); border-bottom:3px double var(--rule); }
header#s86 .brand { display:flex; align-items:baseline; gap:.8em; padding:.9rem 0 .6rem; }
header#s86 a.logo { font-family:var(--serif); font-weight:bold; font-size:1.5rem;
                    letter-spacing:-.02em; white-space:nowrap;
                    text-decoration:none; color:inherit; }
header#s86 .tagline { font-size:.65rem; font-weight:600; letter-spacing:.14em;
                      text-transform:uppercase; color:var(--muted); }
header#s86 .spacer { flex:1; }
header#s86 .bar { display:flex; align-items:center; gap:.5em; flex-wrap:wrap;
                  border-top:1px solid var(--rule); }
header#s86 nav { display:flex; flex-wrap:wrap; }
header#s86 nav a { padding:.7em .75em; font-size:.82rem; font-weight:600;
                   color:var(--muted); text-decoration:none;
                   border-bottom:2px solid transparent; }
header#s86 nav a:hover { color:var(--ink); }
header#s86 nav a[aria-current="page"] { color:var(--ink); border-bottom-color:var(--accent); }
header#s86 input#q { flex:1; min-width:8em; max-width:24em; margin-left:auto; }
header#s86 button#theme-btn { border-color:var(--rule); padding:.45em .7em; }
@media (max-width:600px) {
  body { font-size:1rem; padding:0 1em 3em; }
  /* Nothing may push the page wider than the screen (rendering rule 5), so
     at phone widths every cell breaks an unbreakable key — an npub, a hex id,
     a nip-05 address — rather than let the table overflow. */
  th, td { padding:.5em .35em; overflow-wrap:anywhere; }
  .nowrap { white-space:normal; }
  header#s86 .tagline { display:none; }
  header#s86 input#q { max-width:none; margin:0 0 .5em; }
}
</style>
</head>
<body>
<h1>Bans</h1>
<p id="status"></p>
<p id="name-status-line" style="display:none"></p>
<div id="command-block-container" style="display:none"></div>
<div id="admin-controls" style="display:none">
  <h2>Ban a pubkey</h2>
  <form id="ban-form">
    <div><input id="ban-input" type="text" placeholder="npub or hex, one or more (comma/space separated)"></div>
    <div><input id="ban-reason" type="text" placeholder="reason (optional)"></div>
    <button type="submit">Ban</button>
  </form>
</div>
<div id="records-list"></div>
<p>These npubs are banned from this relay.</p>
<p id="appeal-line" style="display:none"></p>
<p><input id="filter-input" type="search" placeholder="filter bans"></p>
<label id="select-all-label" style="display:none"><input id="select-all" type="checkbox"> Select visible</label>
<button id="unban-btn" type="button" style="display:none">Unban selected</button>
<button id="copy-purge-btn" type="button" style="display:none" disabled>Copy purge command</button>
<b id="selected-count"></b>
<p id="bulk-reason-row" style="display:none">
  <input id="bulk-reason-input" type="text" placeholder="reason for the selected bans — shown publicly" maxlength="500">
  <button id="bulk-reason-replace-btn" type="button" disabled>Replace reason</button>
  <button id="bulk-reason-append-btn" type="button" disabled>Append to reason</button>
</p>
<pre id="purge-pre" style="display:none"></pre>
<ul id="ban-list"></ul>
<script src="/common86.js"></script>
<script>
var adminPubkey = null;
var isAdmin = false;
var lastBanned = [];
var nameResolutionInFlight = false;
var attemptedThisSession = new Set();

var statusEl = document.getElementById('status');
var chrome = s86BuildPageChrome(statusEl);
var loginBtn = chrome.loginBtn;
var nameStatusEl = document.getElementById('name-status-line');
var commandBlockContainer = document.getElementById('command-block-container');
var adminControls = document.getElementById('admin-controls');
var appealEl = document.getElementById('appeal-line');
var unbanBtn = document.getElementById('unban-btn');
var copyPurgeBtn = document.getElementById('copy-purge-btn');
var purgePre = document.getElementById('purge-pre');
var banForm = document.getElementById('ban-form');
var banInput = document.getElementById('ban-input');
var banReason = document.getElementById('ban-reason');
var listEl = document.getElementById('ban-list');
var filterInput = document.getElementById('filter-input');
var selectAllLabel = document.getElementById('select-all-label');
var selectAll = document.getElementById('select-all');
var recordsList = document.getElementById('records-list');
var selectedCount = document.getElementById('selected-count');
var bulkReasonRow = document.getElementById('bulk-reason-row');
var bulkReasonInput = document.getElementById('bulk-reason-input');
var bulkReasonReplaceBtn = document.getElementById('bulk-reason-replace-btn');
var bulkReasonAppendBtn = document.getElementById('bulk-reason-append-btn');

function setStatus(text) {
  statusEl.textContent = text;
}

function updateBulkReasonButtons() {
  var n = listEl.querySelectorAll('.ban-checkbox:checked').length;
  var hasReason = bulkReasonInput.value.trim().length > 0;
  var disabled = n === 0 || !hasReason;
  bulkReasonReplaceBtn.disabled = disabled;
  bulkReasonAppendBtn.disabled = disabled;
}

function renderBans(banned) {
  lastBanned = banned;
  selectAll.checked = false;
  listEl.textContent = '';
  for (var i = 0; i < banned.length; i++) {
    var ban = banned[i];
    var li = document.createElement('li');

    if (isAdmin) {
      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.value = ban.pubkey;
      checkbox.className = 'ban-checkbox';
      li.appendChild(checkbox);
      li.appendChild(document.createTextNode(' '));
    }

    var nameSpan = document.createElement('b');
    if (ban.name) {
      nameSpan.textContent = ban.name + ' ';
    }
    li.appendChild(nameSpan);

    var nip05Span = document.createElement('span');
    if (ban.nip05) {
      nip05Span.textContent = ban.nip05 + ' ';
    }
    li.appendChild(nip05Span);

    li.appendChild(s86NpubLink(ban.npub, ban.pubkey, isAdmin));

    var dateEl = document.createElement('i');
    dateEl.textContent = s86FormatDate(ban.banned_at);
    li.appendChild(document.createTextNode(' — '));
    li.appendChild(dateEl);

    if (ban.report_type) {
      li.appendChild(document.createTextNode(' — '));
      li.appendChild(s86El('span', ban.report_type));
    }

    if (ban.reason) {
      li.appendChild(document.createTextNode(' — '));
      li.appendChild(s86El('span', ban.reason));
    }

    listEl.appendChild(li);
  }

  s86ApplyFilter(filterInput, listEl);
  s86UpdateSelectedCount(listEl, 'ban-checkbox', selectedCount, [copyPurgeBtn]);
  updateBulkReasonButtons();
  renderRecords();
  maybeResolveNamesExternally();
}

function renderRecords() {
  s86RenderRecords(recordsList, isAdmin, lastBanned, {
    onChanged: function () { loadBans(); },
    onError: setStatus
  });
}

function renderAppeal(contactAppeal) {
  var trimmed = (contactAppeal || '').trim();
  if (!trimmed) {
    appealEl.textContent = '';
    appealEl.style.display = 'none';
    return;
  }
  appealEl.textContent = 'To appeal, contact: ' + trimmed;
  appealEl.style.display = '';
}

function loadBans() {
  return fetch('/api/banned')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var firstLoad = adminPubkey === null;
      adminPubkey = data.admin;
      renderAppeal(data.contact_appeal);
      renderBans(data.banned);
      if (firstLoad) {
        s86TryAutoLogin(adminPubkey, loginBtn, statusEl, onLogin);
      }
    })
    .catch(function () {
      setStatus('failed to load ban list');
    });
}

function unresolvedPubkeys(banned) {
  var out = [];
  for (var i = 0; i < banned.length; i++) {
    var ban = banned[i];
    if (!ban.name && !ban.nip05 && !ban.name_checked_at && !attemptedThisSession.has(ban.pubkey)) {
      out.push(ban.pubkey);
    }
  }
  return out;
}

function maybeResolveNamesExternally() {
  if (!isAdmin || nameResolutionInFlight) {
    return;
  }
  var pubkeys = unresolvedPubkeys(lastBanned);
  if (pubkeys.length === 0) {
    return;
  }
  nameResolutionInFlight = true;
  pubkeys.forEach(function (pk) { attemptedThisSession.add(pk); });

  s86ResolveNamesExternally(pubkeys, {
    onDone: function (posted) {
      if (!posted) {
        nameResolutionInFlight = false;
        return;
      }
      loadBans().then(function () {
        renderNameStatusLine();
        nameResolutionInFlight = false;
      });
    },
    onError: function () {
      nameResolutionInFlight = false;
    }
  });
}

function renderNameStatusLine() {
  var n = 0, m = 0, k = 0;
  lastBanned.forEach(function (ban) {
    var hasName = !!(ban.name || ban.nip05);
    if (hasName && !ban.name_checked_at) {
      n++;
    } else if (hasName && ban.name_checked_at) {
      m++;
    } else {
      k++;
    }
  });
  nameStatusEl.textContent = 'resolved ' + n + ' locally, ' + m + ' via external lookup, ' + k + ' unresolved';
  nameStatusEl.style.display = '';
}

function onLogin() {
  isAdmin = true;
  commandBlockContainer.style.display = '';
  adminControls.style.display = '';
  selectAllLabel.style.display = '';
  unbanBtn.style.display = '';
  copyPurgeBtn.style.display = '';
  bulkReasonRow.style.display = '';
  renderBans(lastBanned);
}

s86WireLogin(loginBtn, statusEl, function () { return adminPubkey; }, onLogin);

commandBlockContainer.appendChild(s86BuildCommandGenerator());

s86WireFilter(filterInput, listEl);
s86WireSelectAll(selectAll, listEl, 'ban-checkbox', selectedCount, [copyPurgeBtn]);
s86WireCopyPurge(copyPurgeBtn, purgePre, listEl, 'ban-checkbox');

listEl.addEventListener('change', updateBulkReasonButtons);
selectAll.addEventListener('change', updateBulkReasonButtons);
bulkReasonInput.addEventListener('input', updateBulkReasonButtons);

unbanBtn.addEventListener('click', function () {
  if (!isAdmin) {
    return;
  }
  var checkboxes = listEl.querySelectorAll('.ban-checkbox:checked');
  var selected = [];
  for (var i = 0; i < checkboxes.length; i++) {
    selected.push(checkboxes[i].value);
  }
  if (selected.length === 0) {
    setStatus('nothing selected');
    return;
  }

  var entriesByPk = {};
  for (var i = 0; i < selected.length; i++) {
    var ban = lastBanned.find(function (b) { return b.pubkey === selected[i]; });
    entriesByPk[selected[i]] = {
      pubkey: selected[i],
      npub: ban ? ban.npub : null,
      name: ban ? ban.name : null,
      nip05: ban ? ban.nip05 : null,
      reason: ban ? ban.reason : ''
    };
  }

  s86SignAndPost('/api/unban', { pubkeys: selected })
    .then(function (result) {
      if (!result.ok) {
        setStatus('unban failed: ' + s86ErrMsg(result));
        return;
      }
      var removed = result.body.removed;
      setStatus('unbanned ' + removed.length + ' pubkey(s)');
      if (removed.length > 0) {
        s86AddRecord({
          type: 'unban',
          at: Date.now(),
          entries: removed.map(function (pk) {
            return entriesByPk[pk] || { pubkey: pk, npub: null, name: null, nip05: null, reason: '' };
          })
        });
      }
      return loadBans();
    })
    .catch(function () {
      setStatus('unban failed');
    });
});

banForm.addEventListener('submit', function (evt) {
  evt.preventDefault();
  if (!isAdmin) {
    return;
  }
  var raw = banInput.value.split(/[\s,]+/).map(function (s) { return s.trim(); }).filter(Boolean);
  if (raw.length === 0) {
    setStatus('nothing to ban');
    return;
  }
  var reason = banReason.value;
  var entries = raw.map(function (pk) { return { pubkey: pk, reason: reason }; });

  s86SignAndPost('/api/ban', { entries: entries })
    .then(function (result) {
      if (!result.ok) {
        setStatus('ban failed: ' + s86ErrMsg(result));
        return;
      }
      setStatus('banned ' + result.body.added.length + ' pubkey(s)'
        + (result.body.skipped.length ? ', skipped ' + result.body.skipped.length : ''));
      banInput.value = '';
      banReason.value = '';
      return loadBans().then(function () {
        var added = result.body.added.map(function (pk) {
          var ban = lastBanned.find(function (b) { return b.pubkey === pk; });
          return { pubkey: pk, npub: ban ? ban.npub : null, name: ban ? ban.name : null, nip05: ban ? ban.nip05 : null, reason: reason };
        });
        if (added.length > 0) {
          s86AddRecord({ type: 'ban', at: Date.now(), entries: added });
        }
        renderRecords();
      });
    })
    .catch(function () {
      setStatus('ban failed');
    });
});

function submitBulkReason(mode) {
  if (!isAdmin) {
    return;
  }
  var checkboxes = listEl.querySelectorAll('.ban-checkbox:checked');
  var selected = [];
  for (var i = 0; i < checkboxes.length; i++) {
    selected.push(checkboxes[i].value);
  }
  if (selected.length === 0) {
    setStatus('nothing selected');
    return;
  }
  var reason = bulkReasonInput.value;
  if (!reason) {
    setStatus('enter a reason first');
    return;
  }

  s86SignAndPost('/api/reason', { pubkeys: selected, reason: reason, mode: mode })
    .then(function (result) {
      if (!result.ok) {
        setStatus('set reason failed: ' + s86ErrMsg(result));
        return;
      }
      var updated = result.body.updated;
      setStatus('set reason on ' + updated.length + ' ban(s)'
        + (result.body.skipped.length ? ', skipped ' + result.body.skipped.length : ''));
      if (updated.length > 0) {
        s86AddRecord({
          type: 'reason',
          at: Date.now(),
          count: updated.length,
          entries: updated.length <= S86_REASON_UNDO_MAX
            ? updated.map(function (u) { return { pubkey: u.pubkey, old_reason: u.old_reason }; })
            : null
        });
      }
      bulkReasonInput.value = '';
      return loadBans();
    })
    .catch(function () {
      setStatus('set reason failed');
    });
}

bulkReasonReplaceBtn.addEventListener('click', function () { submitBulkReason('replace'); });
bulkReasonAppendBtn.addEventListener('click', function () { submitBulkReason('append'); });

loadBans();
</script>
</body>
</html>
