<title>strfry-86 — domain</title>
<style>
/* strfry-86 style block — canonical source. tools/stamp_style.py copies this
   file verbatim into every page's <style>, so "identical character-for-character
   on every page" is enforced by a command, not by discipline. Edit here only.

   Colours resolve through light-dark(), which reads the SAME color-scheme value
   the theme button and the anti-flash <script> already set on <html> — the
   toggle mechanism of WHY.md §3 is unchanged, only its palette is now ours.
   Where light-dark() is unsupported the @supports block below hands every token
   back to a system colour, i.e. back to the browser-default rendering this
   project shipped before the paint. */
:root {
  color-scheme: light dark;
  --paper:   light-dark(oklch(.985 .004 60),        oklch(.155 .005 60));
  --surface: light-dark(oklch(1 0 0),               oklch(.205 .005 60));
  --ink:     light-dark(oklch(.18 .005 60),         oklch(.93 .004 60));
  --muted:   light-dark(oklch(.18 .005 60 / .55),   oklch(.93 .004 60 / .55));
  --rule:    light-dark(oklch(.18 .005 60 / .15),   oklch(.93 .004 60 / .18));
  --hair:    light-dark(oklch(.18 .005 60 / .08),   oklch(.93 .004 60 / .1));
  --wash:    light-dark(oklch(.18 .005 60 / .06),   oklch(.93 .004 60 / .08));
  --accent:  light-dark(oklch(.45 .18 25),          oklch(.72 .16 25));
  --good:    light-dark(oklch(.5 .12 145),          oklch(.75 .14 145));
  --term-bg: oklch(.14 .005 60);
  --term-fg: oklch(.9 .01 145);
  --term-edge: oklch(.3 .01 60);
  --serif: Georgia, "PT Serif", "Iowan Old Style", "Times New Roman", serif;
  --sans: "Helvetica Neue", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, "IBM Plex Mono", monospace;
}
@supports not (color: light-dark(#000, #fff)) {
  :root { --paper:Canvas; --surface:Canvas; --ink:CanvasText; --muted:GrayText;
          --rule:GrayText; --hair:GrayText; --wash:transparent;
          --accent:LinkText; --good:CanvasText; }
}
* { box-sizing:border-box; }
body { max-width:68em; margin:0 auto; padding:0 1.5em 4em; font-size:.94rem;
       line-height:1.55; font-family:var(--sans);
       background:var(--paper); color:var(--ink); }           /* WHY.md §3 */
h1, h2 { font-family:var(--serif); font-weight:700; letter-spacing:-.01em; margin:0 0 .4rem; }
h1 { font-size:1.7rem; }
h2 { font-size:1.2rem; margin-top:2.2rem; }
h3 { font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.1em;
     color:var(--muted); margin:1.6rem 0 .5rem; }
p { margin:.5rem 0; }
a { color:var(--accent); text-underline-offset:2px; }
li { overflow-wrap:anywhere; }
code { font-family:var(--mono); font-size:.85em; }
.mono { font-family:var(--mono); font-size:.9em; }
.nowrap { white-space:nowrap; }      /* already-truncated ids — never wrapped mid-key */
.muted, #status, #feed-age, #provenance-line, #truncated-line { color:var(--muted); }
.page-head { display:flex; align-items:baseline; justify-content:space-between;
             gap:1em; flex-wrap:wrap; }
.badge { font-family:var(--mono); font-size:.72rem; padding:.15em .5em; white-space:nowrap;
         background:var(--wash); border:1px solid var(--rule); border-radius:6px; }
.pill { display:inline-flex; align-items:center; gap:.45em; font-family:var(--mono);
        font-size:.7rem; letter-spacing:.08em; padding:.35em .75em;
        border:1px solid currentColor; border-radius:8px; color:var(--muted); }
.pill.live { color:var(--good); }
.pill .dot { width:.45em; height:.45em; border-radius:50%; background:currentColor; }
.chip { display:inline-block; font-family:var(--mono); font-size:.7rem; padding:.2em .6em;
        border:1px solid currentColor; border-radius:6px; color:var(--muted); }
.chip.good { color:var(--good); }
.chip.bad { color:var(--accent); }
.chips { display:flex; flex-wrap:wrap; gap:.4em; margin:.6rem 0; }
button.chip.cmd { font-weight:400; background:transparent; color:var(--ink);
                  border-color:var(--rule); }
button.chip.cmd:hover { background:var(--ink); color:var(--paper); }
/* Identity dot, never an avatar: the hue comes from the pubkey itself, so no
   row on any page ever fetches an image from a stranger's host. */
.idot { width:.75em; height:.75em; border-radius:50%; flex:none;
        background:oklch(.65 .11 var(--h, 0)); }
.idot.unknown { background:var(--rule); }
.idot.big { width:4.5em; height:4.5em; }
.profile-head { display:flex; gap:1.5em; align-items:flex-start; padding-bottom:1.4rem;
                margin-bottom:1.2rem; border-bottom:1px solid var(--rule); }
.profile-head .profile-id { flex:1; min-width:0; }
.profile-head .profile-id > * { margin:.25rem 0; }
.profile-head h2 { font-size:1.5rem; margin:0; }
td.identity { display:flex; align-items:center; gap:.5em; white-space:nowrap;
              max-width:15em; }
td.identity > :last-child { overflow:hidden; text-overflow:ellipsis; }
td.num { font-family:var(--mono); font-size:.9em; }
td.num.bad { color:var(--accent); }
td.pick { width:1.5em; }
td.action { text-align:right; white-space:nowrap; }
/* A clipped cell must not be allowed to size its column, or one long note
   pushes every other column off the page. max-width:0 hands the column its
   width from the table instead; `.grow` then gives it whatever is left. */
td.clip { max-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
th.grow, td.grow { width:100%; }
.struck { text-decoration:line-through; }
/* A control that reads as a link but IS a button — it performs an action, so
   it must be a button for the keyboard and the screen reader both. */
button.linky { font-size:.78rem; font-weight:400; padding:.15em .3em; border:none;
               background:none; color:var(--accent); text-decoration:underline;
               text-underline-offset:2px; }
button.linky:hover:not(:disabled) { background:none; color:var(--accent); opacity:.7; }
.toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:.6em; margin:.7rem 0; }
.toolbar > input[type="search"], .toolbar > input[type="text"] { flex:1; min-width:12em; }
.modes { display:flex; flex-direction:column; gap:.3em; }
.modes label { display:flex; align-items:baseline; gap:.5em; font-size:.88rem; }
dl.tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(11em, 1fr));
           gap:1px; margin:1.2rem 0; background:var(--rule);
           border:1px solid var(--rule); border-radius:10px; overflow:hidden; }
dl.tiles .tile { background:var(--surface); padding:.9em 1em; }
dl.tiles dt { font-size:.68rem; font-weight:600; text-transform:uppercase;
              letter-spacing:.08em; color:var(--muted); }
dl.tiles dd { margin:.3rem 0 0; font-family:var(--serif); font-size:1.5rem;
              font-weight:700; letter-spacing:-.02em; }
dl.tiles .note { margin:.2rem 0 0; font-family:var(--mono); font-size:.68rem; color:var(--muted); }
dl.tiles .note.bad { color:var(--accent); }
.field-row { display:grid; grid-template-columns:16em 1fr; gap:1.2em;
             align-items:baseline; padding:.45em 0; }
.field-label { font-size:.85rem; color:var(--muted); }
.field-control input[type="text"], .field-control input[type="number"] { width:100%; max-width:24em; }
.field-control .note { margin:.2rem 0 0; font-size:.72rem; color:var(--muted); }
/* Compact progress: the "N of ~M" size figure is the one number that matters
   mid-run, so it steps out of the muted note colour into full ink + bold. */
.field-control .note .figure { color:var(--ink); font-weight:700;
                               font-family:var(--mono); }
/* Range shares the same chrome as settings buttons: ink border, 8px radius,
   sans label weight. The native track is replaced so it does not look like a
   browser default next to Save / Edit raw. */
.field-control input[type="range"] {
  -webkit-appearance: none; appearance: none;
  flex:1; min-width:10em; max-width:18em; height:2.35em; margin:0;
  font-family:var(--sans); font-size:.82rem; font-weight:600;
  color:var(--ink); background:transparent;
  border:1px solid var(--ink); border-radius:8px; cursor:pointer;
  padding:0 .7em;
}
.field-control input[type="range"]::-webkit-slider-runnable-track {
  height:2px; background:var(--rule); border-radius:1px;
}
.field-control input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width:1em; height:1em; margin-top:-.4em;
  background:var(--ink); border:1px solid var(--ink); border-radius:4px;
  cursor:pointer;
}
.field-control input[type="range"]::-moz-range-track {
  height:2px; background:var(--rule); border:none; border-radius:1px;
}
.field-control input[type="range"]::-moz-range-thumb {
  width:1em; height:1em;
  background:var(--ink); border:1px solid var(--ink); border-radius:4px;
  cursor:pointer;
}
.field-control .range-days {
  font-family:var(--sans); font-size:.82rem; font-weight:600;
  padding:.5em 1em; color:var(--ink); background:transparent;
  border:1px solid var(--ink); border-radius:8px; min-width:5.5em;
  text-align:center; white-space:nowrap;
}
textarea { width:100%; font-family:var(--mono); font-size:.78rem; line-height:1.6;
           padding:1em; resize:vertical; background:var(--term-bg); color:var(--term-fg);
           border:1px solid var(--term-edge); border-radius:14px; }
.console-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.2em; align-items:start; }
.console-grid h3 { display:flex; align-items:center; gap:.5em; }
.dot-inline { width:.5em; height:.5em; border-radius:50%; background:var(--good); flex:none; }
.dot-inline.warn { background:light-dark(oklch(.6 .14 80), oklch(.8 .14 80)); }
.dot-inline.off { background:var(--rule); }
table { width:100%; border-collapse:collapse; margin:.8rem 0 1.4rem; font-size:.92em; }
th, td { text-align:left; padding:.6em .7em; border-bottom:1px solid var(--hair);
         font-variant-numeric:tabular-nums; }
tbody th { font-weight:600; }        /* row label, not a column header */
thead th { font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em;
           line-height:1.25; color:var(--muted); border-top:2px solid var(--ink);
           border-bottom:1px solid var(--rule); }
td[colspan] { color:var(--muted); }  /* the "+ N more …" tail summary row */
tbody tr:hover { background:var(--wash); }
button { font-family:var(--sans); font-size:.82rem; font-weight:600; padding:.5em 1em;
         color:var(--ink); background:transparent; border:1px solid var(--ink);
         border-radius:8px; cursor:pointer; }
button:hover:not(:disabled) { background:var(--ink); color:var(--paper); }
button:disabled { opacity:.4; cursor:not-allowed; }
input, select, textarea { font-family:var(--mono); font-size:.82rem; padding:.5em .7em;
         color:var(--ink); background:var(--surface); border:1px solid var(--rule);
         border-radius:8px; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
details { background:var(--surface); border:1px solid var(--rule); border-radius:10px;
          padding:.6em .9em; margin:1rem 0; }
summary { cursor:pointer; font-size:.85rem; font-weight:600; }
hr { border:none; border-top:3px double var(--rule); margin:2.4rem 0; }
pre { white-space:pre-wrap; overflow-wrap:anywhere;                /* commands only — WHY.md §2 */
      font-family:var(--mono); font-size:.8rem; line-height:1.65; padding:1em 1.1em;
      background:var(--term-bg); color:var(--term-fg);
      border:1px solid var(--term-edge); border-radius:14px; }
pre#console-log, pre#decision-log { min-height:12em; max-height:26em; overflow:auto; }
/* A log line is one line. Wrapping a key across two rows makes a tail
   unreadable, so this panel scrolls sideways inside its own box — which the
   no-horizontal-scroll rule is about the PAGE, not about a terminal. */
pre#decision-log { white-space:pre; overflow-wrap:normal; }
pre#console-log:empty::before { content:"strfry console — read-only verbs only";
                                color:oklch(.6 .01 60); }
pre .good { color:oklch(.78 .1 145); }
pre .bad { color:oklch(.72 .16 25); }
pre .dim { color:oklch(.6 .01 60); }
/* Console answer (stdout): the one number that matters after a scan --count.
   Bold + good so it does not share weight with dimmed loguru leftovers. */
pre .console-answer { font-weight:700; }
.console-row { display:flex; align-items:center; gap:.5em; margin:.6rem 0; }
.console-row .prompt { font-family:var(--mono); color:var(--good); }
.console-row input { flex:1; }
#records-container p { padding-bottom:.6em; border-bottom:1px solid var(--hair); }
header#s86 { position:sticky; top:0; z-index:5; margin-bottom:1.4rem;
             background:var(--paper); border-bottom:3px double var(--rule); }
header#s86 .brand { display:flex; align-items:baseline; gap:.8em; padding:.9rem 0 .6rem; }
header#s86 a.logo { font-family:var(--serif); font-weight:bold; font-size:1.5rem;
                    letter-spacing:-.02em; white-space:nowrap;
                    text-decoration:none; color:inherit; }
header#s86 .tagline { font-size:.65rem; font-weight:600; letter-spacing:.14em;
                      text-transform:uppercase; color:var(--muted); }
header#s86 .spacer { flex:1; }
header#s86 .bar { display:flex; align-items:center; gap:.5em; flex-wrap:wrap;
                  border-top:1px solid var(--rule); }
header#s86 nav { display:flex; flex-wrap:wrap; }
header#s86 nav a { padding:.7em .75em; font-size:.82rem; font-weight:600;
                   color:var(--muted); text-decoration:none;
                   border-bottom:2px solid transparent; }
header#s86 nav a:hover { color:var(--ink); }
header#s86 nav a[aria-current="page"] { color:var(--ink); border-bottom-color:var(--accent); }
header#s86 input#q { flex:1; min-width:8em; max-width:24em; margin-left:auto; }
header#s86 button#theme-btn { border-color:var(--rule); padding:.45em .7em; }
@media (max-width:600px) {
  body { font-size:1rem; padding:0 1em 3em; }
  /* Nothing may push the page wider than the screen (rendering rule 5), so
     at phone widths every cell breaks an unbreakable key — an npub, a hex id,
     a nip-05 address — rather than let the table overflow. */
  th, td { padding:.5em .35em; overflow-wrap:anywhere; }
  .nowrap { white-space:normal; }
  td.clip { max-width:none; white-space:normal; }
  .console-grid { grid-template-columns:1fr; }
  .field-row { grid-template-columns:1fr; gap:.2em; }
  header#s86 .tagline { display:none; }
  header#s86 input#q { max-width:none; margin:0 0 .5em; }
}
</style>

<body>
<h1>Domain roster</h1>
<p id="status"></p>
<div id="admin-section" style="display:none">
  <div id="command-block-container"></div>
  <div id="records-list"></div>

  <p>
    <input id="domain-input" type="text" placeholder="example.com">
    <button id="fetch-roster-btn" type="button">Fetch roster</button>
  </p>
  <p id="fetch-fail-info" style="display:none"></p>
  <details id="paste-details">
    <summary>fetch failed? paste it here</summary>
    <div id="curl-hint-container"></div>
    <p><textarea id="paste-textarea" rows="6" cols="50" placeholder='{"names": {"bob": "&lt;hex pubkey&gt;"}}'></textarea></p>
    <p><button id="paste-submit-btn" type="button">Use pasted roster</button></p>
  </details>

  <div id="domain-tiles"></div>
  <p id="provenance-line"></p>
  <p><input id="filter-input" type="search" placeholder="filter roster — name, nip05, or npub"></p>
  <div id="sort-row"></div>
  <label id="select-all-label"><input id="select-all" type="checkbox"> Select visible</label>
  <button id="ban-btn" type="button">Ban selected</button>
  <button id="copy-purge-btn" type="button" disabled>Copy purge command</button>
  <input id="ban-reason" type="text" placeholder="reason (optional)">
  <b id="selected-count"></b>
  <pre id="purge-pre" style="display:none"></pre>
  <p id="truncated-line"></p>
  <div id="roster-list"></div>
</div>
<script src="/common86.js"></script>
<script>
var S86_DOMAIN_LOOKUP_MAX_CLIENT = 1000;
var RENDER_MAX_CLIENT = 500;

var adminPubkey = null;
var isAdmin = false;
var lastBanned = [];
var bannedPubkeys = {};
var lastLookup = null;        // raw POST /api/pubkeys/lookup response
var localPartByPubkey = {};   // pubkey -> the roster's own name key, from the last fetch
var currentDomain = '';
var currentRenderedRows = [];

var sortField = 'name';
var sortDir = 'asc';

var statusEl = document.getElementById('status');
var chrome = s86BuildPageChrome(statusEl);
var loginBtn = chrome.loginBtn;
var adminSection = document.getElementById('admin-section');
var commandBlockContainer = document.getElementById('command-block-container');
var recordsList = document.getElementById('records-list');
var domainInput = document.getElementById('domain-input');
var fetchRosterBtn = document.getElementById('fetch-roster-btn');
var fetchFailInfo = document.getElementById('fetch-fail-info');
var pasteDetails = document.getElementById('paste-details');
var curlHintContainer = document.getElementById('curl-hint-container');
var pasteTextarea = document.getElementById('paste-textarea');
var pasteSubmitBtn = document.getElementById('paste-submit-btn');
var provenanceLine = document.getElementById('provenance-line');
var filterInput = document.getElementById('filter-input');
var sortRowEl = document.getElementById('sort-row');
var selectAll = document.getElementById('select-all');
var banBtn = document.getElementById('ban-btn');
var copyPurgeBtn = document.getElementById('copy-purge-btn');
var banReason = document.getElementById('ban-reason');
var selectedCount = document.getElementById('selected-count');
var purgePre = document.getElementById('purge-pre');
var truncatedLine = document.getElementById('truncated-line');
var listEl = document.getElementById('roster-list');
var domainTiles = document.getElementById('domain-tiles');

function setStatus(text) {
  statusEl.textContent = text;
}

// --- roster extraction ---------------------------------------------------
// Accepts both a bare `names` map and a full NIP-05 document; anything
// else (relays, nip46, ...) is ignored. Every value is validated as
// 64-hex client-side BEFORE posting — if even one entry is malformed the
// whole lookup is refused, matching the server's own "reject, never
// silently drop a roster row" rule, rather than quietly proceeding with
// a partial list the admin didn't ask for.

function extractNamesMap(parsed) {
  if (parsed && typeof parsed === 'object' && parsed.names && typeof parsed.names === 'object') {
    return parsed.names;
  }
  if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
    return parsed;
  }
  return null;
}

function showNoDirectory() {
  var domain = domainInput.value.trim();
  currentDomain = domain;
  localPartByPubkey = {};
  lastLookup = {
    domain: domain, results: [],
    _fetchedAt: Math.floor(Date.now() / 1000),
    _singleEntry: false, _noDirectory: true
  };
  renderRoster();
}

function processRoster(rawText) {
  var parsed;
  try {
    parsed = JSON.parse(rawText);
  } catch (e) {
    setStatus('could not parse that as JSON');
    return;
  }
  var names = extractNamesMap(parsed);
  if (!names || typeof names !== 'object' || Object.keys(names).length === 0) {
    // "no names map at all" and "a names map with nothing in it" are the
    // same claim about the domain, and CLAUDE.md is explicit that this
    // reports as a persistent state, not a transient status line —
    // reporting zero users would be a different, misleading claim.
    showNoDirectory();
    return;
  }

  var entries = Object.keys(names);
  if (entries.length > S86_DOMAIN_LOOKUP_MAX_CLIENT) {
    setStatus('roster has ' + entries.length + ' entries, over the ' + S86_DOMAIN_LOOKUP_MAX_CLIENT + ' limit — refusing rather than truncating');
    return;
  }

  var pubkeys = [];
  localPartByPubkey = {};
  for (var i = 0; i < entries.length; i++) {
    var localPart = entries[i];
    var value = names[localPart];
    if (typeof value !== 'string' || !/^[0-9a-fA-F]{64}$/.test(value)) {
      setStatus('malformed pubkey for "' + localPart + '" — refusing the whole roster rather than dropping one row');
      return;
    }
    var hex = value.toLowerCase();
    pubkeys.push(hex);
    if (!(hex in localPartByPubkey)) {
      localPartByPubkey[hex] = localPart;
    }
  }

  var singleEntry = entries.length === 1;
  runLookup(pubkeys, singleEntry);
}

function runLookup(pubkeys, singleEntry) {
  if (!isAdmin) {
    return;
  }
  var domain = domainInput.value.trim();
  if (!domain) {
    setStatus('enter a domain first');
    return;
  }
  currentDomain = domain;
  setStatus('looking up ' + pubkeys.length + ' pubkey(s)…');

  s86SignAndPost('/api/pubkeys/lookup', { pubkeys: pubkeys, domain: domain })
    .then(function (result) {
      if (!result.ok) {
        setStatus('lookup failed: ' + s86ErrMsg(result));
        return;
      }
      setStatus('');
      lastLookup = result.body;
      lastLookup._fetchedAt = Math.floor(Date.now() / 1000);
      lastLookup._singleEntry = singleEntry;
      renderRoster();
    })
    .catch(function () {
      setStatus('lookup failed');
    });
}

// The curl fallback lives HERE, at the point of failure, rather than in
// the command generator — that generator's domain-fetch intent was
// dropped as a duplicate of exactly this page action.
function updateCurlHint() {
  var domain = domainInput.value.trim();
  curlHintContainer.textContent = '';
  if (domain) {
    s86AppendCommandBox(curlHintContainer, 'curl -s https://' + domain + '/.well-known/nostr.json');
  }
}
domainInput.addEventListener('input', updateCurlHint);
updateCurlHint();

// A fetch failure is almost always CORS (the domain's server, not this
// one, decides whether a browser may read the response) — not a broken
// domain — so the way out is never "try again," it's a path that doesn't
// go through the browser's CORS check at all: open the URL directly (a
// top-level navigation isn't subject to it) or run the equivalent curl
// command server-side and paste the result below.
function showFetchFailure(domain) {
  var url = 'https://' + domain + '/.well-known/nostr.json';
  setStatus('fetch failed — CORS or network error.');
  fetchFailInfo.textContent = '';
  fetchFailInfo.appendChild(document.createTextNode('Try '));
  var a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.textContent = 'opening the URL directly';
  fetchFailInfo.appendChild(a);
  fetchFailInfo.appendChild(document.createTextNode(', or run the command below and paste its output.'));
  fetchFailInfo.style.display = '';
  updateCurlHint();
  pasteDetails.open = true;
}

function fetchRoster() {
  var domain = domainInput.value.trim();
  if (!domain) {
    setStatus('enter a domain first');
    return;
  }
  fetchFailInfo.style.display = 'none';
  updateCurlHint();
  setStatus('fetching .well-known/nostr.json…');
  fetch('https://' + domain + '/.well-known/nostr.json')
    .then(function (res) {
      if (!res.ok) {
        throw new Error('http ' + res.status);
      }
      return res.text();
    })
    .then(function (text) {
      setStatus('');
      processRoster(text);
    })
    .catch(function () {
      showFetchFailure(domain);
    });
}

fetchRosterBtn.addEventListener('click', fetchRoster);

pasteSubmitBtn.addEventListener('click', function () {
  processRoster(pasteTextarea.value);
});

// --- sort -------------------------------------------------------------

var SORT_COMPARATORS = {
  name: function (a, b) {
    var an = a.name || '', bn = b.name || '';
    if (!an && !bn) { return 0; }
    if (!an) { return 1; }
    if (!bn) { return -1; }
    return an < bn ? -1 : (an > bn ? 1 : 0);
  },
  events: function (a, b) { return (a.scan_count || 0) - (b.scan_count || 0); },
  banned: function (a, b) { return (a.banned ? 1 : 0) - (b.banned ? 1 : 0); },
  claims_domain: function (a, b) { return (a.claims_domain ? 1 : 0) - (b.claims_domain ? 1 : 0); }
};

sortRowEl.appendChild(s86BuildSortRow(
  [
    { key: 'name', label: 'name', dir: 'asc' },
    { key: 'events', label: 'events', dir: 'desc' },
    { key: 'banned', label: 'banned', dir: 'desc' },
    { key: 'claims_domain', label: 'claims domain', dir: 'desc' }
  ],
  sortField, sortDir,
  function (field, dir) {
    sortField = field;
    sortDir = dir;
    renderRoster();
  }
));

// --- rendering ------------------------------------------------------------

function renderProvenance() {
  if (!lastLookup) {
    provenanceLine.textContent = '';
    return;
  }
  if (lastLookup._singleEntry || lastLookup._noDirectory) {
    provenanceLine.textContent = 'this domain does not publish a full directory';
    return;
  }
  var results = lastLookup.results || [];
  var bannedCount = results.filter(function (r) { return r.banned; }).length;
  var scannedCount = results.filter(function (r) { return r.scan_count !== null && r.scan_count !== undefined; }).length;
  provenanceLine.textContent = results.length + ' pubkeys listed by ' + lastLookup.domain
    + ', fetched ' + s86FormatDate(lastLookup._fetchedAt)
    + ' — ' + bannedCount + ' already banned, ' + scannedCount + ' seen in the current scan';
}

function claimsDomainLabel(r) {
  if (!r.nip05) {
    return 'listed, claims nothing';
  }
  var at = r.nip05.lastIndexOf('@');
  var claimedDomain = at === -1 ? r.nip05 : r.nip05.slice(at + 1);
  return r.claims_domain ? 'listed, claims this domain' : ('listed, but claims ' + claimedDomain);
}

function matchesQuery(r, q) {
  if (!q) {
    return true;
  }
  return [r.name, r.nip05, r.npub, r.pubkey, localPartByPubkey[r.pubkey]]
    .join(' ').toLowerCase().indexOf(q) !== -1;
}

function renderRoster() {
  renderProvenance();
  var all = (lastLookup && lastLookup.results) || [];
  var q = filterInput.value.trim().toLowerCase();
  var sorted = s86SortRows(all.filter(function (r) { return matchesQuery(r, q); }),
    SORT_COMPARATORS[sortField], sortDir);
  var truncation = s86TruncateForRender(sorted, RENDER_MAX_CLIENT);
  currentRenderedRows = truncation.shown;

  selectAll.checked = false;
  listEl.textContent = '';

  renderDomainTiles(all);

  if (currentRenderedRows.length === 0) {
    listEl.appendChild(s86El('p', 'no roster loaded yet'));
    truncatedLine.textContent = '';
    s86UpdateSelectedCount(listEl, 'roster-checkbox', selectedCount, [copyPurgeBtn]);
    return;
  }

  var table = document.createElement('table');
  table.appendChild(s86BuildTableHead(
    ['', 'Name', 'Pubkey', 'Events', 'Status', 'NIP-05'], 5));
  var tbody = document.createElement('tbody');
  currentRenderedRows.forEach(function (r) {
    var tr = document.createElement('tr');
    tr.setAttribute('data-pubkey', r.pubkey);

    var isSelf = r.pubkey === adminPubkey;
    var boxTd = s86El('td', null, 'pick');
    if (!r.banned && !isSelf) {
      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.value = r.pubkey;
      checkbox.className = 'roster-checkbox';
      checkbox.setAttribute('aria-label', 'select ' + (r.npub || r.pubkey));
      boxTd.appendChild(checkbox);
    }
    tr.appendChild(boxTd);

    var localPart = localPartByPubkey[r.pubkey];
    tr.appendChild(s86BuildIdentityCell({
      pubkey: r.pubkey, npub: r.npub, name: localPart || r.name, nip05: null
    }, isAdmin));

    var keyTd = s86El('td', s86ShortKey(r.npub || r.pubkey), 'mono nowrap');
    keyTd.title = r.npub || r.pubkey;
    tr.appendChild(keyTd);

    tr.appendChild(s86El('td',
      (r.scan_count === null || r.scan_count === undefined) ? '—' : Number(r.scan_count).toLocaleString(),
      'num'));

    var statusTd = document.createElement('td');
    if (r.banned) {
      var chip = s86El('span', 'banned', 'chip bad');
      if (r.ban_reason) {
        chip.title = r.ban_reason;
      }
      statusTd.appendChild(chip);
    } else if (r.claims_domain) {
      statusTd.appendChild(s86El('span', 'verified', 'chip good'));
    } else {
      statusTd.appendChild(s86El('span', 'listed', 'chip'));
    }
    tr.appendChild(statusTd);

    var claimTd = s86El('td', claimsDomainLabel(r), 'clip muted');
    claimTd.title = r.nip05 || '';
    tr.appendChild(claimTd);

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  listEl.appendChild(table);

  if (truncation.truncatedCount > 0) {
    truncatedLine.textContent = 'showing top ' + RENDER_MAX_CLIENT + ' of ' + truncation.totalCount + ' — filter to narrow';
  } else {
    truncatedLine.textContent = '';
  }

  s86UpdateSelectedCount(listEl, 'roster-checkbox', selectedCount, [copyPurgeBtn]);
}

// Three figures about the roster on screen, all counted from it — this page
// never asks the network for anything the roster fetch did not already bring
// back.
function renderDomainTiles(rows) {
  if (!domainTiles) {
    return;
  }
  domainTiles.textContent = '';
  if (rows.length === 0) {
    return;
  }
  var verified = rows.filter(function (r) { return r.claims_domain; }).length;
  var banned = rows.filter(function (r) { return r.banned; }).length;
  domainTiles.appendChild(s86BuildTiles([
    { label: 'Listed pubkeys', value: rows.length.toLocaleString(), note: 'in /.well-known/nostr.json' },
    {
      label: 'Claim this domain',
      value: verified.toLocaleString(),
      note: rows.length ? ((verified / rows.length * 100).toFixed(0) + '% of listed') : null
    },
    {
      label: 'Already banned',
      value: banned.toLocaleString(),
      note: banned ? 'of the listed pubkeys' : 'none of the listed pubkeys',
      tone: banned ? 'bad' : null
    }
  ]));
}

function renderRecords() {
  s86RenderRecords(recordsList, isAdmin, lastBanned, {
    onChanged: function () {
      loadBanned().then(function () {
        renderRecords();
        if (lastLookup && lastLookup.results && lastLookup.results.length > 0) {
          runLookup(lastLookup.results.map(function (r) { return r.pubkey; }), lastLookup._singleEntry);
        }
      });
    },
    onError: setStatus
  });
}

function loadBanned() {
  return fetch('/api/banned')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var firstLoad = adminPubkey === null;
      adminPubkey = data.admin;
      lastBanned = data.banned;
      bannedPubkeys = {};
      lastBanned.forEach(function (b) { bannedPubkeys[b.pubkey] = true; });
      if (firstLoad) {
        s86TryAutoLogin(adminPubkey, loginBtn, statusEl, onLogin);
      }
    })
    .catch(function () {
      setStatus('failed to load ban list');
    });
}

var autoFetchedDomain = false;

function onLogin() {
  isAdmin = true;
  adminSection.style.display = '';
  renderRecords();
  // Autofetch only fires here, not on page load — the fetch's own
  // result is thrown away by runLookup() until isAdmin is true (the
  // authenticated POST /api/pubkeys/lookup requires it), so firing any
  // earlier would just be a wasted request against the domain's server.
  if (prefillDomain && !autoFetchedDomain) {
    autoFetchedDomain = true;
    fetchRoster();
  }
}

s86WireLogin(loginBtn, statusEl, function () { return adminPubkey; }, onLogin);

var params = new URLSearchParams(window.location.search);
var prefillDomain = params.get('d') || '';
if (prefillDomain) {
  domainInput.value = prefillDomain;
}

commandBlockContainer.appendChild(s86BuildCommandGenerator());

filterInput.addEventListener('input', function () {
  renderRoster();
});
s86WireSelectAll(selectAll, listEl, 'roster-checkbox', selectedCount, [copyPurgeBtn]);
s86WireCopyPurge(copyPurgeBtn, purgePre, listEl, 'roster-checkbox');

banBtn.addEventListener('click', function () {
  if (!isAdmin) {
    return;
  }
  var checkboxes = listEl.querySelectorAll('.roster-checkbox:checked');
  var selected = [];
  for (var i = 0; i < checkboxes.length; i++) {
    selected.push(checkboxes[i].value);
  }
  if (selected.length === 0) {
    setStatus('nothing selected');
    return;
  }
  var reason = banReason.value;
  var entries = selected.map(function (pk) { return { pubkey: pk, reason: reason }; });
  var byPubkey = {};
  ((lastLookup && lastLookup.results) || []).forEach(function (r) { byPubkey[r.pubkey] = r; });

  // Sending the domain alongside the pubkeys is what lets the Banlist show
  // this as one "Banned NIP-05 Domains" row with a single Unban, instead of
  // N loose pubkeys nobody can connect back to where they came from. It
  // changes nothing about enforcement — the pubkeys are still what enforce.
  s86SignAndPost('/api/ban', { entries: entries, domain: lastLookup && lastLookup.domain, reason: reason })
    .then(function (result) {
      if (!result.ok) {
        setStatus('ban failed: ' + s86ErrMsg(result));
        return;
      }
      setStatus('banned ' + result.body.added.length + ' pubkey(s)'
        + (result.body.domain ? ' from ' + result.body.domain : '')
        + (result.body.skipped.length ? ', skipped ' + result.body.skipped.length : ''));
      var added = result.body.added.map(function (pk) {
        var r = byPubkey[pk];
        return { pubkey: pk, npub: r ? r.npub : null, name: r ? r.name : null, nip05: r ? r.nip05 : null, reason: reason };
      });
      if (added.length > 0) {
        s86AddRecord({ type: 'ban', at: Date.now(), entries: added });
      }
      return loadBanned().then(function () {
        renderRecords();
        if (lastLookup && lastLookup.results && lastLookup.results.length > 0) {
          runLookup(lastLookup.results.map(function (r) { return r.pubkey; }), lastLookup._singleEntry);
        }
      });
    })
    .catch(function () {
      setStatus('ban failed');
    });
});

loadBanned();
</script>
</body>
</html>
