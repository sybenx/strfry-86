<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var s86t=localStorage.getItem('strfry86_theme');if(s86t==='light'||s86t==='dark'){document.documentElement.style.colorScheme=s86t;}}catch(e){}</script>
<title>strfry-86 — activity</title>
<style>
body { max-width:40em; margin:0 auto; padding:0 1em; }
li { overflow-wrap:anywhere; }
pre { white-space:pre-wrap; overflow-wrap:anywhere; }   /* commands only — WHY.md §2 */
@media (max-width:600px){ body{ font-size:1.15em; } }
:root { color-scheme: light dark; }
body { background:Canvas; color:CanvasText; }           /* required — WHY.md §3 */
header#s86 { position:sticky; top:0; background:Canvas; display:flex;
             gap:1em; align-items:center; padding:.5em 0; }
header#s86 a.logo { text-decoration:none; color:inherit; font-weight:bold; }
header#s86 input#q { flex:1; min-width:8em; }
</style>
</head>
<body>
<h1>Activity</h1>
<p id="status"></p>
<p id="feed-age"></p>
<div id="feed-container"></div>
<script src="/common86.js"></script>
<script>
// Public landing: kind, timestamp, event id only. No pubkeys, content, or
// npubs — the server strips the payload; this page never asks for more.
// Fed entirely by the shared live layer (GET /api/live, one server-side
// poll loop fanned out over SSE to every open /home and /stats tab) — no
// history fetch, per CLAUDE.md. A freshly opened tab renders nothing until
// the connection's first message arrives, which carries the server's
// current ring buffer (up to RENDER_MAX events), not this browser's own
// history.
var KNOWN_KINDS = {
  0: 'profile', 1: 'note', 5: 'deletion', 6: 'repost', 7: 'reaction',
  1059: 'gift wrap', 1984: 'report', 9735: 'zap receipt',
  10002: 'relay list', 10050: 'DM relay list', 30023: 'long-form'
};
var adminPubkey = null;

var statusEl = document.getElementById('status');
var feedAgeEl = document.getElementById('feed-age');
var feedContainer = document.getElementById('feed-container');
var chrome = s86BuildPageChrome(statusEl);
var loginBtn = chrome.loginBtn;

function setStatus(text) {
  statusEl.textContent = text;
}

function kindLabel(kind) {
  return KNOWN_KINDS[kind] ? (kind + ' ' + KNOWN_KINDS[kind]) : String(kind);
}

function shortId(id) {
  if (!id || id.length < 16) {
    return id || '';
  }
  return id.slice(0, 8) + '…' + id.slice(-8);
}

function renderFeed(data) {
  feedContainer.textContent = '';
  if (data.error) {
    feedAgeEl.textContent = 'live feed could not run — ' + data.error;
  } else if (data.at != null) {
    feedAgeEl.textContent = 'live as of ' + s86FormatDate(data.at)
      + ' (' + s86FormatRelativeAge(data.at) + ')';
  } else {
    feedAgeEl.textContent = '';
  }
  var events = (data.events || []).slice(-S86_RENDER_MAX).slice().reverse();
  if (events.length === 0) {
    feedContainer.appendChild(s86El('p', 'no events yet — waiting on the live feed'));
    return;
  }
  var table = document.createElement('table');
  var thead = document.createElement('thead');
  var hr = document.createElement('tr');
  ['kind', 'time', 'event id'].forEach(function (label) {
    hr.appendChild(s86El('th', label));
  });
  thead.appendChild(hr);
  table.appendChild(thead);
  var tbody = document.createElement('tbody');
  events.forEach(function (ev) {
    var tr = document.createElement('tr');
    tr.appendChild(s86El('td', kindLabel(ev.kind)));
    tr.appendChild(s86El('td', s86FormatDate(ev.created_at)));
    var idTd = document.createElement('td');
    idTd.textContent = shortId(ev.id);
    idTd.title = ev.id || '';
    tr.appendChild(idTd);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  feedContainer.appendChild(table);
}

function onLogin() {
  setStatus('logged in as admin');
}

s86WireLogin(loginBtn, statusEl, function () { return adminPubkey; }, onLogin);

// Resolve admin pubkey so login works (same public endpoint as bans).
fetch('/api/banned')
  .then(function (res) { return res.json(); })
  .then(function (data) {
    adminPubkey = data.admin;
    s86TryAutoLogin(adminPubkey, loginBtn, statusEl, onLogin);
  })
  .catch(function () {});

s86ConnectLive(renderFeed, function () {
  feedAgeEl.textContent = '';
  setStatus('live feed disconnected — retrying');
});
</script>
</body>
</html>
