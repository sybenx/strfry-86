<!DOCTYPE html>

<title>Profile — strfry-86</title>
<style>
/* strfry-86 style block — canonical source. tools/stamp_style.py copies this
   file verbatim into every page's <style>, so "identical character-for-character
   on every page" is enforced by a command, not by discipline. Edit here only.

   Colours resolve through light-dark(), which reads the SAME color-scheme value
   the theme button and the anti-flash <script> already set on <html> — the
   toggle mechanism of WHY.md §3 is unchanged, only its palette is now ours.
   Where light-dark() is unsupported the @supports block below hands every token
   back to a system colour, i.e. back to the browser-default rendering this
   project shipped before the paint. */
:root {
  color-scheme: light dark;
  --paper:   light-dark(oklch(.985 .004 60),        oklch(.155 .005 60));
  --surface: light-dark(oklch(1 0 0),               oklch(.205 .005 60));
  --ink:     light-dark(oklch(.18 .005 60),         oklch(.93 .004 60));
  --muted:   light-dark(oklch(.18 .005 60 / .55),   oklch(.93 .004 60 / .55));
  --rule:    light-dark(oklch(.18 .005 60 / .15),   oklch(.93 .004 60 / .18));
  --hair:    light-dark(oklch(.18 .005 60 / .08),   oklch(.93 .004 60 / .1));
  --wash:    light-dark(oklch(.18 .005 60 / .06),   oklch(.93 .004 60 / .08));
  --accent:  light-dark(oklch(.45 .18 25),          oklch(.72 .16 25));
  --good:    light-dark(oklch(.5 .12 145),          oklch(.75 .14 145));
  --term-bg: oklch(.14 .005 60);
  --term-fg: oklch(.9 .01 145);
  --term-edge: oklch(.3 .01 60);
  --serif: Georgia, "PT Serif", "Iowan Old Style", "Times New Roman", serif;
  --sans: "Helvetica Neue", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, "IBM Plex Mono", monospace;
}
@supports not (color: light-dark(#000, #fff)) {
  :root { --paper:Canvas; --surface:Canvas; --ink:CanvasText; --muted:GrayText;
          --rule:GrayText; --hair:GrayText; --wash:transparent;
          --accent:LinkText; --good:CanvasText; }
}
* { box-sizing:border-box; }
body { max-width:68em; margin:0 auto; padding:0 1.5em 4em; font-size:.94rem;
       line-height:1.55; font-family:var(--sans);
       background:var(--paper); color:var(--ink); }           /* WHY.md §3 */
h1, h2 { font-family:var(--serif); font-weight:700; letter-spacing:-.01em; margin:0 0 .4rem; }
h1 { font-size:1.7rem; }
h2 { font-size:1.2rem; margin-top:2.2rem; }
h3 { font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.1em;
     color:var(--muted); margin:1.6rem 0 .5rem; }
p { margin:.5rem 0; }
a { color:var(--accent); text-underline-offset:2px; }
li { overflow-wrap:anywhere; }
code { font-family:var(--mono); font-size:.85em; }
.mono { font-family:var(--mono); font-size:.9em; }
.nowrap { white-space:nowrap; }      /* already-truncated ids — never wrapped mid-key */
.muted, #status, #feed-age, #provenance-line, #truncated-line { color:var(--muted); }
.page-head { display:flex; align-items:baseline; justify-content:space-between;
             gap:1em; flex-wrap:wrap; }
.badge { font-family:var(--mono); font-size:.72rem; padding:.15em .5em; white-space:nowrap;
         background:var(--wash); border:1px solid var(--rule); border-radius:6px; }
.pill { display:inline-flex; align-items:center; gap:.45em; font-family:var(--mono);
        font-size:.7rem; letter-spacing:.08em; padding:.35em .75em;
        border:1px solid currentColor; border-radius:8px; color:var(--muted); }
.pill.live { color:var(--good); }
.pill .dot { width:.45em; height:.45em; border-radius:50%; background:currentColor; }
.chip { display:inline-block; font-family:var(--mono); font-size:.7rem; padding:.2em .6em;
        border:1px solid currentColor; border-radius:6px; color:var(--muted); }
.chip.good { color:var(--good); }
.chip.bad { color:var(--accent); }
.chips { display:flex; flex-wrap:wrap; gap:.4em; margin:.6rem 0; }
button.chip.cmd { font-weight:400; background:transparent; color:var(--ink);
                  border-color:var(--rule); }
button.chip.cmd:hover { background:var(--ink); color:var(--paper); }
/* Identity dot, never an avatar: the hue comes from the pubkey itself, so no
   row on any page ever fetches an image from a stranger's host. */
.idot { width:.75em; height:.75em; border-radius:50%; flex:none;
        background:oklch(.65 .11 var(--h, 0)); }
.idot.unknown { background:var(--rule); }
.idot.big { width:4.5em; height:4.5em; }
.profile-head { display:flex; gap:1.5em; align-items:flex-start; padding-bottom:1.4rem;
                margin-bottom:1.2rem; border-bottom:1px solid var(--rule); }
.profile-head .profile-id { flex:1; min-width:0; }
.profile-head .profile-id > * { margin:.25rem 0; }
.profile-head h2 { font-size:1.5rem; margin:0; }
/* Identity stays a real table-cell. display:flex on the <td> itself took it
   out of table layout, so its border-bottom sat at a different height from
   every sibling cell after the avatar was replaced by a small colour dot.
   Flex lives on the inner .idrow; the cell keeps vertical-align so the
   divider line is one continuous rule across the row. */
td.identity { max-width:15em; white-space:nowrap; vertical-align:middle; }
td.identity .idrow { display:flex; align-items:center; gap:.4em; min-width:0;
                     line-height:1.2; }
td.identity .idrow > :last-child { overflow:hidden; text-overflow:ellipsis;
                                   min-width:0; }
td.num { font-family:var(--mono); font-size:.9em; }
td.num.bad { color:var(--accent); }
td.pick { width:1.5em; }
td.action { text-align:right; white-space:nowrap; }
/* A clipped cell must not be allowed to size its column, or one long note
   pushes every other column off the page. max-width:0 hands the column its
   width from the table instead; `.grow` then gives it whatever is left. */
td.clip { max-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
th.grow, td.grow { width:100%; }
.struck { text-decoration:line-through; }
/* A control that reads as a link but IS a button — it performs an action, so
   it must be a button for the keyboard and the screen reader both. */
button.linky { font-size:.78rem; font-weight:400; padding:.15em .3em; border:none;
               background:none; color:var(--accent); text-decoration:underline;
               text-underline-offset:2px; }
button.linky:hover:not(:disabled) { background:none; color:var(--accent); opacity:.7; }
.toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:.6em; margin:.7rem 0; }
.toolbar > input[type="search"], .toolbar > input[type="text"] { flex:1; min-width:12em; }
.modes { display:flex; flex-direction:column; gap:.3em; }
.modes label { display:flex; align-items:baseline; gap:.5em; font-size:.88rem; }
dl.tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(11em, 1fr));
           gap:1px; margin:1.2rem 0;
           border:1px solid var(--rule); border-radius:10px; overflow:hidden; }
/* Hairline lives on each tile, not the grid container: a container
   background showing through the gaps would also fill any UNFILLED
   tracks in a short last row (tile count rarely divides evenly into the
   fitted column count), painting a blank colored block where no tile
   exists. */
dl.tiles .tile { background:var(--surface); padding:.9em 1em;
                 box-shadow:inset 0 0 0 1px var(--rule); }
dl.tiles dt { font-size:.68rem; font-weight:600; text-transform:uppercase;
              letter-spacing:.08em; color:var(--muted); }
dl.tiles dd { margin:.3rem 0 0; font-family:var(--serif); font-size:1.5rem;
              font-weight:700; letter-spacing:-.02em; }
dl.tiles .note { margin:.2rem 0 0; font-family:var(--mono); font-size:.68rem; color:var(--muted); }
dl.tiles .note.bad { color:var(--accent); }
.field-row { display:grid; grid-template-columns:16em 1fr; gap:1.2em;
             align-items:baseline; padding:.45em 0; }
.field-label { font-size:.85rem; color:var(--muted); }
.field-control input[type="text"], .field-control input[type="number"] { width:100%; max-width:24em; }
.field-control .note { margin:.2rem 0 0; font-size:.72rem; color:var(--muted); }
/* Destructive / dependency warnings on a setting (e.g. writePolicy.plugin).
   --accent is the project's "bad" colour; weight makes it read before the
   muted help line under it. */
.field-control .note.bad { color:var(--accent); font-weight:600; }
/* Compact progress: the "N of ~M" size figure is the one number that matters
   mid-run, so it steps out of the muted note colour into full ink + bold. */
.field-control .note .figure { color:var(--ink); font-weight:700;
                               font-family:var(--mono); }
/* Range shares the same chrome as settings buttons: ink border, 8px radius,
   sans label weight. The native track is replaced so it does not look like a
   browser default next to Save / Edit raw. */
.field-control input[type="range"] {
  -webkit-appearance: none; appearance: none;
  flex:1; min-width:10em; max-width:18em; height:2.35em; margin:0;
  font-family:var(--sans); font-size:.82rem; font-weight:600;
  color:var(--ink); background:transparent;
  border:1px solid var(--ink); border-radius:8px; cursor:pointer;
  padding:0 .7em;
}
.field-control input[type="range"]::-webkit-slider-runnable-track {
  height:2px; background:var(--rule); border-radius:1px;
}
.field-control input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width:1em; height:1em; margin-top:-.4em;
  background:var(--ink); border:1px solid var(--ink); border-radius:4px;
  cursor:pointer;
}
.field-control input[type="range"]::-moz-range-track {
  height:2px; background:var(--rule); border:none; border-radius:1px;
}
.field-control input[type="range"]::-moz-range-thumb {
  width:1em; height:1em;
  background:var(--ink); border:1px solid var(--ink); border-radius:4px;
  cursor:pointer;
}
.field-control .range-days {
  font-family:var(--sans); font-size:.82rem; font-weight:600;
  padding:.5em 1em; color:var(--ink); background:transparent;
  border:1px solid var(--ink); border-radius:8px; min-width:5.5em;
  text-align:center; white-space:nowrap;
}
textarea { width:100%; font-family:var(--mono); font-size:.78rem; line-height:1.6;
           padding:1em; resize:vertical; background:var(--term-bg); color:var(--term-fg);
           border:1px solid var(--term-edge); border-radius:14px; }
.console-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.2em; align-items:start; }
.console-grid h3 { display:flex; align-items:center; gap:.5em; }
.dot-inline { width:.5em; height:.5em; border-radius:50%; background:var(--good); flex:none; }
.dot-inline.warn { background:light-dark(oklch(.6 .14 80), oklch(.8 .14 80)); }
.dot-inline.off { background:var(--rule); }
table { width:100%; border-collapse:collapse; margin:.8rem 0 1.4rem; font-size:.92em; }
th, td { text-align:left; padding:.6em .7em; border-bottom:1px solid var(--hair);
         font-variant-numeric:tabular-nums; }
tbody th { font-weight:600; }        /* row label, not a column header */
thead th { font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em;
           line-height:1.25; color:var(--muted); border-top:2px solid var(--ink);
           border-bottom:1px solid var(--rule); }
/* Sortable list headers: a real button that wears the thead chrome, never a
   second sort-control row elsewhere on the page. Active column is ink so the
   ↑/↓ arrow is visible against the muted default. */
thead th.sortable { color:var(--muted); }
thead th.sortable[aria-sort="ascending"],
thead th.sortable[aria-sort="descending"] { color:var(--ink); }
button.th-sort { font:inherit; font-size:inherit; font-weight:inherit;
                 letter-spacing:inherit; text-transform:inherit;
                 color:inherit; background:none; border:none; padding:0;
                 margin:0; cursor:pointer; text-align:left; border-radius:0; }
button.th-sort:hover:not(:disabled) { background:none; color:var(--ink); }
td[colspan] { color:var(--muted); }  /* the "+ N more …" tail summary row */
tbody tr:hover { background:var(--wash); }
button { font-family:var(--sans); font-size:.82rem; font-weight:600; padding:.5em 1em;
         color:var(--ink); background:transparent; border:1px solid var(--ink);
         border-radius:8px; cursor:pointer; }
button:hover:not(:disabled) { background:var(--ink); color:var(--paper); }
button:disabled { opacity:.4; cursor:not-allowed; }
input, select, textarea { font-family:var(--mono); font-size:.82rem; padding:.5em .7em;
         color:var(--ink); background:var(--surface); border:1px solid var(--rule);
         border-radius:8px; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
details { background:var(--surface); border:1px solid var(--rule); border-radius:10px;
          padding:.6em .9em; margin:1rem 0; }
summary { cursor:pointer; font-size:.85rem; font-weight:600; }
hr { border:none; border-top:3px double var(--rule); margin:2.4rem 0; }
pre { white-space:pre-wrap; overflow-wrap:anywhere;                /* commands only — WHY.md §2 */
      font-family:var(--mono); font-size:.8rem; line-height:1.65; padding:1em 1.1em;
      background:var(--term-bg); color:var(--term-fg);
      border:1px solid var(--term-edge); border-radius:14px; }
pre#console-log, pre#decision-log { min-height:12em; max-height:26em; overflow:auto; }
/* A log line is one line. Wrapping a key across two rows makes a tail
   unreadable, so this panel scrolls sideways inside its own box — which the
   no-horizontal-scroll rule is about the PAGE, not about a terminal. */
pre#decision-log { white-space:pre; overflow-wrap:normal; }
pre#console-log:empty::before { content:"strfry console — read-only verbs only";
                                color:oklch(.6 .01 60); }
pre .good { color:oklch(.78 .1 145); }
pre .bad { color:oklch(.72 .16 25); }
pre .dim { color:oklch(.6 .01 60); }
/* Console answer (stdout): the one number that matters after a scan --count.
   Bold + good so it does not share weight with dimmed loguru leftovers. */
pre .console-answer { font-weight:700; }
.console-row { display:flex; align-items:center; gap:.5em; margin:.6rem 0; }
.console-row .prompt { font-family:var(--mono); color:var(--good); }
.console-row input { flex:1; }
#records-container p { padding-bottom:.6em; border-bottom:1px solid var(--hair); }
header#s86 { position:sticky; top:0; z-index:5; margin-bottom:1.4rem;
             background:var(--paper); border-bottom:3px double var(--rule); }
header#s86 .brand { display:flex; align-items:baseline; gap:.8em; padding:.9rem 0 .6rem; }
header#s86 a.logo { font-family:var(--serif); font-weight:bold; font-size:1.5rem;
                    letter-spacing:-.02em; white-space:nowrap;
                    text-decoration:none; color:inherit; }
header#s86 .tagline { font-size:.65rem; font-weight:600; letter-spacing:.14em;
                      text-transform:uppercase; color:var(--muted); }
header#s86 .spacer { flex:1; }
header#s86 .bar { display:flex; align-items:center; gap:.5em; flex-wrap:wrap;
                  border-top:1px solid var(--rule); }
header#s86 nav { display:flex; flex-wrap:wrap; }
header#s86 nav a { padding:.7em .75em; font-size:.82rem; font-weight:600;
                   color:var(--muted); text-decoration:none;
                   border-bottom:2px solid transparent; }
header#s86 nav a:hover { color:var(--ink); }
header#s86 nav a[aria-current="page"] { color:var(--ink); border-bottom-color:var(--accent); }
header#s86 input#q { flex:1; min-width:8em; max-width:24em; margin-left:auto; }
header#s86 button#theme-btn { border-color:var(--rule); padding:.45em .7em; }
@media (max-width:600px) {
  body { font-size:1rem; padding:0 1em 3em; }
  /* Nothing may push the page wider than the screen (rendering rule 5), so
     at phone widths every cell breaks an unbreakable key — an npub, a hex id,
     a nip-05 address — rather than let the table overflow. identity/action
     keep white-space:nowrap at desktop; they must drop it here too, not only
     the .nowrap class. */
  th, td { padding:.5em .35em; overflow-wrap:anywhere; }
  .nowrap { white-space:normal; }
  td.clip,
  td.identity,
  td.action { max-width:none; white-space:normal; }
  table { font-size:.85em; }
  /* iOS Safari zooms the page on focus when a control is under 16px. Match
     the body size so filter/search/console inputs stay at the current scale. */
  input, select, textarea, button { font-size:1rem; }
  button { min-height:2.75em; padding:.6em 1em; }
  header#s86 button#theme-btn,
  header#s86 button#login-btn { min-height:2.75em; }
  .toolbar > input[type="search"],
  .toolbar > input[type="text"] { min-width:0; }
  .console-grid { grid-template-columns:1fr; }
  /* Same min-width:auto trap as .toolbar above: a flex/grid item will not
     shrink below its intrinsic size, and an <input> carries the width of its
     default ~20-character size attribute. That floor propagated out through
     .console-row to the grid column and pushed the whole PAGE into sideways
     scroll — the one thing rendering rule 5 forbids. (pre#decision-log still
     scrolls sideways inside its own box; that is a terminal, not the page.) */
  .console-row input { min-width:0; }
  .console-grid > * { min-width:0; }
  .field-row { grid-template-columns:1fr; gap:.2em; }
  .profile-head { flex-direction:column; gap:1em; }
  .profile-head .idot.big { width:3em; height:3em; }
  header#s86 .brand { padding:.7rem 0 .45rem; gap:.5em; }
  header#s86 a.logo { font-size:1.3rem; }
  header#s86 .tagline { display:none; }
  header#s86 nav a { padding:.65em .45em; font-size:.78rem; }
  /* Search always owns its own row under the tabs — never squeezed beside them. */
  header#s86 input#q { flex-basis:100%; max-width:none; margin:0 0 .5em; min-width:0; }

  /* List tables (class cards): each row becomes a stacked card. Column labels
     come from data-label on the cell — figure/key-value tables never take
     this class. Sort headers restyle as a wrap of chips so reordering still
     works without a wide thead. */
  table.cards { display:block; width:100%; font-size:1em; }
  table.cards thead { display:block; margin:0 0 .85rem; }
  table.cards thead tr { display:flex; flex-wrap:wrap; gap:.35em; }
  table.cards thead th { display:block; border:none; padding:0;
                         text-transform:none; letter-spacing:normal; line-height:1.2; }
  table.cards thead th:not(.sortable) { display:none; }
  table.cards thead button.th-sort {
    display:inline-flex; align-items:center; min-height:2.5em;
    padding:.4em .65em; border:1px solid var(--rule); border-radius:6px;
    background:var(--surface); color:inherit; font-size:.78rem; font-weight:600;
    letter-spacing:.04em; text-transform:uppercase;
  }
  table.cards thead th[aria-sort="ascending"] button.th-sort,
  table.cards thead th[aria-sort="descending"] button.th-sort {
    border-color:var(--ink); color:var(--ink);
  }
  table.cards tbody { display:block; }
  table.cards tbody tr {
    display:block; background:var(--surface); border:1px solid var(--rule);
    border-radius:10px; padding:.55em .85em; margin:0 0 .65em;
  }
  table.cards tbody tr:hover { background:var(--wash); }
  /* Block layout (not grid) so multi-child cells — audit Detail, identity
     idrow + badge — keep their normal inline flow under the label strip. */
  table.cards tbody td {
    display:block; padding:.4em 0; border-bottom:1px solid var(--hair);
    max-width:none; white-space:normal; overflow:visible; text-overflow:unset;
  }
  table.cards tbody td:last-child { border-bottom:none; }
  table.cards tbody td[data-label]::before {
    content:attr(data-label); display:block; margin:0 0 .15em;
    font-size:.68rem; font-weight:600; text-transform:uppercase;
    letter-spacing:.08em; color:var(--muted); line-height:1.3;
  }
  table.cards tbody td.pick {
    border-bottom:1px solid var(--hair); padding:.15em 0 .45em;
  }
  table.cards tbody td.pick:empty { display:none; }
  /* Size the pick-column control without an attribute selector that would
     match a static-source grep for assembled-set controls on scan pages. */
  table.cards tbody td.pick input {
    width:1.25em; height:1.25em; vertical-align:middle;
  }
  table.cards tbody td.identity .idrow { min-width:0; }
  table.cards tbody td.action {
    display:flex; justify-content:flex-end; gap:.5em;
    border-bottom:none; padding-top:.55em;
  }
  table.cards tbody td.action:empty { display:none; }
  table.cards tbody td.action::before { content:none; }
  table.cards tbody td.clip { white-space:normal; max-width:none; }

  /* Feed cards only: two compact meta lines (time · kind / author), content
     keeps its stacked label, result is one inline line. Other card tables
     keep the full stacked data-label layout above. */
  table.cards.feed tbody td.time,
  table.cards.feed tbody td.kind {
    display:inline-flex; align-items:center; gap:.4em;
    width:auto; max-width:none; padding:.1em 0 .25em;
    border-bottom:none; white-space:nowrap;
  }
  table.cards.feed tbody td.time { padding-right:.15em; }
  table.cards.feed tbody td.time::before {
    display:inline; margin:0 .4em 0 0; vertical-align:baseline;
  }
  table.cards.feed tbody td.time::after {
    content:"·"; color:var(--muted); margin:0 .15em 0 .45em;
    font-weight:400; letter-spacing:0; text-transform:none;
  }
  table.cards.feed tbody td.kind::before { content:none; }
  table.cards.feed tbody td.identity {
    display:block; padding:.1em 0 .45em;
    border-bottom:1px solid var(--hair);
  }
  table.cards.feed tbody td.identity::before { content:none; }
  table.cards.feed tbody td.clip {
    display:block; padding:.45em 0;
    border-bottom:1px solid var(--hair);
  }
  table.cards.feed tbody td.result {
    display:flex; align-items:center; gap:.5em;
    padding:.4em 0 0; border-bottom:none;
  }
  table.cards.feed tbody td.result::before {
    display:inline; margin:0; vertical-align:baseline;
  }

  /* Users cards: identity without label, NIP-05 one line, Events · Reports ·
     Gift-wraps on one meta line, last-active inline, Ban via .action. */
  table.cards.users tbody td.identity {
    display:block; padding:.1em 0 .35em; border-bottom:none;
  }
  table.cards.users tbody td.identity::before { content:none; }
  table.cards.users tbody td.nip05 {
    display:flex; align-items:baseline; flex-wrap:wrap; gap:.35em .5em;
    padding:.15em 0 .4em; border-bottom:1px solid var(--hair);
    white-space:normal;
  }
  table.cards.users tbody td.nip05::before {
    display:inline; margin:0; flex:none; vertical-align:baseline;
  }
  table.cards.users tbody td.events,
  table.cards.users tbody td.reports,
  table.cards.users tbody td.giftwraps {
    display:inline-flex; align-items:center; gap:.35em;
    width:auto; max-width:none; padding:.35em 0 .15em;
    border-bottom:none; white-space:nowrap;
  }
  table.cards.users tbody td.events::before,
  table.cards.users tbody td.reports::before,
  table.cards.users tbody td.giftwraps::before {
    display:inline; margin:0; vertical-align:baseline;
  }
  table.cards.users tbody td.events::after,
  table.cards.users tbody td.reports::after {
    content:"·"; color:var(--muted); margin:0 .15em 0 .4em;
    font-weight:400; letter-spacing:0; text-transform:none;
  }
  table.cards.users tbody td.last {
    display:flex; align-items:center; gap:.5em;
    padding:.35em 0 .15em; border-bottom:1px solid var(--hair);
    white-space:nowrap;
  }
  table.cards.users tbody td.last::before {
    display:inline; margin:0; vertical-align:baseline;
  }

  /* Banned-pubkey cards: identity without label; banned · source · blocked
     on one meta line; reason keeps stacked free-text label. */
  table.cards.bans tbody td.identity {
    display:block; padding:.1em 0 .35em; border-bottom:none;
  }
  table.cards.bans tbody td.identity::before { content:none; }
  table.cards.bans tbody td.when,
  table.cards.bans tbody td.source,
  table.cards.bans tbody td.blocked {
    display:inline-flex; align-items:center; gap:.35em;
    width:auto; max-width:none; padding:.35em 0 .15em;
    border-bottom:none; white-space:nowrap;
  }
  table.cards.bans tbody td.when::before,
  table.cards.bans tbody td.blocked::before {
    display:inline; margin:0; vertical-align:baseline;
  }
  /* Source badge is self-explanatory — no SOURCE strip beside kind:spam. */
  table.cards.bans tbody td.source::before { content:none; }
  table.cards.bans tbody td.when::after,
  table.cards.bans tbody td.source::after {
    content:"·"; color:var(--muted); margin:0 .15em 0 .4em;
    font-weight:400; letter-spacing:0; text-transform:none;
  }
  table.cards.bans tbody td.reason {
    display:block; padding:.45em 0; border-bottom:none;
    white-space:normal;
  }

  /* Domain-receipt cards: domain as heading; banned · count on one meta
     line; reason stacked; Unban via .action. */
  table.cards.domains tbody td.domain {
    display:block; padding:.1em 0 .35em; border-bottom:none;
    font-weight:600;
  }
  table.cards.domains tbody td.domain::before { content:none; }
  table.cards.domains tbody td.when,
  table.cards.domains tbody td.count {
    display:inline-flex; align-items:center; gap:.35em;
    width:auto; max-width:none; padding:.35em 0 .15em;
    border-bottom:none; white-space:nowrap;
  }
  table.cards.domains tbody td.when::before {
    display:inline; margin:0; vertical-align:baseline;
  }
  /* Value already reads "n of m still banned" — no PUBKEYS strip. */
  table.cards.domains tbody td.count::before { content:none; }
  table.cards.domains tbody td.when::after {
    content:"·"; color:var(--muted); margin:0 .15em 0 .4em;
    font-weight:400; letter-spacing:0; text-transform:none;
  }
  table.cards.domains tbody td.reason {
    display:block; padding:.45em 0; border-bottom:1px solid var(--hair);
    white-space:normal;
  }
}

/* Users layout: one filter node, two visual homes by breakpoint.
   Mobile keeps title + search on the first row (page-head feel).
   Desktop drops the search to the row immediately above the list. */
.users-layout {
  display:grid;
  grid-template-columns:1fr minmax(8em, 18em);
  grid-template-areas:
    "title filter"
    "status status"
    "tools tools"
    "list list";
  column-gap:1em;
  row-gap:0;
  align-items:baseline;
}
.users-layout .users-title { grid-area:title; margin:0; min-width:0; }
.users-layout .users-title h1 { margin:0; }
.users-layout .users-filter { grid-area:filter; width:100%; min-width:0; margin:0; }
.users-layout .users-status { grid-area:status; }
.users-layout .users-tools { grid-area:tools; }
.users-layout .users-list { grid-area:list; }
@media (min-width:601px) {
  .users-layout {
    grid-template-columns:1fr;
    grid-template-areas:
      "title"
      "status"
      "tools"
      "filter"
      "list";
  }
  .users-layout .users-filter { margin:.7rem 0 .5rem; max-width:32em; }
}
</style>
</head>
<body>
<h1 id="page-title">Profile</h1>
<p id="status"></p>
<div id="profile-entry-container"></div>

<div id="param-error-block" style="display:none">
  <p id="param-error"></p>
</div>

<div id="content" style="display:none">
  <div class="profile-head">
    <span id="profile-dot" class="idot big"></span>
    <div class="profile-id">
      <h2 id="profile-name"></h2>
      <p class="mono"><span id="npub-text"></span> <a id="njump-link" target="_blank">njump</a></p>
      <p id="nip05-line" class="mono" style="display:none"></p>
      <p id="ban-status-line"></p>
      <div id="profile-fields"></div>
    </div>
    <p id="ban-controls" style="display:none">
      <input id="reason-input" type="text" placeholder="reason (optional)">
      <button id="ban-toggle-btn" type="button"></button>
    </p>
  </div>
  <div id="flash-undo"></div>
  <div id="reason-edit-container"></div>

  <div id="profile-tiles"></div>
  <p id="counts-line"></p>
  <p id="kinds-line"></p>

  <div id="relay-list-section" style="display:none">
    <h2>Relay list</h2>
    <p id="relay-list-note" class="muted"></p>
    <ul id="relay-list" class="mono"></ul>
  </div>
  <div id="nip05-relays-section" style="display:none">
    <h2>NIP-05 relays</h2>
    <p id="nip05-relays-note" class="muted"></p>
    <ul id="nip05-relays-list" class="mono"></ul>
  </div>

  <div id="reports-section" style="display:none">
    <h2>Reports against this pubkey</h2>
    <p id="reports-count-line"></p>
    <ul id="reports-list"></ul>
    <button id="lookup-reporter-names-btn" type="button" style="display:none"></button>
  </div>

  <h2 id="events-heading">Recent events</h2>
  <p>
    <input id="events-date-input" type="date">
    <input id="events-time-input" type="time" step="1">
    <button id="events-time-prev-btn" type="button" title="previous day" aria-label="previous day">‹</button>
    <button id="events-time-next-btn" type="button" title="next day" aria-label="next day">›</button>
    <button id="events-date-clear-btn" type="button" style="display:none">back to recent events</button>
    <span id="events-load-status"></span>
  </p>
  <p id="previews-note"></p>
  <ul id="previews-list"></ul>

  <div id="command-block-container"></div>
</div>

<script src="/common86.js"></script>
<script>
var KNOWN_KINDS = { 0: 'profile', 1: 'note', 1059: 'gift wrap', 1984: 'report', 9735: 'zap receipt' };

var params = new URLSearchParams(window.location.search);
var rawParam = params.get('npub') || params.get('hex') || '';
var pubkeyHex = s86PubkeyInputToHex(rawParam);

var statusEl = document.getElementById('status');
var chrome = s86BuildPageChrome(statusEl);
var loginBtn = chrome.loginBtn;
var pageTitle = document.getElementById('page-title');
var paramErrorBlock = document.getElementById('param-error-block');
var paramErrorEl = document.getElementById('param-error');
var contentEl = document.getElementById('content');
var npubTextEl = document.getElementById('npub-text');
var njumpLink = document.getElementById('njump-link');
var nip05LineEl = document.getElementById('nip05-line');
var banStatusLine = document.getElementById('ban-status-line');
var banControls = document.getElementById('ban-controls');
var reasonInput = document.getElementById('reason-input');
var banToggleBtn = document.getElementById('ban-toggle-btn');
var flashUndo = document.getElementById('flash-undo');
var reasonEditContainer = document.getElementById('reason-edit-container');
var profileFieldsEl = document.getElementById('profile-fields');
var profileName = document.getElementById('profile-name');
var profileDot = document.getElementById('profile-dot');
var profileTiles = document.getElementById('profile-tiles');
var countsLine = document.getElementById('counts-line');
var kindsLine = document.getElementById('kinds-line');
var relayListSection = document.getElementById('relay-list-section');
var relayListNote = document.getElementById('relay-list-note');
var relayListEl = document.getElementById('relay-list');
var nip05RelaysSection = document.getElementById('nip05-relays-section');
var nip05RelaysNote = document.getElementById('nip05-relays-note');
var nip05RelaysList = document.getElementById('nip05-relays-list');
var reportsSection = document.getElementById('reports-section');
var reportsCountLine = document.getElementById('reports-count-line');
var reportsList = document.getElementById('reports-list');
var previewsNote = document.getElementById('previews-note');
var previewsList = document.getElementById('previews-list');
var profileEntryContainer = document.getElementById('profile-entry-container');
var commandBlockContainer = document.getElementById('command-block-container');
var lookupReporterNamesBtn = document.getElementById('lookup-reporter-names-btn');
var nip05RelaysFetchGen = 0;
var eventsHeading = document.getElementById('events-heading');
var eventsDateInput = document.getElementById('events-date-input');
var eventsTimeInput = document.getElementById('events-time-input');
var eventsTimePrevBtn = document.getElementById('events-time-prev-btn');
var eventsTimeNextBtn = document.getElementById('events-time-next-btn');
var eventsDateClearBtn = document.getElementById('events-date-clear-btn');
var eventsLoadStatus = document.getElementById('events-load-status');

// A day picked here can never be in the future — strfry has nothing to
// show for it, and the browser's own date picker is the cheapest place to
// rule that out. UTC, not local time, since every date/time already
// rendered on this page (s86FormatDate) is UTC — the picked day's [00:00,
// 24:00) window is computed server-side against that same UTC calendar
// day, so what's typed here has to mean the same day the server scans.
eventsDateInput.max = new Date().toISOString().slice(0, 10);

function setStatus(text) {
  statusEl.textContent = text;
}

// Present up top regardless of login state or whether the URL param was
// valid — pure client-side navigation, no signing involved, same as every
// other page's copy of this field — so a bad/missing param never strands
// the visitor with nothing but a login button.
profileEntryContainer.appendChild(s86BuildProfileEntryField(statusEl));

if (!pubkeyHex) {
  paramErrorEl.textContent = 'no valid npub or hex pubkey given — enter one below';
  paramErrorBlock.style.display = '';
} else {
  runProfilePage();
}

function truncatedNpub(npub) {
  return npub.length > 20 ? npub.slice(0, 16) + '…' : npub;
}

// UTC-safe date/time helpers for the events date+time pickers — every
// timestamp elsewhere on this page (s86FormatDate) is UTC, so a "day" here
// always means a UTC calendar day, never the browser's local one.
function utcDateStr(unixSeconds) {
  return new Date(unixSeconds * 1000).toISOString().slice(0, 10);
}

function utcTimeStr(unixSeconds) {
  return new Date(unixSeconds * 1000).toISOString().slice(11, 19);
}

function addDaysToDateStr(dateStr, delta) {
  var parts = dateStr.split('-').map(Number);
  var ms = Date.UTC(parts[0], parts[1] - 1, parts[2]) + delta * 86400000;
  return new Date(ms).toISOString().slice(0, 10);
}

function runProfilePage() {
  var adminPubkey = null;
  var isAdmin = false;
  var profileData = null;
  var attemptedExternalLookup = false;
  var nameResolutionInFlight = false;
  var attemptedReporterLookup = new Set();
  var reporterNameResolutionInFlight = false;
  var dayView = null;          // {date, previews, truncated} or null (recent-events mode)
  var dayFetchInFlight = false;
  var newestKnownCreatedAt = null;  // previews[0].created_at from the last full load — the
                                     // exclusive lower bound checkForNewEvents() scans from
  var newEventsCheckInFlight = false;

  function onLogin() {
    isAdmin = true;
    s86ResolveStrfryConfFlag();
    fetchProfile();
  }

  s86WireLogin(loginBtn, statusEl, function () { return adminPubkey; }, onLogin);

  fetch('/api/banned')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      adminPubkey = data.admin;
      s86TryAutoLogin(adminPubkey, loginBtn, statusEl, onLogin);
    })
    .catch(function () {
      setStatus('failed to reach server');
    });

  function fetchProfile() {
    s86SignAndPost('/api/profile', { pubkey: pubkeyHex })
      .then(function (result) {
        if (!result.ok) {
          setStatus('failed to load profile: ' + s86ErrMsg(result));
          return;
        }
        profileData = result.body;
        newestKnownCreatedAt = (profileData.previews && profileData.previews.length > 0)
          ? profileData.previews[0].created_at : null;
        contentEl.style.display = '';
        renderProfile();
        maybeResolveNameExternally();
      })
      .catch(function () {
        setStatus('failed to load profile');
      });
  }

  function renderProfile() {
    var p = profileData;

    // The heading is who this is; the document title is where you are. They
    // used to be the same string, which made the page shout its own name at
    // the operator instead of the account's.
    document.title = (p.name || truncatedNpub(p.npub)) + ' — strfry-86';
    pageTitle.textContent = 'Profile';
    profileName.textContent = p.name || p.nip05 || truncatedNpub(p.npub);
    profileDot.replaceWith(s86BuildIdentityDot(p.pubkey));
    profileDot = document.querySelector('.profile-head .idot');
    profileDot.classList.add('big');

    npubTextEl.textContent = p.npub;
    njumpLink.href = 'https://njump.me/' + p.npub;
    njumpLink.textContent = 'njump';

    if (p.nip05) {
      nip05LineEl.textContent = p.nip05;
      nip05LineEl.style.display = '';
    } else {
      nip05LineEl.textContent = '';
      nip05LineEl.style.display = 'none';
    }

    renderBanStatus();
    renderProfileFields();
    renderProfileTiles();
    renderCounts();
    renderKinds();
    renderRelayList();
    maybeFetchNip05Relays();
    renderReports();
    renderPreviews();

    commandBlockContainer.textContent = '';
    commandBlockContainer.appendChild(s86BuildCommandGenerator({ pubkey: p.npub }));
  }

  function renderBanStatus() {
    var p = profileData;
    banStatusLine.textContent = '';
    if (p.banned && p.ban) {
      banStatusLine.appendChild(document.createTextNode('(banned)'));
      if (p.ban.reason) {
        banStatusLine.appendChild(document.createTextNode(' — '));
        banStatusLine.appendChild(s86El('span', p.ban.reason));
      }
      if (p.ban.report_type) {
        banStatusLine.appendChild(document.createTextNode(' — '));
        banStatusLine.appendChild(s86El('span', p.ban.report_type));
      }
      banStatusLine.appendChild(document.createTextNode(' — '));
      banStatusLine.appendChild(s86El('i', s86FormatDate(p.ban.banned_at)));
      // What the ban has done since. The most recent rejection is the part
      // that says whether this account is still trying, which a total alone
      // cannot: 400 blocks that all stopped in March reads very differently
      // from 4 that happened this morning.
      if (p.last_blocked_at) {
        var last = s86El('span', ' — last blocked ' + s86FormatRelativeAge(p.last_blocked_at), 'muted');
        last.title = s86FormatDate(p.last_blocked_at);
        banStatusLine.appendChild(last);
      } else if (p.blocked === 0) {
        banStatusLine.appendChild(s86El('span',
          ' — nothing blocked inside the decision log window', 'muted'));
      }
    } else {
      banStatusLine.textContent = 'not banned';
    }

    reasonEditContainer.textContent = '';
    if (!isAdmin) {
      banControls.style.display = 'none';
      return;
    }
    banControls.style.display = '';
    reasonInput.style.display = p.banned ? 'none' : '';
    banToggleBtn.textContent = p.banned ? 'Unban' : 'Ban';

    // Reuse the same inline reason row the record lines use — same
    // /api/reason call, same reason-record undo — rather than a second
    // way to edit a reason. Only shown once banned; the reason-input
    // above already covers setting one at ban time.
    if (p.banned) {
      reasonEditContainer.appendChild(s86BuildReasonEditRow(
        [pubkeyHex],
        (p.ban && p.ban.reason) || '',
        { onChanged: fetchProfile, onError: setStatus }
      ));
    }
  }

  banToggleBtn.addEventListener('click', function () {
    if (!isAdmin || !profileData) {
      return;
    }
    if (profileData.banned) {
      s86SignAndPost('/api/unban', { pubkeys: [pubkeyHex] })
        .then(function (result) {
          if (!result.ok) {
            setStatus('unban failed: ' + s86ErrMsg(result));
            return;
          }
          s86ShowFlashUndo(flashUndo, {
            type: 'unban',
            at: Date.now(),
            entries: [{ pubkey: pubkeyHex, npub: profileData.npub, name: profileData.name, nip05: profileData.nip05, reason: profileData.ban ? profileData.ban.reason : '' }]
          }, { onChanged: fetchProfile, onError: setStatus });
          setStatus('unbanned');
          fetchProfile();
        })
        .catch(function () { setStatus('unban failed'); });
    } else {
      var reason = reasonInput.value;
      s86SignAndPost('/api/ban', { entries: [{ pubkey: pubkeyHex, reason: reason }] })
        .then(function (result) {
          if (!result.ok) {
            setStatus('ban failed: ' + s86ErrMsg(result));
            return;
          }
          setStatus('banned ' + (result.body.added.length ? '1 pubkey' : '0 pubkeys (already banned?)'));
          reasonInput.value = '';
          if (result.body.added.length > 0) {
            s86ShowFlashUndo(flashUndo, {
              type: 'ban',
              at: Date.now(),
              entries: [{ pubkey: pubkeyHex, npub: profileData.npub, name: profileData.name, nip05: profileData.nip05, reason: reason }]
            }, { onChanged: fetchProfile, onError: setStatus });
          }
          fetchProfile();
        })
        .catch(function () { setStatus('ban failed'); });
    }
  });

  function renderProfileFields() {
    var p = profileData;
    profileFieldsEl.textContent = '';
    var profile = p.profile;
    if (!profile) {
      return;
    }
    [['about', profile.about], ['website', profile.website], ['picture', profile.picture], ['lud16', profile.lud16]].forEach(function (pair) {
      if (!pair[1]) {
        return;
      }
      var line = document.createElement('p');
      var label = document.createElement('b');
      label.textContent = pair[0] + ': ';
      line.appendChild(label);
      // picture/website are rendered as PLAIN TEXT, never <img>/<a href> —
      // an attacker-controlled URL loaded automatically would disclose the
      // admin's IP to a host chosen by the account under investigation.
      line.appendChild(document.createTextNode(pair[1]));
      profileFieldsEl.appendChild(line);
    });
  }

  function blockedCapped(p) {
    return !!(p.blocked_window && p.blocked_window.truncated);
  }

  // The blocked figure's denominator, stated in its own note per rendering
  // rule 3: a count of rejections is meaningless without the window it was
  // counted over, and that window is a rotating log, not the relay's lifetime.
  function blockedNote(p) {
    var w = p.blocked_window;
    if (!w || !w.present) {
      return 'no decision log yet';
    }
    // The `≥` on the value already says the count is a floor; spelling out
    // why in the note as well made the tile the longest thing on the page.
    return 'of ' + w.records.toLocaleString() + ' decisions'
      + (w.window_start ? (' since ' + s86FormatRelativeAge(w.window_start)) : '');
  }

  // The design's four figures, from data this page already has. Every one of
  // them can legitimately be unknown — the profile endpoint is bounded — and
  // an unknown renders `—`, never 0 (rule 9).
  function renderProfileTiles() {
    var p = profileData;
    var distinctReporters = {};
    (p.reports || []).forEach(function (r) { distinctReporters[r.reporter] = true; });
    var reporterCount = Object.keys(distinctReporters).length;
    var kindsSeen = Object.keys(p.kinds || {}).length;
    var newest = (p.previews && p.previews.length) ? p.previews[0].created_at : null;

    profileTiles.textContent = '';
    profileTiles.appendChild(s86BuildTiles([
      {
        label: 'Events published',
        value: p.total_events == null ? null : (p.total_events.toLocaleString() + (p._countsUncertain ? '?' : '')),
        note: p.scan_count != null ? ('rank ' + p.scan_rank + ' in the last author scan') : 'lifetime, from the index'
      },
      {
        label: 'Reports against',
        value: reporterCount,
        note: p.reports_saturated ? 'floor — report scan capped' : 'distinct reporters (kind 1984)',
        tone: reporterCount ? 'bad' : null
      },
      {
        label: 'Blocked',
        // The only figure here counting events that never reached the
        // database — a scan cannot see a rejection, only plugin86's decision
        // log can. A floor over that log's window, so `≥` whenever the log
        // was read from its tail, and `—` when nothing has judged anything
        // yet, never 0.
        value: p.blocked == null
          ? null
          : ((blockedCapped(p) && p.blocked > 0 ? '≥ ' : '') + p.blocked.toLocaleString()),
        note: blockedNote(p),
        tone: p.blocked ? 'bad' : null
      },
      {
        label: 'Kinds seen',
        value: kindsSeen || null,
        note: 'in the newest ' + (p.kinds_window || 0).toLocaleString() + ' events'
      },
      {
        label: 'Last active',
        value: newest ? s86FormatRelativeAge(newest) : null,
        note: newest ? s86FormatDate(newest) : 'no events read yet'
      }
    ]));
  }

  function renderCounts() {
    var p = profileData;
    // Lifetime total lives on the Events published tile — this line only
    // adds author-scan rank context when a scan cache has this pubkey.
    var parts = [];
    if (p.scan_rank != null && p.scan_count != null) {
      parts.push('rank ' + p.scan_rank + ' in last author scan ('
        + Number(p.scan_count).toLocaleString() + ' events in that window)');
    }
    if (p.warning) {
      parts.push(p.warning);
    }
    countsLine.textContent = parts.join(' — ');
  }

  function fillRelayUl(ul, relays, withMarker) {
    ul.textContent = '';
    (relays || []).forEach(function (entry) {
      var url = typeof entry === 'string' ? entry : entry.url;
      if (!url) {
        return;
      }
      var li = document.createElement('li');
      // Plain text only — same rule as picture/website: never auto-fetch
      // an arbitrary host from an account under investigation.
      var label = url;
      if (withMarker && entry && entry.marker) {
        label += ' (' + entry.marker + ')';
      }
      li.textContent = label;
      ul.appendChild(li);
    });
  }

  function renderRelayList() {
    var p = profileData;
    var rl = p.relay_list;
    var relays = rl && rl.relays ? rl.relays : [];
    if (!relays.length) {
      relayListSection.style.display = 'none';
      relayListEl.textContent = '';
      relayListNote.textContent = '';
      return;
    }
    relayListSection.style.display = '';
    fillRelayUl(relayListEl, relays, true);
    var note = 'from kind 10002 (NIP-65)';
    if (rl.created_at) {
      note += ' · published ' + s86FormatRelativeAge(rl.created_at);
      relayListNote.title = s86FormatDate(rl.created_at);
    } else {
      relayListNote.title = '';
    }
    relayListNote.textContent = note;
  }

  function hideNip05Relays() {
    nip05RelaysSection.style.display = 'none';
    nip05RelaysList.textContent = '';
    nip05RelaysNote.textContent = '';
  }

  // Optional NIP-05 well-known `relays` map for this pubkey. Browser-only
  // fetch (same CORS model as the Domain page). Silent on failure; only
  // surface UI when the map actually lists relays for this key.
  function maybeFetchNip05Relays() {
    var p = profileData;
    hideNip05Relays();
    var gen = ++nip05RelaysFetchGen;
    if (!p || !p.nip05 || !p.pubkey) {
      return;
    }
    var domain = s86Nip05Domain(p.nip05);
    if (!domain) {
      return;
    }
    var url = 'https://' + domain + '/.well-known/nostr.json';
    fetch(url)
      .then(function (res) {
        if (!res.ok) {
          throw new Error('http ' + res.status);
        }
        return res.json();
      })
      .then(function (doc) {
        if (gen !== nip05RelaysFetchGen || !profileData || profileData.pubkey !== p.pubkey) {
          return;
        }
        var map = doc && doc.relays;
        if (!map || typeof map !== 'object') {
          return;
        }
        var urls = map[p.pubkey] || map[p.pubkey.toLowerCase()] || map[p.pubkey.toUpperCase()];
        if (!Array.isArray(urls)) {
          // Some hosts key by any case; scan once.
          var want = p.pubkey.toLowerCase();
          Object.keys(map).forEach(function (k) {
            if (k.toLowerCase() === want && Array.isArray(map[k])) {
              urls = map[k];
            }
          });
        }
        if (!Array.isArray(urls)) {
          return;
        }
        var cleaned = [];
        var seen = {};
        urls.forEach(function (u) {
          if (typeof u !== 'string' || !u.trim() || seen[u]) {
            return;
          }
          seen[u] = true;
          cleaned.push(u.trim());
        });
        if (!cleaned.length) {
          return;
        }
        nip05RelaysSection.style.display = '';
        fillRelayUl(nip05RelaysList, cleaned, false);
        nip05RelaysNote.textContent = 'from ' + domain + '/.well-known/nostr.json';
      })
      .catch(function () {
        // CORS / network / bad JSON — leave the section hidden.
      });
  }

  function renderKinds() {
    var p = profileData;
    var entries = Object.keys(p.kinds || {}).map(function (k) { return [parseInt(k, 10), p.kinds[k]]; });
    entries.sort(function (a, b) { return b[1] - a[1]; });
    var parts = entries.map(function (e) { return (KNOWN_KINDS[e[0]] || ('kind ' + e[0])) + ':' + e[1] + (p._countsUncertain ? '?' : ''); });
    var windowLabel = p.kinds_window + (p._kindsWindowGrew ? '+' : '');
    var prefix = 'kind breakdown (most recent ' + windowLabel + ' events'
      + (p.kinds_saturated ? ', not all ' + p.total_events : '') + '): ';
    kindsLine.textContent = prefix + (parts.length ? parts.join('  ') : 'none');
  }

  function renderReports() {
    var p = profileData;
    var reports = p.reports || [];
    // Empty state is the Reports-against tile (0) — do not also shout a
    // heading + "no reports" block under it.
    if (reports.length === 0) {
      reportsSection.style.display = 'none';
      reportsList.textContent = '';
      reportsCountLine.textContent = '';
      updateLookupReporterNamesButton();
      return;
    }
    reportsSection.style.display = '';
    var distinct = {};
    reports.forEach(function (r) { distinct[r.reporter] = true; });
    reportsCountLine.textContent = 'reported by ' + Object.keys(distinct).length + ' distinct pubkey(s)'
      + (p.reports_saturated ? ' — cap reached, older reports not counted' : '');

    reportsList.textContent = '';
    reports.forEach(function (r) {
      var li = document.createElement('li');
      if (r.name) {
        var b = document.createElement('b');
        b.textContent = r.name;
        li.appendChild(b);
        li.appendChild(document.createTextNode(' '));
      }
      if (r.nip05) {
        li.appendChild(document.createTextNode(r.nip05 + ' '));
      }
      li.appendChild(s86NpubLink(r.reporter_npub, r.reporter, true));
      if (r.report_type) {
        li.appendChild(document.createTextNode(' — '));
        li.appendChild(s86El('span', r.report_type));
      }
      if (r.content) {
        li.appendChild(document.createTextNode(' — '));
        li.appendChild(s86El('span', r.content));
      }
      li.appendChild(document.createTextNode(' — '));
      li.appendChild(s86BuildReportDateButton(r.created_at));
      reportsList.appendChild(li);
    });

    updateLookupReporterNamesButton();
  }

  // A report's timestamp, as a button rather than plain text: clicking it
  // jumps the events section below to that UTC calendar day — what was
  // this pubkey posting when it got reported? — reusing the exact same
  // fetchDayView() the date picker itself calls, so the time picker
  // defaults to that day's latest event either way.
  function s86BuildReportDateButton(createdAt) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = s86FormatDate(createdAt);
    var label = "view this pubkey's events on this day";
    btn.title = label;
    btn.setAttribute('aria-label', label);
    btn.addEventListener('click', function () {
      fetchDayView(utcDateStr(createdAt));
    });
    return btn;
  }

  // Name/nip05 for each reporter is resolved locally and automatically —
  // see resolve_profiles() server-side — so this button only ever concerns
  // the reporters that local resolution left empty. Button-triggered, not
  // automatic, same reasoning as authors.html's version: this set does not
  // self-extinguish, so querying external relays on every profile load
  // would mean an unbounded, unconsented outbound query per page view.
  function unresolvedReporterPubkeys() {
    var reports = (profileData && profileData.reports) || [];
    var seen = {};
    var out = [];
    reports.forEach(function (r) {
      if (r.name || r.nip05) {
        return;
      }
      if (attemptedReporterLookup.has(r.reporter) || seen[r.reporter]) {
        return;
      }
      seen[r.reporter] = true;
      out.push(r.reporter);
    });
    return out;
  }

  function updateLookupReporterNamesButton() {
    if (!isAdmin) {
      lookupReporterNamesBtn.style.display = 'none';
      return;
    }
    var pubkeys = unresolvedReporterPubkeys();
    if (pubkeys.length === 0) {
      lookupReporterNamesBtn.style.display = 'none';
      return;
    }
    lookupReporterNamesBtn.style.display = '';
    lookupReporterNamesBtn.textContent = 'look up names for the ' + pubkeys.length
      + ' reporter(s) without one (queries external relays)';
  }

  lookupReporterNamesBtn.addEventListener('click', function () {
    if (!isAdmin || reporterNameResolutionInFlight) {
      return;
    }
    var pubkeys = unresolvedReporterPubkeys();
    if (pubkeys.length === 0) {
      return;
    }
    reporterNameResolutionInFlight = true;
    lookupReporterNamesBtn.disabled = true;
    pubkeys.forEach(function (pk) { attemptedReporterLookup.add(pk); });

    s86ResolveNamesExternally(pubkeys, {
      onDone: function () {
        reporterNameResolutionInFlight = false;
        lookupReporterNamesBtn.disabled = false;
        fetchProfile();
      },
      onError: function (msg) {
        reporterNameResolutionInFlight = false;
        lookupReporterNamesBtn.disabled = false;
        setStatus(msg);
      }
    });
  });

  // Two mutually exclusive views share one heading, one note line, and one
  // <ul> — dayView null means "recent events" (profileData.previews, part
  // of the normal /api/profile response); dayView set means a specific UTC
  // calendar day, fetched separately via POST /api/profile/day only when
  // the date picker actually changes (picking a date is the explicit admin
  // act that justifies the extra scan, same reasoning as compute_profile's
  // own recent-events read).
  function renderPreviews() {
    if (dayView) {
      renderPreviewList(dayView.previews, 'Events on ' + dayView.date,
        dayView.previews.length === 0
          ? ('no events on ' + dayView.date)
          : (dayView.truncated ? 'showing the newest ' + dayView.previews.length + ' — more events exist on this day' : ''));
      eventsDateClearBtn.style.display = '';
      return;
    }
    var previews = (profileData && profileData.previews) || [];
    renderPreviewList(previews, 'Recent events', previews.length === 0 ? 'no recent events found' : '');
    eventsDateClearBtn.style.display = 'none';
    // Recent/latest events are showing — (re)stamp the date+time pickers to
    // right now. This is what makes '‹' work on first load with no prior
    // pick (there'd otherwise be no date to step back from), and what makes
    // '›' read as "now" rather than a stale time the moment it lands back
    // here after refreshing.
    var nowSec = Math.floor(Date.now() / 1000);
    eventsDateInput.value = utcDateStr(nowSec);
    eventsTimeInput.value = utcTimeStr(nowSec);
    eventsLoadStatus.textContent = '';
  }

  // A kind-1 event with at least one `e` tag is a reply/quote, not a
  // top-level note — the server flags this as `reply` (true/false for
  // kind 1, null for every other kind) since only it can see the tags.
  function eventKindLabel(ev) {
    if (ev.kind === 1 && ev.reply != null) {
      return ev.reply ? 'reply' : 'note';
    }
    return KNOWN_KINDS[ev.kind] || ('kind ' + ev.kind);
  }

  function renderPreviewList(previews, heading, note) {
    eventsHeading.textContent = heading;
    previewsNote.textContent = note;
    previewsList.textContent = '';
    previews.forEach(function (ev) {
      var li = document.createElement('li');
      // Only the kind label ("note"/"reply"/"kind 7"/...) links to njump —
      // the date and content stay plain text, not part of the link.
      var kindEl = ev.note ? document.createElement('a') : document.createElement('b');
      if (ev.note) {
        kindEl.href = 'https://njump.me/' + ev.note;
        kindEl.target = '_blank';
        kindEl.appendChild(s86El('b', eventKindLabel(ev)));
      } else {
        kindEl.textContent = eventKindLabel(ev);
      }
      li.appendChild(kindEl);
      li.appendChild(document.createTextNode(' '));
      li.appendChild(s86El('i', s86FormatDate(ev.created_at)));
      if (ev.content) {
        li.appendChild(document.createTextNode(' — '));
        li.appendChild(s86El('span', ev.content));
      }
      previewsList.appendChild(li);
    });
  }

  // Fetches one UTC day's events and, on success, defaults the time picker
  // to when the LATEST event that day appears (previews is sorted
  // newest-first). Shared by the date picker's own change handler, a
  // clicked report date, and the </> walker below when it crosses a day
  // boundary — one fetch path, never duplicated three ways. Returns the
  // resulting dayView (or null on failure/already-in-flight) so callers
  // that need to act on it (the walker) can chain off the promise.
  function fetchDayView(date) {
    if (!isAdmin || dayFetchInFlight) {
      return Promise.resolve(null);
    }
    dayFetchInFlight = true;
    eventsDateInput.disabled = true;
    eventsLoadStatus.textContent = 'loading events for ' + date + '…';
    return s86SignAndPost('/api/profile/day', { pubkey: pubkeyHex, date: date })
      .then(function (result) {
        dayFetchInFlight = false;
        eventsDateInput.disabled = false;
        if (!result.ok) {
          eventsLoadStatus.textContent = 'failed to load events for ' + date + ': ' + s86ErrMsg(result);
          return null;
        }
        eventsLoadStatus.textContent = '';
        dayView = { date: date, previews: result.body.previews, truncated: result.body.truncated };
        eventsDateInput.value = date;
        eventsTimeInput.value = dayView.previews.length > 0 ? utcTimeStr(dayView.previews[0].created_at) : '';
        renderPreviews();
        return dayView;
      })
      .catch(function () {
        dayFetchInFlight = false;
        eventsDateInput.disabled = false;
        eventsLoadStatus.textContent = 'failed to load events for ' + date;
        return null;
      });
  }

  eventsDateInput.addEventListener('change', function () {
    if (eventsDateInput.value) {
      fetchDayView(eventsDateInput.value);
    }
  });

  eventsDateClearBtn.addEventListener('click', function () {
    dayView = null;
    renderPreviews();
  });

  // </> page a whole UTC calendar day at a time — one more bounded
  // /api/profile/day fetch, never more than one per click — landing, as
  // fetchDayView always does, on that day's own latest event. The time
  // input is a display of when that latest event falls, not something
  // </> read back; it plays no part in which day comes next.
  //
  // '›' past the latest day doesn't fetch a future day — there's nothing
  // there yet — it instead checks for anything new since the last full
  // load, via the cheap /api/profile/new path below, rather than paying
  // for compute_profile()'s full three-scan recompute on every press.
  function stepDay(direction) {
    var dateStr = eventsDateInput.value;
    if (!dateStr) {
      eventsLoadStatus.textContent = 'pick a date first';
      return;
    }
    var todayStr = utcDateStr(Math.floor(Date.now() / 1000));
    if (direction > 0 && (!dayView || dayView.date >= todayStr)) {
      checkForNewEvents();
      return;
    }
    fetchDayView(addDaysToDateStr(dateStr, direction));
  }

  var PROFILE_PREVIEW_MAX_CLIENT = 20;   // mirrors server86.py's PROFILE_PREVIEW_MAX

  // The cheap alternative to fetchProfile(): reads only events newer than
  // the last-known one. When the server actually read every new event
  // (truncated: false) total_events/kinds are bumped by an EXACT delta —
  // no re-scan needed. When truncated is true there could be MORE new
  // events past the bound, so the true delta is unknown; rather than
  // apply a partial (and therefore misleading) delta, the stale counts
  // are left as they are and marked with a trailing '?' by
  // renderCounts()/renderKinds(), until a full reload (fetchProfile)
  // gets a real number again and clears it.
  function checkForNewEvents() {
    if (!isAdmin || !profileData || newEventsCheckInFlight) {
      return;
    }
    newEventsCheckInFlight = true;
    eventsLoadStatus.textContent = 'checking for new events…';
    var since = newestKnownCreatedAt != null ? newestKnownCreatedAt + 1 : 0;
    s86SignAndPost('/api/profile/new', { pubkey: pubkeyHex, since: since })
      .then(function (result) {
        newEventsCheckInFlight = false;
        if (!result.ok) {
          eventsLoadStatus.textContent = 'failed to check for new events: ' + s86ErrMsg(result);
          return;
        }
        var body = result.body;
        if (body.truncated) {
          profileData._countsUncertain = true;
        } else {
          if (profileData.total_events != null) {
            profileData.total_events += body.previews.length;
          }
          Object.keys(body.kinds_delta).forEach(function (k) {
            var kind = parseInt(k, 10);
            profileData.kinds[kind] = (profileData.kinds[kind] || 0) + body.kinds_delta[k];
          });
          // The kinds tally is a window over the newest kinds_window events.
          // Folding new events in without evicting the oldest grows it past
          // that bound on an already-saturated profile — so the label reads
          // '500+' rather than claiming an exact 500. A non-saturated window
          // still equals the lifetime, so it stays exact.
          if (profileData.kinds_saturated && body.previews.length > 0) {
            profileData._kindsWindowGrew = true;
          }
        }
        if (body.previews.length > 0) {
          profileData.previews = body.previews.concat(profileData.previews).slice(0, PROFILE_PREVIEW_MAX_CLIENT);
          newestKnownCreatedAt = body.previews[0].created_at;
        }
        dayView = null;
        eventsLoadStatus.textContent = '';
        renderCounts();
        renderKinds();
        renderPreviews();
      })
      .catch(function () {
        newEventsCheckInFlight = false;
        eventsLoadStatus.textContent = 'failed to check for new events';
      });
  }

  eventsTimePrevBtn.addEventListener('click', function () { stepDay(-1); });
  eventsTimeNextBtn.addEventListener('click', function () { stepDay(1); });

  // Automatic external lookup for THIS ONE pubkey only, exactly once per
  // page load — safe here in a way bulk lookups are not (see CLAUDE.md).
  // Note: /api/names only persists the result if this pubkey happens to
  // be banned or present in the author-scan cache (its accept-bound is
  // never widened just because the admin chose to look at a pubkey); for
  // any other subject the external answer simply isn't cached server-side
  // and this page shows it unresolved. See PHASES.md Phase 4 notes.
  function maybeResolveNameExternally() {
    if (!isAdmin || nameResolutionInFlight || attemptedExternalLookup) {
      return;
    }
    var p = profileData;
    if (p.name || p.nip05) {
      return;
    }
    attemptedExternalLookup = true;
    nameResolutionInFlight = true;
    s86ResolveNamesExternally([pubkeyHex], {
      onDone: function () {
        nameResolutionInFlight = false;
        fetchProfile();
      },
      onError: function () {
        nameResolutionInFlight = false;
      }
    });
  }
}
</script>
</body>
</html>
