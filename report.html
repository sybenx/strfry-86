<script>try{var s86t=localStorage.getItem('strfry86_theme');if(s86t==='light'||s86t==='dark'){document.documentElement.style.colorScheme=s86t;}}catch(e){}</script>
<title>strfry-86 — report</title>
<style>
/* strfry-86 style block — canonical source. tools/stamp_style.py copies this
   file verbatim into every page's <style>, so "identical character-for-character
   on every page" is enforced by a command, not by discipline. Edit here only.

   Colours resolve through light-dark(), which reads the SAME color-scheme value
   the theme button and the anti-flash <script> already set on <html> — the
   toggle mechanism of WHY.md §3 is unchanged, only its palette is now ours.
   Where light-dark() is unsupported the @supports block below hands every token
   back to a system colour, i.e. back to the browser-default rendering this
   project shipped before the paint. */
:root {
  color-scheme: light dark;
  --paper:   light-dark(oklch(.985 .004 60),        oklch(.155 .005 60));
  --surface: light-dark(oklch(1 0 0),               oklch(.205 .005 60));
  --ink:     light-dark(oklch(.18 .005 60),         oklch(.93 .004 60));
  --muted:   light-dark(oklch(.18 .005 60 / .55),   oklch(.93 .004 60 / .55));
  --rule:    light-dark(oklch(.18 .005 60 / .15),   oklch(.93 .004 60 / .18));
  --hair:    light-dark(oklch(.18 .005 60 / .08),   oklch(.93 .004 60 / .1));
  --wash:    light-dark(oklch(.18 .005 60 / .06),   oklch(.93 .004 60 / .08));
  --accent:  light-dark(oklch(.45 .18 25),          oklch(.72 .16 25));
  --good:    light-dark(oklch(.5 .12 145),          oklch(.75 .14 145));
  --term-bg: oklch(.14 .005 60);
  --term-fg: oklch(.9 .01 145);
  --term-edge: oklch(.3 .01 60);
  --serif: Georgia, "PT Serif", "Iowan Old Style", "Times New Roman", serif;
  --sans: "Helvetica Neue", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, "IBM Plex Mono", monospace;
}
@supports not (color: light-dark(#000, #fff)) {
  :root { --paper:Canvas; --surface:Canvas; --ink:CanvasText; --muted:GrayText;
          --rule:GrayText; --hair:GrayText; --wash:transparent;
          --accent:LinkText; --good:CanvasText; }
}
* { box-sizing:border-box; }
body { max-width:68em; margin:0 auto; padding:0 1.5em 4em; font-size:.94rem;
       line-height:1.55; font-family:var(--sans);
       background:var(--paper); color:var(--ink); }           /* WHY.md §3 */
h1, h2 { font-family:var(--serif); font-weight:700; letter-spacing:-.01em; margin:0 0 .4rem; }
h1 { font-size:1.7rem; }
h2 { font-size:1.2rem; margin-top:2.2rem; }
h3 { font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.1em;
     color:var(--muted); margin:1.6rem 0 .5rem; }
p { margin:.5rem 0; }
a { color:var(--accent); text-underline-offset:2px; }
li { overflow-wrap:anywhere; }
code { font-family:var(--mono); font-size:.85em; }
.mono { font-family:var(--mono); font-size:.9em; }
.nowrap { white-space:nowrap; }      /* already-truncated ids — never wrapped mid-key */
.muted, #status, #feed-age, #provenance-line, #truncated-line { color:var(--muted); }
.page-head { display:flex; align-items:baseline; justify-content:space-between;
             gap:1em; flex-wrap:wrap; }
.badge { font-family:var(--mono); font-size:.72rem; padding:.15em .5em; white-space:nowrap;
         background:var(--wash); border:1px solid var(--rule); border-radius:6px; }
.pill { display:inline-flex; align-items:center; gap:.45em; font-family:var(--mono);
        font-size:.7rem; letter-spacing:.08em; padding:.35em .75em;
        border:1px solid currentColor; border-radius:8px; color:var(--muted); }
.pill.live { color:var(--good); }
.pill .dot { width:.45em; height:.45em; border-radius:50%; background:currentColor; }
table { width:100%; border-collapse:collapse; margin:.8rem 0 1.4rem; font-size:.92em; }
th, td { text-align:left; padding:.6em .7em; border-bottom:1px solid var(--hair);
         font-variant-numeric:tabular-nums; }
tbody th { font-weight:600; }        /* row label, not a column header */
thead th { font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em;
           line-height:1.25; color:var(--muted); border-top:2px solid var(--ink);
           border-bottom:1px solid var(--rule); }
td[colspan] { color:var(--muted); }  /* the "+ N more …" tail summary row */
tbody tr:hover { background:var(--wash); }
button { font-family:var(--sans); font-size:.82rem; font-weight:600; padding:.5em 1em;
         color:var(--ink); background:transparent; border:1px solid var(--ink);
         border-radius:8px; cursor:pointer; }
button:hover:not(:disabled) { background:var(--ink); color:var(--paper); }
button:disabled { opacity:.4; cursor:not-allowed; }
input, select, textarea { font-family:var(--mono); font-size:.82rem; padding:.5em .7em;
         color:var(--ink); background:var(--surface); border:1px solid var(--rule);
         border-radius:8px; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
details { background:var(--surface); border:1px solid var(--rule); border-radius:10px;
          padding:.6em .9em; margin:1rem 0; }
summary { cursor:pointer; font-size:.85rem; font-weight:600; }
hr { border:none; border-top:3px double var(--rule); margin:2.4rem 0; }
pre { white-space:pre-wrap; overflow-wrap:anywhere;                /* commands only — WHY.md §2 */
      font-family:var(--mono); font-size:.8rem; line-height:1.65; padding:1em 1.1em;
      background:var(--term-bg); color:var(--term-fg);
      border:1px solid var(--term-edge); border-radius:14px; }
pre#console-log { min-height:6em; max-height:26em; overflow:auto; }
pre#console-log:empty::before { content:"strfry console — read-only verbs only";
                                color:oklch(.6 .01 60); }
.console-row { display:flex; align-items:center; gap:.5em; margin:.6rem 0; }
.console-row .prompt { font-family:var(--mono); color:var(--good); }
.console-row input { flex:1; }
#records-container p { padding-bottom:.6em; border-bottom:1px solid var(--hair); }
header#s86 { position:sticky; top:0; z-index:5; margin-bottom:1.4rem;
             background:var(--paper); border-bottom:3px double var(--rule); }
header#s86 .brand { display:flex; align-items:baseline; gap:.8em; padding:.9rem 0 .6rem; }
header#s86 a.logo { font-family:var(--serif); font-weight:bold; font-size:1.5rem;
                    letter-spacing:-.02em; white-space:nowrap;
                    text-decoration:none; color:inherit; }
header#s86 .tagline { font-size:.65rem; font-weight:600; letter-spacing:.14em;
                      text-transform:uppercase; color:var(--muted); }
header#s86 .spacer { flex:1; }
header#s86 .bar { display:flex; align-items:center; gap:.5em; flex-wrap:wrap;
                  border-top:1px solid var(--rule); }
header#s86 nav { display:flex; flex-wrap:wrap; }
header#s86 nav a { padding:.7em .75em; font-size:.82rem; font-weight:600;
                   color:var(--muted); text-decoration:none;
                   border-bottom:2px solid transparent; }
header#s86 nav a:hover { color:var(--ink); }
header#s86 nav a[aria-current="page"] { color:var(--ink); border-bottom-color:var(--accent); }
header#s86 input#q { flex:1; min-width:8em; max-width:24em; margin-left:auto; }
header#s86 button#theme-btn { border-color:var(--rule); padding:.45em .7em; }
@media (max-width:600px) {
  body { font-size:1rem; padding:0 1em 3em; }
  /* Nothing may push the page wider than the screen (rendering rule 5), so
     at phone widths every cell breaks an unbreakable key — an npub, a hex id,
     a nip-05 address — rather than let the table overflow. */
  th, td { padding:.5em .35em; overflow-wrap:anywhere; }
  .nowrap { white-space:normal; }
  header#s86 .tagline { display:none; }
  header#s86 input#q { max-width:none; margin:0 0 .5em; }
}
</style>
</head>
<body>
<h1>Report</h1>
<p id="status"></p>
<div id="admin-section" style="display:none">
  <h2>Database</h2>
  <div id="totals-panel-container"></div>
  <div id="walk-panel-container"></div>
  <p id="author-pointer-line"></p>

  <h2>Gift wrap storage</h2>
  <p>A safe gift-wrap retention purge needs both scans below: recipients, so the purge command can name whose gift wraps it would delete, and subscribers, so it can exempt the ones this relay is their own DM inbox for.</p>

  <div id="recipients-panel-container"></div>
  <div id="subscribers-panel-container"></div>

  <div id="command-block-container"></div>
  <div id="records-list"></div>
</div>
<script src="/common86.js"></script>
<script>
var adminPubkey = null;
var isAdmin = false;
var lastBanned = [];

var statusEl = document.getElementById('status');
var chrome = s86BuildPageChrome(statusEl);
var loginBtn = chrome.loginBtn;
var adminSection = document.getElementById('admin-section');
var commandBlockContainer = document.getElementById('command-block-container');
var recordsList = document.getElementById('records-list');
var authorPointerLine = document.getElementById('author-pointer-line');

function setStatus(text) {
  statusEl.textContent = text;
}

var KNOWN_KINDS = {
  0: 'profile', 1: 'note', 5: 'deletion', 6: 'repost', 7: 'reaction',
  1059: 'gift wrap', 1984: 'report', 9735: 'zap receipt',
  10002: 'relay list', 10050: 'DM relay list', 30023: 'long-form'
};
function kindLabel(kind) {
  return 'kind ' + kind + (KNOWN_KINDS[kind] ? ' (' + KNOWN_KINDS[kind] + ')' : '');
}

// --- § Database: totals + walk, sharing GET /api/report ------------------
// Two independent buttons, because independent persistence implies
// independent triggers: 'refresh totals' is seconds-long, 'run full
// database walk' is minutes-long, and a single button that takes three
// seconds on Tuesday and nine minutes on Wednesday is how an operator
// learns to be afraid of pressing it. The walk reads the same --count
// first for its own denominator, so pressing it refreshes the totals
// above as a byproduct — the reverse is never true.

var lastReportData = null;

function reportJobStatusFor(data, jobName) {
  if (data.status === 'running') {
    if (data.job === jobName) {
      return { status: 'running', progress: data.progress, total: data.total, rate: data.rate, eta: data.eta, blocked_by: null };
    }
    return { status: 'idle', blocked_by: 'report-' + data.job };
  }
  return { status: 'idle', blocked_by: data.blocked_by };
}

// The three-level allowlist-gap ladder from CLAUDE.md's "Auditing the
// allowlist — two questions, two thresholds". gap_level/needs_walk/
// gap_alarm_kind/gap_alarm_events all come from POST /api/report/totals;
// the 'notice, walk fresh, no alarm kind' case additionally names the
// gap's SHAPE from the walk record, since an index count alone knows only
// the gap's size, never its composition.
function renderGapVerdict(container, totals, walk) {
  var coveragePct = (100 - totals.gap_share * 100).toFixed(1);
  var gapPct = (totals.gap_share * 100).toFixed(1);

  if (totals.gap_level === 'ok') {
    container.appendChild(s86El('p', 'allowlist covers ' + coveragePct + '% of non-gift-wrap events.'));
    return;
  }

  if (totals.gap_level === 'stale') {
    var nonGiftwrap = totals.total_events - totals.giftwrap_events;
    var alarmPct = nonGiftwrap > 0 ? (totals.gap_alarm_events / nonGiftwrap * 100).toFixed(1) : '0.0';
    container.appendChild(s86El('p', kindLabel(totals.gap_alarm_kind) + ' holds ' + totals.gap_alarm_events.toLocaleString()
      + ' events — ' + alarmPct + '% of non-gift-wrap — and is NOT in AUTHOR_SCAN_KINDS.'));
    container.appendChild(s86El('p', 'The full author list is missing its authors. Add it.'));
    return;
  }

  // 'notice': size alone doesn't justify an alarm. Name the shape from the
  // walk when one is fresh enough to have produced this verdict; otherwise
  // say what would resolve it.
  if (totals.needs_walk || !walk || !walk.unlisted_kinds) {
    container.appendChild(s86El('p', 'allowlist covers ' + coveragePct + '% of non-gift-wrap events. The remaining '
      + gapPct + '% (' + totals.gap_events.toLocaleString() + ' events) has not been broken down by kind yet — '
      + 'run the database walk to see whether this is one missing kind or the long tail.'));
    return;
  }
  var unlisted = Object.keys(walk.unlisted_kinds)
    .map(function (k) { return [parseInt(k, 10), walk.unlisted_kinds[k]]; })
    .sort(function (a, b) { return b[1] - a[1]; });
  if (unlisted.length === 0) {
    container.appendChild(s86El('p', 'allowlist covers ' + coveragePct + '% of non-gift-wrap events.'));
    return;
  }
  var worst = unlisted[0];
  var nonGiftwrapWalk = totals.total_events - totals.giftwrap_events;
  var worstPct = nonGiftwrapWalk > 0 ? (worst[1] / nonGiftwrapWalk * 100).toFixed(2) : '0.00';
  var kindCount = walk.unlisted_kind_count != null ? walk.unlisted_kind_count : unlisted.length;
  container.appendChild(s86El('p', 'allowlist covers ' + coveragePct + '% of non-gift-wrap events. The remaining '
    + gapPct + '% is spread across ' + kindCount.toLocaleString() + ' kinds; the largest is ' + kindLabel(worst[0])
    + ' at ' + worst[1].toLocaleString() + ' events (' + worstPct + '%). This is the long tail, not staleness — '
    + 'no single kind is worth adding.'));
}

var totalsPanel = s86BuildScanPanel({
  heading: 'database totals',
  costText: 'reads three index counts — exact, seconds even on a large relay',
  buttonLabel: 'refresh totals',
  onStart: function () { return startReportJob('/api/report/totals'); },
  lastRunNote: function (record) { return record.duration != null ? ('last run: ' + s86FormatDuration(record.duration)) : null; },
  renderResult: function (container, record) {
    var nonGiftwrap = record.total_events - record.giftwrap_events;
    container.appendChild(s86BuildKeyValueTable([
      ['all events', record.total_events, ''],
      ['gift wraps', record.giftwrap_events, (record.giftwrap_share * 100).toFixed(1) + '% of all'],
      ['non-gift-wrap', nonGiftwrap, ''],
      ['— in allowlist', record.allowlist_events, (100 - record.gap_share * 100).toFixed(1) + '%'],
      ['— not in allowlist', record.gap_events, (record.gap_share * 100).toFixed(1) + '%']
    ]));
    renderGapVerdict(container, record, lastReportData && lastReportData.walk);
  }
});

var walkPanel = s86BuildScanPanel({
  heading: 'whole-database walk',
  costText: 'reads every event in the database — the estimate appears within a few seconds of starting; refreshes the totals above as a byproduct',
  buttonLabel: 'run full database walk',
  onStart: function () { return startReportJob('/api/report/walk'); },
  lastRunNote: function (record) { return record.duration != null ? ('last run: ' + s86FormatDuration(record.duration) + ' at ' + s86FormatRate(record.rate)) : null; },
  renderResult: function (container, record) {
    var giftwraps = record.distinct_authors_giftwrap;
    var kindsSeen = Object.keys(record.kinds || {}).length;
    var unlistedCount = record.unlisted_kind_count != null ? record.unlisted_kind_count : Object.keys(record.unlisted_kinds || {}).length;
    var unlistedTotal = record.unlisted_total != null ? record.unlisted_total : 0;
    var rows = [
      ['events walked', record.events_read, ''],
      ['distinct authors', record.distinct_authors, ''],
      ['— measured', record.distinct_authors_nongiftwrap, ''],
      ['— gift wraps', giftwraps, 'one key per message'],
      ['kinds seen', kindsSeen, ''],
      ['unlisted kinds', unlistedCount, unlistedTotal.toLocaleString() + ' events']
    ];
    // NIP-40 expired events, like gift wraps, are purgeable storage the
    // operator can weigh — surfaced here rather than in totals because a
    // --count can't see a non-single-letter tag, only a full walk can.
    // Guarded so a walk cached before this figure existed renders cleanly.
    if (record.expired_events != null) {
      var expiredShare = record.events_read > 0
        ? (record.expired_events / record.events_read * 100).toFixed(2) + '% of all'
        : '';
      rows.push(['expired events', record.expired_events, expiredShare]);
    }
    container.appendChild(s86BuildKeyValueTable(rows));

    var nonGiftwrap = record.events_read - giftwraps;
    var unlisted = Object.keys(record.unlisted_kinds || {})
      .map(function (k) {
        var count = record.unlisted_kinds[k];
        var pct = nonGiftwrap > 0 ? (count / nonGiftwrap * 100).toFixed(2) + '%' : '';
        return [kindLabel(parseInt(k, 10)), count, pct];
      })
      .sort(function (a, b) { return b[1] - a[1]; });
    container.appendChild(s86BuildRankedFigureTable(unlisted, {
      unit: 'unlisted kinds',
      grandTotal: record.unlisted_total,
      emptyText: 'no event kinds outside AUTHOR_SCAN_KINDS were seen'
    }));
  },
  extraNote: function (record) {
    var totals = lastReportData && lastReportData.totals;
    if (!totals || !totals.scanned_at || !record.scanned_at) {
      return null;
    }
    var deltaMin = Math.round(Math.abs(record.scanned_at - totals.scanned_at) / 60);
    if (deltaMin < 1) {
      return null;
    }
    return 'figures taken ' + deltaMin + ' minute' + (deltaMin === 1 ? '' : 's')
      + ' apart; events written in between account for small differences';
  }
});

document.getElementById('totals-panel-container').appendChild(totalsPanel.el);
document.getElementById('walk-panel-container').appendChild(walkPanel.el);

function applyReportStatus(data) {
  lastReportData = data;
  totalsPanel.applyStatus(reportJobStatusFor(data, 'totals'), data.totals);
  walkPanel.applyStatus(reportJobStatusFor(data, 'walk'), data.walk);
}

function fetchReport() {
  return fetch('/api/report').then(function (res) { return res.json(); });
}

function startReportJob(endpoint) {
  return s86SignAndPost(endpoint, {}).then(function (result) {
    if (!result.ok) {
      throw new Error(s86ErrMsg(result));
    }
    s86PollStatus(fetchReport, applyReportStatus);
  });
}

function loadAuthorPointer() {
  fetch('/api/authors')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      authorPointerLine.textContent = '';
      var prefix;
      if (data.scanned_at) {
        prefix = 'full author list — ' + (data.authors || []).length.toLocaleString() + ' authors, ' + s86FormatRelativeAge(data.scanned_at) + ' → ';
      } else {
        var recentMode = (data.modes && data.modes.recent) || {};
        var costPart = recentMode.typical_seconds
          ? ('a recent scan takes about ' + s86FormatDuration(recentMode.typical_seconds))
          : 'a recent scan takes about 3 seconds';
        prefix = 'full author list — never run; ' + costPart + ' → ';
      }
      authorPointerLine.appendChild(document.createTextNode(prefix));
      var link = document.createElement('a');
      link.href = '/authors';
      link.textContent = '/authors';
      authorPointerLine.appendChild(link);
    })
    .catch(function () {});
}

// --- § This relay's URL: config.json-backed, not strfry.conf -------------
// Existing solely so /api/subscribers can host-match a kind-10050/10002
// relay tag against THIS relay; strfry itself never reads this value.
// Built here (not static HTML) so it can be spliced directly under the
// subscribers panel's own heading rather than sitting in its own block.

var relayUrlInput = document.createElement('input');
relayUrlInput.type = 'text';
relayUrlInput.placeholder = 'wss://relay.example.com';
var relayUrlSaveBtn = document.createElement('button');
relayUrlSaveBtn.type = 'button';
relayUrlSaveBtn.textContent = 'Save';
var relayUrlStatus = s86El('p', '');

var relayUrlBlock = document.createElement('div');
var relayUrlRow = document.createElement('p');
relayUrlRow.appendChild(document.createTextNode('strfry url: '));
relayUrlRow.appendChild(relayUrlInput);
relayUrlRow.appendChild(relayUrlSaveBtn);
relayUrlBlock.appendChild(relayUrlRow);
relayUrlBlock.appendChild(relayUrlStatus);

function loadRelayUrl() {
  return fetch('/api/relay-url')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      relayUrlInput.value = data.relay_url || '';
    })
    .catch(function () {});
}

relayUrlSaveBtn.addEventListener('click', function () {
  if (!isAdmin) {
    return;
  }
  relayUrlStatus.textContent = 'saving…';
  s86SignAndPost('/api/relay-url', { relay_url: relayUrlInput.value })
    .then(function (result) {
      if (!result.ok) {
        relayUrlStatus.textContent = 'save failed: ' + s86ErrMsg(result);
        return;
      }
      relayUrlInput.value = result.body.relay_url || '';
      relayUrlStatus.textContent = result.body.relay_url
        ? 'saved — re-run the subscriber scan below to use it'
        : 'cleared';
    })
    .catch(function () {
      relayUrlStatus.textContent = 'save failed';
    });
});

// --- § Gift wrap storage: recipients + subscribers, each its own endpoint -

var RENDER_MAX_CLIENT = 500;

// Beneath the counts table: the actual pubkeys, capped and clickable, same
// shape s86BuildRecordDetailList already renders for a ban record's expand
// arrow — name in bold when known, nip05 as plain text, npub always a link.
// `countField`/`countUnit`, when given, append that row's own count after
// the npub ("— 42 gift wraps") — the rows already arrive ranked highest
// first (server-side sort), so truncating this array top-down is already
// "top N by amount"; nothing here re-sorts.
function appendPubkeyList(container, rows, label, countField, countUnit) {
  if (rows.length === 0) {
    return;
  }
  if (label) {
    container.appendChild(s86El('p', label));
  }
  var truncation = s86TruncateForRender(rows, RENDER_MAX_CLIENT);
  if (countField) {
    var ul = document.createElement('ul');
    truncation.shown.forEach(function (r) {
      var li = document.createElement('li');
      if (r.name) {
        li.appendChild(s86El('b', r.name + ' '));
      }
      if (r.nip05) {
        li.appendChild(document.createTextNode(r.nip05 + ' '));
      }
      li.appendChild(s86NpubLink(r.npub || r.pubkey, r.pubkey, true));
      li.appendChild(document.createTextNode(' — ' + r[countField].toLocaleString() + ' ' + countUnit));
      ul.appendChild(li);
    });
    container.appendChild(ul);
  } else {
    container.appendChild(s86BuildRecordDetailList(truncation.shown));
  }
  if (truncation.truncatedCount > 0) {
    container.appendChild(s86El('p', 'showing top ' + RENDER_MAX_CLIENT + ' of ' + truncation.totalCount));
  }
}

var recipientsPanel = s86BuildScanPanel({
  heading: 'gift-wrap recipients',
  costText: 'reads the newest 250,000 gift-wrap events — a few seconds to a couple of minutes',
  buttonLabel: 'scan gift-wrap recipients',
  onStart: function () { return startSimpleJob('/api/recipients', fetchRecipients, applyRecipientsStatus); },
  renderResult: function (container, record) {
    container.appendChild(s86BuildKeyValueTable([
      ['gift-wrap events read', record.events_read, record.saturated ? 'SATURATED — window limit reached' : ''],
      ['distinct recipients', record.recipients.length, ''],
      ['window', s86FormatDate(record.span_start) + ' → ' + s86FormatDate(record.span_end), '']
    ]));
    appendPubkeyList(container, record.recipients, null, 'count', 'gift wraps');
  }
});

var subscribersPanel = s86BuildScanPanel({
  heading: 'DM-inbox subscribers',
  costText: 'reads up to 50,000 DM-relay-list and general-relay-list events — a few seconds to a couple of minutes',
  buttonLabel: 'scan subscribers',
  onStart: function () { return startSimpleJob('/api/subscribers', fetchSubscribers, applySubscribersStatus); },
  renderResult: function (container, record) {
    container.appendChild(s86BuildKeyValueTable([
      ['relay', record.relay_url, ''],
      ['DM-inbox subscribers', record.subscribers.length, record.saturated ? 'SATURATED — floor, not a count' : ''],
      ['general relay-list subscribers', record.general_subscribers.length, '']
    ]));
    appendPubkeyList(container, record.subscribers, 'DM-inbox subscribers:');
    appendPubkeyList(container, record.general_subscribers, 'general relay-list subscribers:');
  },
  // Saturation is a REFUSAL of the exempt-purge command, not a label — a
  // saturated subscriber list is a FLOOR, so missing subscribers means
  // missing exemptions means MORE deletion, the opposite of a saturated
  // recipient scan. Checked ahead of staleness since it matters even on a
  // scan that just completed.
  extraNote: function (record) {
    if (record.saturated) {
      return 'subscriber scan hit its ' + (record.scan_limit ? record.scan_limit.toLocaleString() + '-event ' : '')
        + 'cap — the exempt purge command is unavailable until the cap is raised, because a floor cannot be used as an exemption list.';
    }
    if (!record.scanned_at) {
      return null;
    }
    var ageSec = Math.floor(Date.now() / 1000) - record.scanned_at;
    return ageSec > 7 * 24 * 3600
      ? 'older than 7 days — the subscriber-exempt purge command is unavailable until this is re-run'
      : null;
  }
});

document.getElementById('recipients-panel-container').appendChild(recipientsPanel.el);
document.getElementById('subscribers-panel-container').appendChild(subscribersPanel.el);
// splice the relay-url field in right below the panel's own "DM-inbox
// subscribers" <h3> — its first child — rather than above/below the panel.
subscribersPanel.el.insertBefore(relayUrlBlock, subscribersPanel.el.children[1]);

function fetchRecipients() { return fetch('/api/recipients').then(function (res) { return res.json(); }); }
function fetchSubscribers() { return fetch('/api/subscribers').then(function (res) { return res.json(); }); }
function applyRecipientsStatus(data) { recipientsPanel.applyStatus(data, data); }
function applySubscribersStatus(data) { subscribersPanel.applyStatus(data, data); }

function startSimpleJob(postEndpoint, fetchFn, applyFn) {
  return s86SignAndPost(postEndpoint, {}).then(function (result) {
    if (!result.ok) {
      throw new Error(s86ErrMsg(result));
    }
    applyFn(result.body);
    s86PollStatus(fetchFn, applyFn);
  });
}

// --- records / login -------------------------------------------------------

function renderRecords() {
  s86RenderRecords(recordsList, isAdmin, lastBanned, {
    onChanged: function () { loadBanned(); },
    onError: setStatus
  });
}

function loadBanned() {
  return fetch('/api/banned')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var firstLoad = adminPubkey === null;
      adminPubkey = data.admin;
      lastBanned = data.banned;
      if (firstLoad) {
        s86TryAutoLogin(adminPubkey, loginBtn, statusEl, onLogin);
      } else {
        renderRecords();
      }
    })
    .catch(function () {
      setStatus('failed to load ban list');
    });
}

function onLogin() {
  isAdmin = true;
  adminSection.style.display = '';
  renderRecords();
  fetchReport().then(applyReportStatus);
  fetchRecipients().then(applyRecipientsStatus);
  fetchSubscribers().then(applySubscribersStatus);
  loadAuthorPointer();
  loadRelayUrl();
}

s86WireLogin(loginBtn, statusEl, function () { return adminPubkey; }, onLogin);

commandBlockContainer.appendChild(s86BuildCommandGenerator());

loadBanned();
</script>
</body>
</html>
