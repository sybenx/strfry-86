<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico">
<script>try{var s86t=localStorage.getItem('strfry86_theme');if(s86t==='light'||s86t==='dark'){document.documentElement.style.colorScheme=s86t;}}catch(e){}</script>
<title>Settings — strfry-86</title>
<style>
/* strfry-86 style block — canonical source. tools/stamp_style.py copies this
   file verbatim into every page's <style>, so "identical character-for-character
   on every page" is enforced by a command, not by discipline. Edit here only.

   Colours resolve through light-dark(), which reads the SAME color-scheme value
   the theme button and the anti-flash <script> already set on <html> — the
   toggle mechanism of WHY.md §3 is unchanged, only its palette is now ours.
   Where light-dark() is unsupported the @supports block below hands every token
   back to a system colour, i.e. back to the browser-default rendering this
   project shipped before the paint. */
:root {
  color-scheme: light dark;
  --paper:   light-dark(oklch(.985 .004 60),        oklch(.155 .005 60));
  --surface: light-dark(oklch(1 0 0),               oklch(.205 .005 60));
  --ink:     light-dark(oklch(.18 .005 60),         oklch(.93 .004 60));
  --muted:   light-dark(oklch(.18 .005 60 / .55),   oklch(.93 .004 60 / .55));
  --rule:    light-dark(oklch(.18 .005 60 / .15),   oklch(.93 .004 60 / .18));
  --hair:    light-dark(oklch(.18 .005 60 / .08),   oklch(.93 .004 60 / .1));
  --wash:    light-dark(oklch(.18 .005 60 / .06),   oklch(.93 .004 60 / .08));
  --accent:  light-dark(oklch(.45 .18 25),          oklch(.72 .16 25));
  --good:    light-dark(oklch(.5 .12 145),          oklch(.75 .14 145));
  --term-bg: oklch(.14 .005 60);
  --term-fg: oklch(.9 .01 145);
  --term-edge: oklch(.3 .01 60);
  --serif: Georgia, "PT Serif", "Iowan Old Style", "Times New Roman", serif;
  --sans: "Helvetica Neue", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, "IBM Plex Mono", monospace;
}
@supports not (color: light-dark(#000, #fff)) {
  :root { --paper:Canvas; --surface:Canvas; --ink:CanvasText; --muted:GrayText;
          --rule:GrayText; --hair:GrayText; --wash:transparent;
          --accent:LinkText; --good:CanvasText; }
}
* { box-sizing:border-box; }
body { max-width:68em; margin:0 auto; padding:0 1.5em 4em; font-size:.94rem;
       line-height:1.55; font-family:var(--sans);
       background:var(--paper); color:var(--ink); }           /* WHY.md §3 */
h1, h2 { font-family:var(--serif); font-weight:700; letter-spacing:-.01em; margin:0 0 .4rem; }
h1 { font-size:1.7rem; }
h2 { font-size:1.2rem; margin-top:2.2rem; }
h3 { font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.1em;
     color:var(--muted); margin:1.6rem 0 .5rem; }
p { margin:.5rem 0; }
a { color:var(--accent); text-underline-offset:2px; }
li { overflow-wrap:anywhere; }
code { font-family:var(--mono); font-size:.85em; }
.mono { font-family:var(--mono); font-size:.9em; }
.nowrap { white-space:nowrap; }      /* already-truncated ids — never wrapped mid-key */
.muted, #status, #feed-age, #provenance-line, #truncated-line { color:var(--muted); }
.page-head { display:flex; align-items:baseline; justify-content:space-between;
             gap:1em; flex-wrap:wrap; }
.badge { font-family:var(--mono); font-size:.72rem; padding:.15em .5em; white-space:nowrap;
         background:var(--wash); border:1px solid var(--rule); border-radius:6px; }
.pill { display:inline-flex; align-items:center; gap:.45em; font-family:var(--mono);
        font-size:.7rem; letter-spacing:.08em; padding:.35em .75em;
        border:1px solid currentColor; border-radius:8px; color:var(--muted); }
.pill.live { color:var(--good); }
.pill .dot { width:.45em; height:.45em; border-radius:50%; background:currentColor; }
.chip { display:inline-block; font-family:var(--mono); font-size:.7rem; padding:.2em .6em;
        border:1px solid currentColor; border-radius:6px; color:var(--muted); }
.chip.good { color:var(--good); }
.chip.bad { color:var(--accent); }
.chips { display:flex; flex-wrap:wrap; gap:.4em; margin:.6rem 0; }
button.chip.cmd { font-weight:400; background:transparent; color:var(--ink);
                  border-color:var(--rule); }
button.chip.cmd:hover { background:var(--ink); color:var(--paper); }
/* Identity dot, never an avatar: the hue comes from the pubkey itself, so no
   row on any page ever fetches an image from a stranger's host. */
.idot { width:.75em; height:.75em; border-radius:50%; flex:none;
        background:oklch(.65 .11 var(--h, 0)); }
.idot.unknown { background:var(--rule); }
.idot.big { width:4.5em; height:4.5em; }
.profile-head { display:flex; gap:1.5em; align-items:flex-start; padding-bottom:1.4rem;
                margin-bottom:1.2rem; border-bottom:1px solid var(--rule); }
.profile-head .profile-id { flex:1; min-width:0; }
.profile-head .profile-id > * { margin:.25rem 0; }
.profile-head h2 { font-size:1.5rem; margin:0; }
/* Identity stays a real table-cell. display:flex on the <td> itself took it
   out of table layout, so its border-bottom sat at a different height from
   every sibling cell after the avatar was replaced by a small colour dot.
   Flex lives on the inner .idrow; the cell keeps vertical-align so the
   divider line is one continuous rule across the row. */
td.identity { max-width:15em; white-space:nowrap; vertical-align:middle; }
td.identity .idrow { display:flex; align-items:center; gap:.4em; min-width:0;
                     line-height:1.2; }
td.identity .idrow > :last-child { overflow:hidden; text-overflow:ellipsis;
                                   min-width:0; }
td.num { font-family:var(--mono); font-size:.9em; }
td.num.bad { color:var(--accent); }
td.pick { width:1.5em; }
td.action { text-align:right; white-space:nowrap; }
/* A clipped cell must not be allowed to size its column, or one long note
   pushes every other column off the page. max-width:0 hands the column its
   width from the table instead; `.grow` then gives it whatever is left. */
td.clip { max-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
th.grow, td.grow { width:100%; }
.struck { text-decoration:line-through; }
/* A control that reads as a link but IS a button — it performs an action, so
   it must be a button for the keyboard and the screen reader both. */
button.linky { font-size:.78rem; font-weight:400; padding:.15em .3em; border:none;
               background:none; color:var(--accent); text-decoration:underline;
               text-underline-offset:2px; }
button.linky:hover:not(:disabled) { background:none; color:var(--accent); opacity:.7; }
.toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:.6em; margin:.7rem 0; }
.toolbar > input[type="search"], .toolbar > input[type="text"] { flex:1; min-width:12em; }
.modes { display:flex; flex-direction:column; gap:.3em; }
.modes label { display:flex; align-items:baseline; gap:.5em; font-size:.88rem; }
dl.tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(11em, 1fr));
           gap:1px; margin:1.2rem 0;
           border:1px solid var(--rule); border-radius:10px; overflow:hidden; }
/* Hairline lives on each tile, not the grid container: a container
   background showing through the gaps would also fill any UNFILLED
   tracks in a short last row (tile count rarely divides evenly into the
   fitted column count), painting a blank colored block where no tile
   exists. */
dl.tiles .tile { background:var(--surface); padding:.9em 1em;
                 box-shadow:inset 0 0 0 1px var(--rule); }
dl.tiles dt { font-size:.68rem; font-weight:600; text-transform:uppercase;
              letter-spacing:.08em; color:var(--muted); }
dl.tiles dd { margin:.3rem 0 0; font-family:var(--serif); font-size:1.5rem;
              font-weight:700; letter-spacing:-.02em; }
dl.tiles .note { margin:.2rem 0 0; font-family:var(--mono); font-size:.68rem; color:var(--muted); }
dl.tiles .note.bad { color:var(--accent); }
.field-row { display:grid; grid-template-columns:16em 1fr; gap:1.2em;
             align-items:baseline; padding:.45em 0; }
.field-label { font-size:.85rem; color:var(--muted); }
.field-control input[type="text"], .field-control input[type="number"] { width:100%; max-width:24em; }
.field-control .note { margin:.2rem 0 0; font-size:.72rem; color:var(--muted); }
/* Destructive / dependency warnings on a setting (e.g. writePolicy.plugin).
   --accent is the project's "bad" colour; weight makes it read before the
   muted help line under it. */
.field-control .note.bad { color:var(--accent); font-weight:600; }
/* Compact progress: the "N of ~M" size figure is the one number that matters
   mid-run, so it steps out of the muted note colour into full ink + bold. */
.field-control .note .figure { color:var(--ink); font-weight:700;
                               font-family:var(--mono); }
/* Range shares the same chrome as settings buttons: ink border, 8px radius,
   sans label weight. The native track is replaced so it does not look like a
   browser default next to Save / Edit raw. */
.field-control input[type="range"] {
  -webkit-appearance: none; appearance: none;
  flex:1; min-width:10em; max-width:18em; height:2.35em; margin:0;
  font-family:var(--sans); font-size:.82rem; font-weight:600;
  color:var(--ink); background:transparent;
  border:1px solid var(--ink); border-radius:8px; cursor:pointer;
  padding:0 .7em;
}
.field-control input[type="range"]::-webkit-slider-runnable-track {
  height:2px; background:var(--rule); border-radius:1px;
}
.field-control input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width:1em; height:1em; margin-top:-.4em;
  background:var(--ink); border:1px solid var(--ink); border-radius:4px;
  cursor:pointer;
}
.field-control input[type="range"]::-moz-range-track {
  height:2px; background:var(--rule); border:none; border-radius:1px;
}
.field-control input[type="range"]::-moz-range-thumb {
  width:1em; height:1em;
  background:var(--ink); border:1px solid var(--ink); border-radius:4px;
  cursor:pointer;
}
.field-control .range-days {
  font-family:var(--sans); font-size:.82rem; font-weight:600;
  padding:.5em 1em; color:var(--ink); background:transparent;
  border:1px solid var(--ink); border-radius:8px; min-width:5.5em;
  text-align:center; white-space:nowrap;
}
textarea { width:100%; font-family:var(--mono); font-size:.78rem; line-height:1.6;
           padding:1em; resize:vertical; background:var(--term-bg); color:var(--term-fg);
           border:1px solid var(--term-edge); border-radius:14px; }
.console-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.2em; align-items:start; }
.console-grid h3 { display:flex; align-items:center; gap:.5em; }
.dot-inline { width:.5em; height:.5em; border-radius:50%; background:var(--good); flex:none; }
.dot-inline.warn { background:light-dark(oklch(.6 .14 80), oklch(.8 .14 80)); }
.dot-inline.off { background:var(--rule); }
table { width:100%; border-collapse:collapse; margin:.8rem 0 1.4rem; font-size:.92em; }
th, td { text-align:left; padding:.6em .7em; border-bottom:1px solid var(--hair);
         font-variant-numeric:tabular-nums; }
tbody th { font-weight:600; }        /* row label, not a column header */
thead th { font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em;
           line-height:1.25; color:var(--muted); border-top:2px solid var(--ink);
           border-bottom:1px solid var(--rule); }
/* Sortable list headers: a real button that wears the thead chrome, never a
   second sort-control row elsewhere on the page. Active column is ink so the
   ↑/↓ arrow is visible against the muted default. */
thead th.sortable { color:var(--muted); }
thead th.sortable[aria-sort="ascending"],
thead th.sortable[aria-sort="descending"] { color:var(--ink); }
button.th-sort { font:inherit; font-size:inherit; font-weight:inherit;
                 letter-spacing:inherit; text-transform:inherit;
                 color:inherit; background:none; border:none; padding:0;
                 margin:0; cursor:pointer; text-align:left; border-radius:0; }
button.th-sort:hover:not(:disabled) { background:none; color:var(--ink); }
td[colspan] { color:var(--muted); }  /* the "+ N more …" tail summary row */
tbody tr:hover { background:var(--wash); }
button { font-family:var(--sans); font-size:.82rem; font-weight:600; padding:.5em 1em;
         color:var(--ink); background:transparent; border:1px solid var(--ink);
         border-radius:8px; cursor:pointer; }
button:hover:not(:disabled) { background:var(--ink); color:var(--paper); }
button:disabled { opacity:.4; cursor:not-allowed; }
input, select, textarea { font-family:var(--mono); font-size:.82rem; padding:.5em .7em;
         color:var(--ink); background:var(--surface); border:1px solid var(--rule);
         border-radius:8px; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
details { background:var(--surface); border:1px solid var(--rule); border-radius:10px;
          padding:.6em .9em; margin:1rem 0; }
summary { cursor:pointer; font-size:.85rem; font-weight:600; }
hr { border:none; border-top:3px double var(--rule); margin:2.4rem 0; }
pre { white-space:pre-wrap; overflow-wrap:anywhere;                /* commands only — WHY.md §2 */
      font-family:var(--mono); font-size:.8rem; line-height:1.65; padding:1em 1.1em;
      background:var(--term-bg); color:var(--term-fg);
      border:1px solid var(--term-edge); border-radius:14px; }
pre#console-log, pre#decision-log { min-height:12em; max-height:26em; overflow:auto; }
/* A log line is one line. Wrapping a key across two rows makes a tail
   unreadable, so this panel scrolls sideways inside its own box — which the
   no-horizontal-scroll rule is about the PAGE, not about a terminal. */
pre#decision-log { white-space:pre; overflow-wrap:normal; }
pre#console-log:empty::before { content:"strfry console — read-only verbs only";
                                color:oklch(.6 .01 60); }
pre .good { color:oklch(.78 .1 145); }
pre .bad { color:oklch(.72 .16 25); }
pre .dim { color:oklch(.6 .01 60); }
/* Console answer (stdout): the one number that matters after a scan --count.
   Bold + good so it does not share weight with dimmed loguru leftovers. */
pre .console-answer { font-weight:700; }
.console-row { display:flex; align-items:center; gap:.5em; margin:.6rem 0; }
.console-row .prompt { font-family:var(--mono); color:var(--good); }
.console-row input { flex:1; }
#records-container p { padding-bottom:.6em; border-bottom:1px solid var(--hair); }
header#s86 { position:sticky; top:0; z-index:5; margin-bottom:1.4rem;
             background:var(--paper); border-bottom:3px double var(--rule); }
header#s86 .brand { display:flex; align-items:baseline; gap:.8em; padding:.9rem 0 .6rem; }
header#s86 a.logo { font-family:var(--serif); font-weight:bold; font-size:1.5rem;
                    letter-spacing:-.02em; white-space:nowrap;
                    text-decoration:none; color:inherit; }
header#s86 .tagline { font-size:.65rem; font-weight:600; letter-spacing:.14em;
                      text-transform:uppercase; color:var(--muted); }
header#s86 .spacer { flex:1; }
header#s86 .bar { display:flex; align-items:center; gap:.5em; flex-wrap:wrap;
                  border-top:1px solid var(--rule); }
header#s86 nav { display:flex; flex-wrap:wrap; }
header#s86 nav a { padding:.7em .75em; font-size:.82rem; font-weight:600;
                   color:var(--muted); text-decoration:none;
                   border-bottom:2px solid transparent; }
header#s86 nav a:hover { color:var(--ink); }
header#s86 nav a[aria-current="page"] { color:var(--ink); border-bottom-color:var(--accent); }
header#s86 input#q { flex:1; min-width:8em; max-width:24em; margin-left:auto; }
header#s86 button#theme-btn { border-color:var(--rule); padding:.45em .7em; }
@media (max-width:600px) {
  body { font-size:1rem; padding:0 1em 3em; }
  /* Nothing may push the page wider than the screen (rendering rule 5), so
     at phone widths every cell breaks an unbreakable key — an npub, a hex id,
     a nip-05 address — rather than let the table overflow. identity/action
     keep white-space:nowrap at desktop; they must drop it here too, not only
     the .nowrap class. */
  th, td { padding:.5em .35em; overflow-wrap:anywhere; }
  .nowrap { white-space:normal; }
  td.clip,
  td.identity,
  td.action { max-width:none; white-space:normal; }
  table { font-size:.85em; }
  /* iOS Safari zooms the page on focus when a control is under 16px. Match
     the body size so filter/search/console inputs stay at the current scale. */
  input, select, textarea, button { font-size:1rem; }
  button { min-height:2.75em; padding:.6em 1em; }
  header#s86 button#theme-btn,
  header#s86 button#login-btn { min-height:2.75em; }
  .toolbar > input[type="search"],
  .toolbar > input[type="text"] { min-width:0; }
  .console-grid { grid-template-columns:1fr; }
  /* Same min-width:auto trap as .toolbar above: a flex/grid item will not
     shrink below its intrinsic size, and an <input> carries the width of its
     default ~20-character size attribute. That floor propagated out through
     .console-row to the grid column and pushed the whole PAGE into sideways
     scroll — the one thing rendering rule 5 forbids. (pre#decision-log still
     scrolls sideways inside its own box; that is a terminal, not the page.) */
  .console-row input { min-width:0; }
  .console-grid > * { min-width:0; }
  .field-row { grid-template-columns:1fr; gap:.2em; }
  .profile-head { flex-direction:column; gap:1em; }
  .profile-head .idot.big { width:3em; height:3em; }
  header#s86 .brand { padding:.7rem 0 .45rem; gap:.5em; }
  header#s86 a.logo { font-size:1.3rem; }
  header#s86 .tagline { display:none; }
  header#s86 nav a { padding:.65em .45em; font-size:.78rem; }
  /* Search always owns its own row under the tabs — never squeezed beside them. */
  header#s86 input#q { flex-basis:100%; max-width:none; margin:0 0 .5em; min-width:0; }

  /* List tables (class cards): each row becomes a stacked card. Column labels
     come from data-label on the cell — figure/key-value tables never take
     this class. Sort headers restyle as a wrap of chips so reordering still
     works without a wide thead. */
  table.cards { display:block; width:100%; font-size:1em; }
  table.cards thead { display:block; margin:0 0 .85rem; }
  table.cards thead tr { display:flex; flex-wrap:wrap; gap:.35em; }
  table.cards thead th { display:block; border:none; padding:0;
                         text-transform:none; letter-spacing:normal; line-height:1.2; }
  table.cards thead th:not(.sortable) { display:none; }
  table.cards thead button.th-sort {
    display:inline-flex; align-items:center; min-height:2.5em;
    padding:.4em .65em; border:1px solid var(--rule); border-radius:6px;
    background:var(--surface); color:inherit; font-size:.78rem; font-weight:600;
    letter-spacing:.04em; text-transform:uppercase;
  }
  table.cards thead th[aria-sort="ascending"] button.th-sort,
  table.cards thead th[aria-sort="descending"] button.th-sort {
    border-color:var(--ink); color:var(--ink);
  }
  table.cards tbody { display:block; }
  table.cards tbody tr {
    display:block; background:var(--surface); border:1px solid var(--rule);
    border-radius:10px; padding:.55em .85em; margin:0 0 .65em;
  }
  table.cards tbody tr:hover { background:var(--wash); }
  /* Block layout (not grid) so multi-child cells — audit Detail, identity
     idrow + badge — keep their normal inline flow under the label strip. */
  table.cards tbody td {
    display:block; padding:.4em 0; border-bottom:1px solid var(--hair);
    max-width:none; white-space:normal; overflow:visible; text-overflow:unset;
  }
  table.cards tbody td:last-child { border-bottom:none; }
  table.cards tbody td[data-label]::before {
    content:attr(data-label); display:block; margin:0 0 .15em;
    font-size:.68rem; font-weight:600; text-transform:uppercase;
    letter-spacing:.08em; color:var(--muted); line-height:1.3;
  }
  table.cards tbody td.pick {
    border-bottom:1px solid var(--hair); padding:.15em 0 .45em;
  }
  table.cards tbody td.pick:empty { display:none; }
  /* Size the pick-column control without an attribute selector that would
     match a static-source grep for assembled-set controls on scan pages. */
  table.cards tbody td.pick input {
    width:1.25em; height:1.25em; vertical-align:middle;
  }
  table.cards tbody td.identity .idrow { min-width:0; }
  table.cards tbody td.action {
    display:flex; justify-content:flex-end; gap:.5em;
    border-bottom:none; padding-top:.55em;
  }
  table.cards tbody td.action:empty { display:none; }
  table.cards tbody td.action::before { content:none; }
  table.cards tbody td.clip { white-space:normal; max-width:none; }

  /* Feed cards only: two compact meta lines (time · kind / author), content
     keeps its stacked label, result is one inline line. Other card tables
     keep the full stacked data-label layout above. */
  table.cards.feed tbody td.time,
  table.cards.feed tbody td.kind {
    display:inline-flex; align-items:center; gap:.4em;
    width:auto; max-width:none; padding:.1em 0 .25em;
    border-bottom:none; white-space:nowrap;
  }
  table.cards.feed tbody td.time { padding-right:.15em; }
  table.cards.feed tbody td.time::before {
    display:inline; margin:0 .4em 0 0; vertical-align:baseline;
  }
  table.cards.feed tbody td.time::after {
    content:"·"; color:var(--muted); margin:0 .15em 0 .45em;
    font-weight:400; letter-spacing:0; text-transform:none;
  }
  table.cards.feed tbody td.kind::before { content:none; }
  table.cards.feed tbody td.identity {
    display:block; padding:.1em 0 .45em;
    border-bottom:1px solid var(--hair);
  }
  table.cards.feed tbody td.identity::before { content:none; }
  table.cards.feed tbody td.clip {
    display:block; padding:.45em 0;
    border-bottom:1px solid var(--hair);
  }
  table.cards.feed tbody td.result {
    display:flex; align-items:center; gap:.5em;
    padding:.4em 0 0; border-bottom:none;
  }
  table.cards.feed tbody td.result::before {
    display:inline; margin:0; vertical-align:baseline;
  }

  /* Users cards: identity without label, NIP-05 one line, Events · Reports ·
     Gift-wraps on one meta line, last-active inline, Ban via .action. */
  table.cards.users tbody td.identity {
    display:block; padding:.1em 0 .35em; border-bottom:none;
  }
  table.cards.users tbody td.identity::before { content:none; }
  table.cards.users tbody td.nip05 {
    display:flex; align-items:baseline; flex-wrap:wrap; gap:.35em .5em;
    padding:.15em 0 .4em; border-bottom:1px solid var(--hair);
    white-space:normal;
  }
  table.cards.users tbody td.nip05::before {
    display:inline; margin:0; flex:none; vertical-align:baseline;
  }
  table.cards.users tbody td.events,
  table.cards.users tbody td.reports,
  table.cards.users tbody td.giftwraps {
    display:inline-flex; align-items:center; gap:.35em;
    width:auto; max-width:none; padding:.35em 0 .15em;
    border-bottom:none; white-space:nowrap;
  }
  table.cards.users tbody td.events::before,
  table.cards.users tbody td.reports::before,
  table.cards.users tbody td.giftwraps::before {
    display:inline; margin:0; vertical-align:baseline;
  }
  table.cards.users tbody td.events::after,
  table.cards.users tbody td.reports::after {
    content:"·"; color:var(--muted); margin:0 .15em 0 .4em;
    font-weight:400; letter-spacing:0; text-transform:none;
  }
  table.cards.users tbody td.last {
    display:flex; align-items:center; gap:.5em;
    padding:.35em 0 .15em; border-bottom:1px solid var(--hair);
    white-space:nowrap;
  }
  table.cards.users tbody td.last::before {
    display:inline; margin:0; vertical-align:baseline;
  }

  /* Banned-pubkey cards: identity without label; banned · source · blocked
     on one meta line; reason keeps stacked free-text label. */
  table.cards.bans tbody td.identity {
    display:block; padding:.1em 0 .35em; border-bottom:none;
  }
  table.cards.bans tbody td.identity::before { content:none; }
  table.cards.bans tbody td.when,
  table.cards.bans tbody td.source,
  table.cards.bans tbody td.blocked {
    display:inline-flex; align-items:center; gap:.35em;
    width:auto; max-width:none; padding:.35em 0 .15em;
    border-bottom:none; white-space:nowrap;
  }
  table.cards.bans tbody td.when::before,
  table.cards.bans tbody td.blocked::before {
    display:inline; margin:0; vertical-align:baseline;
  }
  /* Source badge is self-explanatory — no SOURCE strip beside kind:spam. */
  table.cards.bans tbody td.source::before { content:none; }
  table.cards.bans tbody td.when::after,
  table.cards.bans tbody td.source::after {
    content:"·"; color:var(--muted); margin:0 .15em 0 .4em;
    font-weight:400; letter-spacing:0; text-transform:none;
  }
  table.cards.bans tbody td.reason {
    display:block; padding:.45em 0; border-bottom:none;
    white-space:normal;
  }

  /* Domain-receipt cards: domain as heading; banned · count on one meta
     line; reason stacked; Unban via .action. */
  table.cards.domains tbody td.domain {
    display:block; padding:.1em 0 .35em; border-bottom:none;
    font-weight:600;
  }
  table.cards.domains tbody td.domain::before { content:none; }
  table.cards.domains tbody td.when,
  table.cards.domains tbody td.count {
    display:inline-flex; align-items:center; gap:.35em;
    width:auto; max-width:none; padding:.35em 0 .15em;
    border-bottom:none; white-space:nowrap;
  }
  table.cards.domains tbody td.when::before {
    display:inline; margin:0; vertical-align:baseline;
  }
  /* Value already reads "n of m still banned" — no PUBKEYS strip. */
  table.cards.domains tbody td.count::before { content:none; }
  table.cards.domains tbody td.when::after {
    content:"·"; color:var(--muted); margin:0 .15em 0 .4em;
    font-weight:400; letter-spacing:0; text-transform:none;
  }
  table.cards.domains tbody td.reason {
    display:block; padding:.45em 0; border-bottom:1px solid var(--hair);
    white-space:normal;
  }
}

/* Users layout: one filter node, two visual homes by breakpoint.
   Mobile keeps title + search on the first row (page-head feel).
   Desktop drops the search to the row immediately above the list. */
.users-layout {
  display:grid;
  grid-template-columns:1fr minmax(8em, 18em);
  grid-template-areas:
    "title filter"
    "status status"
    "tools tools"
    "list list";
  column-gap:1em;
  row-gap:0;
  align-items:baseline;
}
.users-layout .users-title { grid-area:title; margin:0; min-width:0; }
.users-layout .users-title h1 { margin:0; }
.users-layout .users-filter { grid-area:filter; width:100%; min-width:0; margin:0; }
.users-layout .users-status { grid-area:status; }
.users-layout .users-tools { grid-area:tools; }
.users-layout .users-list { grid-area:list; }
@media (min-width:601px) {
  .users-layout {
    grid-template-columns:1fr;
    grid-template-areas:
      "title"
      "status"
      "tools"
      "filter"
      "list";
  }
  .users-layout .users-filter { margin:.7rem 0 .5rem; max-width:32em; }
}
</style>
</head>
<body>
<h1>Settings</h1>
<p id="status"></p>
<div id="admin-section" style="display:none">
  <div id="relay-section"></div>
  <hr>
  <div id="app-section"></div>
  <hr>
  <div id="ephemeral-section"></div>
</div>
<script src="/common86.js"></script>
<script>
// Two config files, one control: the relay's own strfry.conf and strfry-86's
// config.json render through the same builder, because they are the same
// question asked twice and an operator should not have to learn two editors.
//
// Nothing here restarts anything. strfry re-reads its config on its own, and
// the one setting that genuinely needs a restart (the admin UI's own port and
// bind address) says so on its row rather than pretending otherwise.
//
// Saving a field writes ONLY that field's line: the server rewrites the value
// token in place and leaves comments, ordering and everything its parser does
// not model byte-identical. A hand-tuned config survives a visit here.
var adminPubkey = null;
var isAdmin = false;
var payload = null;

var statusEl = document.getElementById('status');
var chrome = s86BuildPageChrome(statusEl);
var loginBtn = chrome.loginBtn;
var adminSection = document.getElementById('admin-section');

function setStatus(text) { statusEl.textContent = text; }

function sectionTitle(raw) {
  if (!raw || raw === 'general') {
    return 'General';
  }
  return raw.split('.').map(function (part) {
    return part.replace(/([a-z])([A-Z])/g, '$1 $2');
  }).join(' → ').replace(/^./, function (c) { return c.toUpperCase(); });
}

function fieldLabel(field) {
  if (field.label) {
    return field.label;
  }
  return field.key.replace(/([a-z0-9])([A-Z])/g, '$1 $2').replace(/^./, function (c) { return c.toUpperCase(); });
}

// One row: label on the left, the control the value's own type deserves on
// the right. A bool gets a real checkbox rather than a painted div — it has
// to be reachable by keyboard and readable by a screen reader, and the design
// language is carried by CSS, not by giving up the element.
function buildFieldRow(field, onDirty) {
  var row = s86El('div', null, 'field-row');
  var label = document.createElement('label');
  label.className = 'field-label';
  label.textContent = fieldLabel(field);
  var id = 'f-' + field.path.replace(/[^a-zA-Z0-9]/g, '-');
  label.setAttribute('for', id);
  row.appendChild(label);

  var control;
  var valueReadout = null;
  var estimateEl = null;
  var purgeBtn = null;
  var purgeStatus = null;
  var compactBtn = null;
  var compactStatus = null;
  if (field.type === 'bool') {
    control = document.createElement('input');
    control.type = 'checkbox';
    control.checked = String(field.value) === 'true';
    control.className = 'toggle';
  } else if (field.type === 'range') {
    control = document.createElement('input');
    control.type = 'range';
    control.min = field.min != null ? field.min : 7;
    control.max = field.max != null ? field.max : 30;
    control.step = field.step != null ? field.step : 1;
    control.value = field.value == null || field.value === '' ? control.max : String(field.value);
    valueReadout = s86El('span', control.value + ' days', 'range-days');
    estimateEl = s86El('p', 'estimating…', 'note');
    purgeBtn = s86El('button', 'Purge now');
    purgeBtn.type = 'button';
    purgeStatus = s86El('span', '', 'muted');
    compactBtn = s86El('button', 'Compact');
    compactBtn.type = 'button';
    compactBtn.title = 'Write a compacted copy of the database (does not shrink the live file by itself)';
    compactStatus = s86El('span', '', 'muted');
  } else {
    control = document.createElement('input');
    control.type = field.type === 'int' ? 'number' : 'text';
    control.value = field.value == null ? '' : String(field.value);
  }
  control.id = id;
  control.setAttribute('data-path', field.path);
  control.addEventListener('input', onDirty);
  control.addEventListener('change', onDirty);

  var right = s86El('div', null, 'field-control');
  if (field.type === 'range') {
    var sliderRow = s86El('div', null, 'toolbar');
    sliderRow.appendChild(control);
    sliderRow.appendChild(valueReadout);
    sliderRow.appendChild(purgeBtn);
    sliderRow.appendChild(compactBtn);
    sliderRow.appendChild(purgeStatus);
    right.appendChild(sliderRow);
    var compactRow = s86El('p', null, 'note');
    compactRow.appendChild(document.createTextNode('After a purge, Compact writes a smaller copy next to the live database. Reclaiming that space needs a relay stop and a file swap — this button never replaces the live file while the relay is running. '));
    compactRow.appendChild(compactStatus);
    right.appendChild(estimateEl);
    right.appendChild(compactRow);
    wireGiftwrapRetention(control, valueReadout, estimateEl, purgeBtn, purgeStatus, compactBtn, compactStatus);
  } else {
    right.appendChild(control);
  }
  if (field.warning) {
    right.appendChild(s86El('p', field.warning, 'note bad'));
  }
  if (field.help) {
    right.appendChild(s86El('p', field.help, 'note'));
  }
  row.appendChild(right);
  return row;
}

// Fields the operator usually edits stay in the open form; everything else
// folds into Advanced. relay.info is NIP-11 identity — always fully visible.
// bind/port are the next most-touched connection settings. The write-policy
// plugin path is deliberately advanced (and carries a red warning): it is
// what points the relay at plugin86.
function isRelayPrimaryField(field) {
  var section = field.section || '';
  if (section === 'relay.info' || section.indexOf('relay.info.') === 0) {
    return true;
  }
  return field.path === 'relay.bind' || field.path === 'relay.port';
}

function groupFieldsBySection(fieldList) {
  var groups = [];
  var byName = {};
  (fieldList || []).forEach(function (f) {
    if (!byName[f.section]) {
      byName[f.section] = { name: f.section, fields: [] };
      groups.push(byName[f.section]);
    }
    byName[f.section].fields.push(f);
  });
  return groups;
}

function appendFieldGroups(container, fieldList, onDirty, original, controls) {
  groupFieldsBySection(fieldList).forEach(function (group) {
    container.appendChild(s86El('h3', sectionTitle(group.name)));
    group.fields.forEach(function (f) {
      var row = buildFieldRow(f, onDirty);
      container.appendChild(row);
      var control = row.querySelector('[data-path]');
      original[f.path] = controlValue(control);
      controls.push(control);
    });
  });
}

// Live estimate + Purge now + Compact for the gift-wrap retention slider.
// Event count is an exact index --count; storage is proportional
// (delete/total × db size) — labelled as an estimate so it is never
// mistaken for free-space measurement. Compact is a separate job that
// only writes a dump; it does not free the live data.mdb.
function wireGiftwrapRetention(slider, daysEl, estimateEl, purgeBtn, purgeStatus, compactBtn, compactStatus) {
  var estimateTimer = null;
  var estimateSeq = 0;

  function setDaysLabel() {
    daysEl.textContent = slider.value + ' days';
  }

  function formatEstimate(est) {
    if (!est || est.delete_events == null) {
      return 'could not estimate';
    }
    var n = est.delete_events.toLocaleString();
    var pct = est.event_share != null
      ? ((est.event_share * 100).toFixed(est.event_share < 0.01 ? 2 : 1) + '% of all events')
      : null;
    var bytes = est.bytes_estimate != null ? s86FormatBytes(est.bytes_estimate) : null;
    var parts = ['~' + n + ' gift wraps'];
    if (pct) {
      parts.push(pct);
    }
    if (bytes) {
      parts.push('~' + bytes + ' freed (estimate)');
    }
    return parts.join(' · ');
  }

  function refreshEstimate() {
    var days = parseInt(slider.value, 10);
    var seq = ++estimateSeq;
    estimateEl.textContent = 'estimating…';
    s86SignAndPost('/api/giftwrap-retention/estimate', { days: days })
      .then(function (result) {
        if (seq !== estimateSeq) {
          return;
        }
        if (!result.ok) {
          estimateEl.textContent = 'estimate unavailable — ' + s86ErrMsg(result);
          return;
        }
        estimateEl.textContent = formatEstimate(result.body);
      })
      .catch(function () {
        if (seq !== estimateSeq) {
          return;
        }
        estimateEl.textContent = 'estimate unavailable';
      });
  }

  function scheduleEstimate() {
    setDaysLabel();
    if (estimateTimer) {
      clearTimeout(estimateTimer);
    }
    estimateTimer = setTimeout(refreshEstimate, 250);
  }

  function formatPurgeProgress(st) {
    if (!st) {
      return '';
    }
    // Blocked means NOT started — jobs are not queued, so this is a refusal,
    // not a place in a line. Say so, and keep polling (s86PollStatus keeps
    // going while blocked_by is set) so the moment the blocker clears the
    // button comes back and the operator can press it for real.
    if (st.blocked_by) {
      return 'not started — ' + st.blocked_by
        + ' is running. This button re-enables when it finishes.';
    }
    if (st.status === 'running') {
      var elapsed = st.started_at
        ? Math.max(0, Math.floor(Date.now() / 1000) - st.started_at)
        : 0;
      var elapsedTxt = elapsed < 60
        ? (elapsed + 's')
        : (Math.floor(elapsed / 60) + 'm ' + (elapsed % 60) + 's');
      if (st.phase === 'counting' || st.phase === 'starting') {
        return 'counting gift wraps to delete… ' + elapsedTxt;
      }
      if (st.phase === 'deleting') {
        var n = st.total != null ? st.total.toLocaleString() : '…';
        return 'deleting about ' + n + ' gift wraps… ' + elapsedTxt;
      }
      return 'purging… ' + elapsedTxt;
    }
    if (st.failed || st.phase === 'failed' || st.error) {
      // The poll endpoint is public and withholds the failure text, since it
      // is strfry's stderr and names paths on this machine. An admin still
      // gets it: POST /api/settings carries the detailed copy, and this page
      // has already authenticated to load it. Matched on finished_at so a
      // fresh failure never renders a previous run's reason.
      var detail = (payload && payload.purge) || null;
      var text = st.error
        || (detail && detail.finished_at === st.finished_at ? detail.error : null);
      return 'failed — ' + (text || 'purge failed; reload to load the reason');
    }
    if (st.phase === 'done') {
      // strfry's delete returns no count, so the only number here is the one
      // counted just BEFORE it ran, against a cutoff seconds earlier than the
      // one the delete used. Reported as the estimate it is — never as
      // "deleted N", which would be a measured figure this project does not
      // have.
      var took = (st.started_at && st.finished_at)
        ? (st.finished_at - st.started_at)
        : null;
      var line = 'purged gift wraps older than ' + (st.days || '?') + ' days'
        + (took != null ? (' in ' + took + 's') : '');
      if (st.counted != null) {
        line += ' — about ' + st.counted.toLocaleString()
          + ' events, counted just before the delete ran';
      }
      return line;
    }
    return '';
  }

  function setRetentionBusy(busy) {
    // Purge and compact share the global job lock with every other scan —
    // either button disabled while either job (or any other) is running.
    purgeBtn.disabled = !!busy || !isAdmin;
    if (compactBtn) {
      compactBtn.disabled = !!busy || !isAdmin;
    }
  }

  function applyPurgeStatus(st) {
    purgeStatus.textContent = formatPurgeProgress(st);
    var busy = st && (st.status === 'running' || st.blocked_by);
    setRetentionBusy(busy);
    if (st && st.status !== 'running' && !st.blocked_by && st.phase === 'done') {
      refreshEstimate();
    }
  }

  // Append " · " separators between status parts. The size figure is a
  // DOM node (bold ink); everything else is plain muted text from the
  // parent .note.
  function appendCompactParts(el, parts) {
    parts.forEach(function (part, i) {
      if (i > 0) {
        el.appendChild(document.createTextNode(' · '));
      }
      if (part && part.nodeType) {
        el.appendChild(part);
      } else {
        el.appendChild(document.createTextNode(part == null ? '' : String(part)));
      }
    });
  }

  function renderCompactProgress(st, el) {
    el.textContent = '';
    if (!st) {
      return;
    }
    if (st.blocked_by) {
      var label = (typeof S86_JOB_LABELS !== 'undefined' && S86_JOB_LABELS[st.blocked_by])
        ? S86_JOB_LABELS[st.blocked_by]
        : st.blocked_by;
      el.textContent = 'not started — ' + label
        + ' is running. This button re-enables when it finishes.';
      return;
    }
    if (st.status === 'running') {
      // strfry compact has no built-in progress. We measure the growing
      // output file; total is the live data.mdb size (a ceiling — the copy
      // is usually smaller). The size figure is the one mid-run number that
      // matters, so it steps out of the muted note into full ink + bold.
      var elapsed = st.started_at
        ? Math.max(0, Math.floor(Date.now() / 1000) - st.started_at)
        : 0;
      var elapsedTxt = typeof s86FormatDuration === 'function'
        ? s86FormatDuration(elapsed)
        : (elapsed + 's');
      var written = st.progress != null ? st.progress : 0;
      var parts = ['compacting…'];
      if (st.total != null && st.total > 0) {
        var pct = Math.min(99, Math.floor(written / st.total * 100));
        var fig = s86El('span',
          s86FormatBytes(written) + ' of ~' + s86FormatBytes(st.total)
            + ' live (' + pct + '%)',
          'figure');
        parts.push(fig);
      } else if (written > 0) {
        parts.push(s86El('span', s86FormatBytes(written) + ' written', 'figure'));
      } else if (st.live_bytes != null) {
        parts.push(s86El('span', 'source ' + s86FormatBytes(st.live_bytes), 'figure'));
      }
      parts.push(elapsedTxt + ' elapsed');
      if (st.rate) {
        // rate is bytes/sec from the server's smoothing window.
        var mibs = st.rate / (1024 * 1024);
        var rateTxt = mibs >= 1
          ? (mibs.toFixed(mibs >= 10 ? 0 : 1) + ' MiB/s')
          : (Math.max(1, Math.round(st.rate / 1024)) + ' KiB/s');
        if (st.eta != null) {
          parts.push(s86FormatEta(st.eta) + ' at ' + rateTxt
            + ' (upper bound — copy is usually smaller than live)');
        } else {
          parts.push(rateTxt + ' — estimating time left…');
        }
      } else {
        parts.push('estimating…');
      }
      appendCompactParts(el, parts);
      return;
    }
    if (st.failed || st.phase === 'failed' || st.error) {
      var detail = (payload && payload.compact) || null;
      var text = st.error
        || (detail && detail.finished_at === st.finished_at ? detail.error : null);
      el.textContent = 'failed — ' + (text || 'compact failed; reload to load the reason');
      return;
    }
    if (st.phase === 'done') {
      var took = (st.started_at && st.finished_at)
        ? (st.finished_at - st.started_at)
        : null;
      var doneParts = ['compacted copy written'
        + (took != null
          ? (' in ' + (typeof s86FormatDuration === 'function'
            ? s86FormatDuration(took) : (took + 's')))
          : '')];
      if (st.live_bytes != null && st.compacted_bytes != null) {
        doneParts.push(s86El('span',
          'live ' + s86FormatBytes(st.live_bytes)
            + ' → copy ' + s86FormatBytes(st.compacted_bytes),
          'figure'));
      }
      if (st.reclaimable_bytes != null && st.reclaimable_bytes > 0) {
        doneParts.push('~' + s86FormatBytes(st.reclaimable_bytes)
          + ' reclaimable after stop + swap of data.mdb');
      } else {
        doneParts.push('stop the relay and replace data.mdb with the compacted copy to free space');
      }
      appendCompactParts(el, doneParts);
    }
  }

  function applyCompactStatus(st) {
    if (!compactStatus) {
      return;
    }
    renderCompactProgress(st, compactStatus);
    var busy = st && (st.status === 'running' || st.blocked_by);
    setRetentionBusy(busy);
  }

  function pollPurge() {
    s86PollStatus(
      function () {
        return fetch('/api/giftwrap-retention/purge').then(function (res) {
          return res.json();
        });
      },
      applyPurgeStatus
    );
  }

  function pollCompact() {
    s86PollStatus(
      function () {
        return fetch('/api/db-compact').then(function (res) {
          return res.json();
        });
      },
      applyCompactStatus
    );
  }

  // Resume a purge or compact still running from a previous visit.
  fetch('/api/giftwrap-retention/purge')
    .then(function (res) { return res.json(); })
    .then(function (st) {
      applyPurgeStatus(st);
      if (st.status === 'running' || st.blocked_by) {
        pollPurge();
      }
    })
    .catch(function () {});

  fetch('/api/db-compact')
    .then(function (res) { return res.json(); })
    .then(function (st) {
      applyCompactStatus(st);
      if (st.status === 'running' || st.blocked_by) {
        pollCompact();
      }
    })
    .catch(function () {});

  slider.addEventListener('input', scheduleEstimate);
  setDaysLabel();
  refreshEstimate();

  purgeBtn.addEventListener('click', function () {
    if (!isAdmin) {
      return;
    }
    var days = parseInt(slider.value, 10);
    if (!window.confirm(
      'Delete all gift wraps older than ' + days + ' days now?\n'
      + 'This runs immediately and cannot be undone from this UI.'
    )) {
      return;
    }
    purgeBtn.disabled = true;
    if (compactBtn) {
      compactBtn.disabled = true;
    }
    purgeStatus.textContent = 'starting…';
    s86SignAndPost('/api/giftwrap-retention/purge', { days: days })
      .then(function (result) {
        // 202 running and 200 idle both carry the job status body; res.ok
        // is true for both (2xx).
        var st = result.body || {};
        if (!result.ok) {
          setRetentionBusy(false);
          purgeStatus.textContent = 'failed — ' + s86ErrMsg(result);
          return;
        }
        applyPurgeStatus(st);
        if (st.status === 'running' || st.blocked_by) {
          pollPurge();
        }
      })
      .catch(function () {
        setRetentionBusy(false);
        purgeStatus.textContent = 'failed — request error';
      });
  });

  if (compactBtn) {
    compactBtn.addEventListener('click', function () {
      if (!isAdmin) {
        return;
      }
      if (!window.confirm(
        'Write a compacted copy of the database?\n\n'
        + 'This does NOT shrink the live database by itself. It creates '
        + 'data.mdb.compacted next to the live file. Freeing disk space '
        + 'means stopping the relay, replacing data.mdb with that copy, '
        + 'and starting again. Needs free disk roughly the size of the copy.'
      )) {
        return;
      }
      setRetentionBusy(true);
      compactStatus.textContent = 'starting…';
      s86SignAndPost('/api/db-compact', {})
        .then(function (result) {
          var st = result.body || {};
          if (!result.ok) {
            setRetentionBusy(false);
            compactStatus.textContent = 'failed — ' + s86ErrMsg(result);
            return;
          }
          applyCompactStatus(st);
          if (st.status === 'running' || st.blocked_by) {
            pollCompact();
          }
        })
        .catch(function () {
          setRetentionBusy(false);
          compactStatus.textContent = 'failed — request error';
        });
    });
  }
}

function controlValue(control) {
  return control.type === 'checkbox' ? String(control.checked) : control.value;
}

function buildSection(container, target, title, data) {
  container.textContent = '';

  var head = s86El('div', null, 'page-head');
  head.appendChild(s86El('h2', title));
  var modeBtn = s86El('button', 'Edit raw');
  modeBtn.type = 'button';
  head.appendChild(modeBtn);
  container.appendChild(head);

  // Path only in the happy path. Narrate source only when something is
  // wrong or ambiguous (not found, path mismatch, not writable).
  if (data.path) {
    container.appendChild(s86El('p', data.path, 'mono muted'));
  } else if (data.candidates && data.candidates.length) {
    var miss = s86El('p', 'not found — tried ', 'muted');
    miss.appendChild(s86El('span', data.candidates.join(', '), 'mono'));
    container.appendChild(miss);
  }
  if (data.warning) {
    container.appendChild(s86El('p', data.warning));
  }
  if (data.writable === false && data.path && !data.error) {
    container.appendChild(s86El('p', 'readable, not writable'));
  }

  if (data.error) {
    container.appendChild(s86El('p', data.error));
    if (target === 'relay') {
      container.appendChild(s86El('p',
        'Set strfry.conf path under Admin console, then reload.', 'muted'));
    }
    return;
  }

  var structured = s86El('div', null, 'structured');
  var rawWrap = s86El('div', null, 'raw');
  rawWrap.style.display = 'none';
  var statusLine = s86El('p', '', 'muted');
  var saveBtn = s86El('button', 'Save');
  saveBtn.type = 'button';
  saveBtn.disabled = true;

  var original = {};
  var controls = [];

  function markDirty() {
    var dirty = controls.some(function (c) {
      return controlValue(c) !== original[c.getAttribute('data-path')];
    });
    saveBtn.disabled = !dirty && rawWrap.style.display === 'none';
    statusLine.textContent = dirty ? 'unsaved changes' : '';
  }

  // Relay: primary fields (info + bind/port) open; everything else —
  // including writePolicy.plugin — under a closed <details>. App config is
  // short enough that every field stays open. Within each list, section
  // order still follows the file, not an invented order.
  var allFields = data.fields || [];
  var primaryFields = allFields;
  var advancedFields = [];
  if (target === 'relay') {
    primaryFields = allFields.filter(isRelayPrimaryField);
    advancedFields = allFields.filter(function (f) { return !isRelayPrimaryField(f); });
  }

  if (allFields.length === 0) {
    structured.appendChild(s86El('p', 'no scalar settings were recognised in this file — use the raw editor.'));
  } else {
    appendFieldGroups(structured, primaryFields, markDirty, original, controls);
    if (advancedFields.length > 0) {
      var details = document.createElement('details');
      var summary = document.createElement('summary');
      summary.textContent = 'Advanced settings (' + advancedFields.length + ')';
      details.appendChild(summary);
      details.appendChild(s86El('p',
        'Rarely changed knobs — database paths, limits, threading, logging, '
        + 'and the write-policy plugin path. Expand only when you mean to.',
        'muted'));
      appendFieldGroups(details, advancedFields, markDirty, original, controls);
      structured.appendChild(details);
    }
  }
  container.appendChild(structured);

  var textarea = document.createElement('textarea');
  textarea.rows = 22;
  textarea.value = data.raw || '';
  textarea.spellcheck = false;
  textarea.setAttribute('aria-label', 'raw contents of ' + (data.path || title));
  textarea.addEventListener('input', function () {
    saveBtn.disabled = textarea.value === (data.raw || '');
    statusLine.textContent = saveBtn.disabled ? '' : 'unsaved changes';
  });
  rawWrap.appendChild(textarea);
  container.appendChild(rawWrap);

  var actions = s86El('div', null, 'toolbar');
  actions.appendChild(saveBtn);
  actions.appendChild(statusLine);
  container.appendChild(actions);

  modeBtn.addEventListener('click', function () {
    var showingRaw = rawWrap.style.display !== 'none';
    rawWrap.style.display = showingRaw ? 'none' : '';
    structured.style.display = showingRaw ? '' : 'none';
    modeBtn.textContent = showingRaw ? 'Edit raw' : 'Back to structured view';
    markDirty();
  });

  saveBtn.addEventListener('click', function () {
    if (!isAdmin) {
      return;
    }
    var usingRaw = rawWrap.style.display !== 'none';
    var body = { target: target };
    if (usingRaw) {
      body.raw = textarea.value;
    } else {
      var edits = {};
      controls.forEach(function (c) {
        var path = c.getAttribute('data-path');
        if (controlValue(c) !== original[path]) {
          edits[path] = controlValue(c);
        }
      });
      if (Object.keys(edits).length === 0) {
        statusLine.textContent = 'nothing changed';
        return;
      }
      body.edits = edits;
    }
    saveBtn.disabled = true;
    statusLine.textContent = 'saving…';
    s86SignAndPost('/api/settings/save', body)
      .then(function (result) {
        if (!result.ok) {
          statusLine.textContent = 'not saved — ' + s86ErrMsg(result);
          saveBtn.disabled = false;
          return;
        }
        var changed = result.body.changed || [];
        statusLine.textContent = changed.length
          ? ('saved ' + changed.length + ' change' + (changed.length === 1 ? '' : 's'))
          : (result.body.note || 'no field differed');
        return loadSettings();
      })
      .catch(function () {
        statusLine.textContent = 'not saved — request failed';
        saveBtn.disabled = false;
      });
  });
}

// NIP-16 ephemeral kinds (20000–29999): written so live subscriptions can
// receive them, then RelayCron deletes after ephemeralEventsLifetimeSeconds.
// They do touch disk. This panel counts leftovers and offers a one-shot
// purge when lifetime was high or cron lagged.
function buildEphemeralSection(container) {
  container.textContent = '';
  container.appendChild(s86El('h2', 'Ephemeral kinds (NIP-16)'));
  container.appendChild(s86El('p',
    'Kinds 20000–29999 are accepted by the write policy so open clients get '
    + 'live fan-out. strfry writes them to LMDB with expiration=1; RelayCron '
    + 'deletes them after events.ephemeralEventsLifetimeSeconds (default 300s). '
    + 'They do touch disk — briefly when healthy, longer if that lifetime is '
    + 'raised or cron falls behind. This purge deletes every event still in '
    + 'that kind range. Lifetime itself is under Relay → Advanced → events.',
    'muted'));

  var estimateEl = s86El('p', 'estimating…', 'note');
  var toolbar = s86El('div', null, 'toolbar');
  var purgeBtn = s86El('button', 'Purge ephemeral kinds');
  purgeBtn.type = 'button';
  var refreshBtn = s86El('button', 'Refresh estimate');
  refreshBtn.type = 'button';
  var purgeStatus = s86El('span', '', 'muted');
  toolbar.appendChild(purgeBtn);
  toolbar.appendChild(refreshBtn);
  toolbar.appendChild(purgeStatus);
  container.appendChild(estimateEl);
  container.appendChild(toolbar);

  function formatEstimate(est) {
    if (!est || est.ephemeral_events == null) {
      return 'could not estimate';
    }
    var n = est.ephemeral_events.toLocaleString();
    var pct = est.event_share != null
      ? ((est.event_share * 100).toFixed(est.event_share < 0.01 ? 2 : 1) + '% of all events')
      : null;
    var bytes = est.bytes_estimate != null ? s86FormatBytes(est.bytes_estimate) : null;
    var parts = [n + ' ephemeral events on disk'];
    if (pct) {
      parts.push(pct);
    }
    if (bytes) {
      parts.push('~' + bytes + ' (estimate)');
    }
    return parts.join(' · ');
  }

  function refreshEstimate() {
    estimateEl.textContent = 'estimating…';
    s86SignAndPost('/api/ephemeral/estimate', {})
      .then(function (result) {
        if (!result.ok) {
          estimateEl.textContent = 'estimate unavailable — ' + s86ErrMsg(result);
          return;
        }
        estimateEl.textContent = formatEstimate(result.body);
      })
      .catch(function () {
        estimateEl.textContent = 'estimate unavailable';
      });
  }

  function formatPurgeProgress(st) {
    if (!st) {
      return '';
    }
    if (st.blocked_by) {
      return 'not started — ' + (S86_JOB_LABELS[st.blocked_by] || st.blocked_by)
        + ' is running. This button re-enables when it finishes.';
    }
    if (st.status === 'running') {
      var elapsed = st.started_at
        ? Math.max(0, Math.floor(Date.now() / 1000) - st.started_at)
        : 0;
      var elapsedTxt = elapsed < 60
        ? (elapsed + 's')
        : (Math.floor(elapsed / 60) + 'm ' + (elapsed % 60) + 's');
      if (st.phase === 'counting' || st.phase === 'starting') {
        return 'counting ephemeral events… ' + elapsedTxt;
      }
      if (st.phase === 'deleting') {
        var total = st.total != null ? st.total.toLocaleString() : '?';
        return 'deleting ~' + total + ' ephemeral events… ' + elapsedTxt;
      }
      return 'running… ' + elapsedTxt;
    }
    if (st.failed) {
      var detail = (payload && payload.ephemeral_purge) || null;
      var text = (detail && detail.error) || st.error || '';
      return 'failed — ' + (text || 'purge failed; reload to load the reason');
    }
    if (st.phase === 'done' && st.counted != null) {
      return 'purged ~' + Number(st.counted).toLocaleString()
        + ' ephemeral events (kinds 20000–29999)';
    }
    return '';
  }

  function applyPurgeStatus(st) {
    var busy = !!(st && (st.status === 'running' || st.blocked_by));
    purgeBtn.disabled = busy || !isAdmin;
    refreshBtn.disabled = busy || !isAdmin;
    purgeStatus.textContent = formatPurgeProgress(st);
  }

  function pollPurge() {
    s86PollStatus(
      function () {
        return fetch('/api/ephemeral/purge').then(function (res) {
          return res.json();
        });
      },
      function (st) {
        applyPurgeStatus(st);
        if (st && st.phase === 'done') {
          refreshEstimate();
        }
      }
    );
  }

  var prior = (payload && payload.ephemeral_purge) || null;
  if (prior) {
    applyPurgeStatus(prior);
    if (prior.status === 'running' || prior.blocked_by) {
      pollPurge();
    }
  }

  refreshEstimate();

  refreshBtn.addEventListener('click', function () {
    if (isAdmin) {
      refreshEstimate();
    }
  });

  purgeBtn.addEventListener('click', function () {
    if (!isAdmin) {
      return;
    }
    if (!window.confirm(
      'Delete every event of kind 20000–29999 now?\n\n'
      + 'These are NIP-16 ephemeral events (typing indicators, presence, etc.). '
      + 'strfry is supposed to drop them after ephemeralEventsLifetimeSeconds; '
      + 'this purge removes anything still on disk. Cannot be undone from this UI.'
    )) {
      return;
    }
    purgeBtn.disabled = true;
    purgeStatus.textContent = 'starting…';
    s86SignAndPost('/api/ephemeral/purge', {})
      .then(function (result) {
        var st = result.body || {};
        if (!result.ok) {
          purgeBtn.disabled = false;
          purgeStatus.textContent = 'failed — ' + s86ErrMsg(result);
          return;
        }
        applyPurgeStatus(st);
        if (st.status === 'running' || st.blocked_by) {
          pollPurge();
        } else if (st.phase === 'done') {
          refreshEstimate();
        }
      })
      .catch(function () {
        purgeBtn.disabled = false;
        purgeStatus.textContent = 'failed — request error';
      });
  });
}

function render() {
  buildSection(document.getElementById('relay-section'), 'relay', 'Relay', payload.relay);
  buildSection(document.getElementById('app-section'), 'app', 'Admin console', payload.app);
  buildEphemeralSection(document.getElementById('ephemeral-section'));
}

function loadSettings() {
  return s86SignAndPost('/api/settings', {})
    .then(function (result) {
      if (!result.ok) {
        setStatus('could not load settings: ' + s86ErrMsg(result));
        return;
      }
      payload = result.body;
      render();
    })
    .catch(function () {
      setStatus('could not load settings');
    });
}

function onLogin() {
  isAdmin = true;
  adminSection.style.display = '';
  setStatus('');
  loadSettings();
}

s86WireLogin(loginBtn, statusEl, function () { return adminPubkey; }, onLogin);

fetch('/api/banned')
  .then(function (res) { return res.json(); })
  .then(function (data) {
    adminPubkey = data.admin;
    s86TryAutoLogin(adminPubkey, loginBtn, statusEl, onLogin);
  })
  .catch(function () {});
</script>
</body>
</html>
