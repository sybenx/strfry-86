<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico">
<script>try{var s86t=localStorage.getItem('strfry86_theme');if(s86t==='light'||s86t==='dark'){document.documentElement.style.colorScheme=s86t;}}catch(e){}</script>
<title>strfry-86 — stats</title>
<style>
/* strfry-86 style block — canonical source. tools/stamp_style.py copies this
   file verbatim into every page's <style>, so "identical character-for-character
   on every page" is enforced by a command, not by discipline. Edit here only.

   Colours resolve through light-dark(), which reads the SAME color-scheme value
   the theme button and the anti-flash <script> already set on <html> — the
   toggle mechanism of WHY.md §3 is unchanged, only its palette is now ours.
   Where light-dark() is unsupported the @supports block below hands every token
   back to a system colour, i.e. back to the browser-default rendering this
   project shipped before the paint. */
:root {
  color-scheme: light dark;
  --paper:   light-dark(oklch(.985 .004 60),        oklch(.155 .005 60));
  --surface: light-dark(oklch(1 0 0),               oklch(.205 .005 60));
  --ink:     light-dark(oklch(.18 .005 60),         oklch(.93 .004 60));
  --muted:   light-dark(oklch(.18 .005 60 / .55),   oklch(.93 .004 60 / .55));
  --rule:    light-dark(oklch(.18 .005 60 / .15),   oklch(.93 .004 60 / .18));
  --hair:    light-dark(oklch(.18 .005 60 / .08),   oklch(.93 .004 60 / .1));
  --wash:    light-dark(oklch(.18 .005 60 / .06),   oklch(.93 .004 60 / .08));
  --accent:  light-dark(oklch(.45 .18 25),          oklch(.72 .16 25));
  --good:    light-dark(oklch(.5 .12 145),          oklch(.75 .14 145));
  --term-bg: oklch(.14 .005 60);
  --term-fg: oklch(.9 .01 145);
  --term-edge: oklch(.3 .01 60);
  --serif: Georgia, "PT Serif", "Iowan Old Style", "Times New Roman", serif;
  --sans: "Helvetica Neue", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, "IBM Plex Mono", monospace;
}
@supports not (color: light-dark(#000, #fff)) {
  :root { --paper:Canvas; --surface:Canvas; --ink:CanvasText; --muted:GrayText;
          --rule:GrayText; --hair:GrayText; --wash:transparent;
          --accent:LinkText; --good:CanvasText; }
}
* { box-sizing:border-box; }
body { max-width:68em; margin:0 auto; padding:0 1.5em 4em; font-size:.94rem;
       line-height:1.55; font-family:var(--sans);
       background:var(--paper); color:var(--ink); }           /* WHY.md §3 */
h1, h2 { font-family:var(--serif); font-weight:700; letter-spacing:-.01em; margin:0 0 .4rem; }
h1 { font-size:1.7rem; }
h2 { font-size:1.2rem; margin-top:2.2rem; }
h3 { font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.1em;
     color:var(--muted); margin:1.6rem 0 .5rem; }
p { margin:.5rem 0; }
a { color:var(--accent); text-underline-offset:2px; }
li { overflow-wrap:anywhere; }
code { font-family:var(--mono); font-size:.85em; }
.mono { font-family:var(--mono); font-size:.9em; }
.nowrap { white-space:nowrap; }      /* already-truncated ids — never wrapped mid-key */
.muted, #status, #feed-age, #provenance-line, #truncated-line { color:var(--muted); }
.page-head { display:flex; align-items:baseline; justify-content:space-between;
             gap:1em; flex-wrap:wrap; }
.badge { font-family:var(--mono); font-size:.72rem; padding:.15em .5em; white-space:nowrap;
         background:var(--wash); border:1px solid var(--rule); border-radius:6px; }
.pill { display:inline-flex; align-items:center; gap:.45em; font-family:var(--mono);
        font-size:.7rem; letter-spacing:.08em; padding:.35em .75em;
        border:1px solid currentColor; border-radius:8px; color:var(--muted); }
.pill.live { color:var(--good); }
.pill .dot { width:.45em; height:.45em; border-radius:50%; background:currentColor; }
table { width:100%; border-collapse:collapse; margin:.8rem 0 1.4rem; font-size:.92em; }
th, td { text-align:left; padding:.6em .7em; border-bottom:1px solid var(--hair);
         font-variant-numeric:tabular-nums; }
tbody th { font-weight:600; }        /* row label, not a column header */
thead th { font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em;
           line-height:1.25; color:var(--muted); border-top:2px solid var(--ink);
           border-bottom:1px solid var(--rule); }
td[colspan] { color:var(--muted); }  /* the "+ N more …" tail summary row */
tbody tr:hover { background:var(--wash); }
button { font-family:var(--sans); font-size:.82rem; font-weight:600; padding:.5em 1em;
         color:var(--ink); background:transparent; border:1px solid var(--ink);
         border-radius:8px; cursor:pointer; }
button:hover:not(:disabled) { background:var(--ink); color:var(--paper); }
button:disabled { opacity:.4; cursor:not-allowed; }
input, select, textarea { font-family:var(--mono); font-size:.82rem; padding:.5em .7em;
         color:var(--ink); background:var(--surface); border:1px solid var(--rule);
         border-radius:8px; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
details { background:var(--surface); border:1px solid var(--rule); border-radius:10px;
          padding:.6em .9em; margin:1rem 0; }
summary { cursor:pointer; font-size:.85rem; font-weight:600; }
hr { border:none; border-top:3px double var(--rule); margin:2.4rem 0; }
pre { white-space:pre-wrap; overflow-wrap:anywhere;                /* commands only — WHY.md §2 */
      font-family:var(--mono); font-size:.8rem; line-height:1.65; padding:1em 1.1em;
      background:var(--term-bg); color:var(--term-fg);
      border:1px solid var(--term-edge); border-radius:14px; }
pre#console-log { min-height:6em; max-height:26em; overflow:auto; }
pre#console-log:empty::before { content:"strfry console — read-only verbs only";
                                color:oklch(.6 .01 60); }
.console-row { display:flex; align-items:center; gap:.5em; margin:.6rem 0; }
.console-row .prompt { font-family:var(--mono); color:var(--good); }
.console-row input { flex:1; }
#records-container p { padding-bottom:.6em; border-bottom:1px solid var(--hair); }
header#s86 { position:sticky; top:0; z-index:5; margin-bottom:1.4rem;
             background:var(--paper); border-bottom:3px double var(--rule); }
header#s86 .brand { display:flex; align-items:baseline; gap:.8em; padding:.9rem 0 .6rem; }
header#s86 a.logo { font-family:var(--serif); font-weight:bold; font-size:1.5rem;
                    letter-spacing:-.02em; white-space:nowrap;
                    text-decoration:none; color:inherit; }
header#s86 .tagline { font-size:.65rem; font-weight:600; letter-spacing:.14em;
                      text-transform:uppercase; color:var(--muted); }
header#s86 .spacer { flex:1; }
header#s86 .bar { display:flex; align-items:center; gap:.5em; flex-wrap:wrap;
                  border-top:1px solid var(--rule); }
header#s86 nav { display:flex; flex-wrap:wrap; }
header#s86 nav a { padding:.7em .75em; font-size:.82rem; font-weight:600;
                   color:var(--muted); text-decoration:none;
                   border-bottom:2px solid transparent; }
header#s86 nav a:hover { color:var(--ink); }
header#s86 nav a[aria-current="page"] { color:var(--ink); border-bottom-color:var(--accent); }
header#s86 input#q { flex:1; min-width:8em; max-width:24em; margin-left:auto; }
header#s86 button#theme-btn { border-color:var(--rule); padding:.45em .7em; }
@media (max-width:600px) {
  body { font-size:1rem; padding:0 1em 3em; }
  /* Nothing may push the page wider than the screen (rendering rule 5), so
     at phone widths every cell breaks an unbreakable key — an npub, a hex id,
     a nip-05 address — rather than let the table overflow. */
  th, td { padding:.5em .35em; overflow-wrap:anywhere; }
  .nowrap { white-space:normal; }
  header#s86 .tagline { display:none; }
  header#s86 input#q { max-width:none; margin:0 0 .5em; }
}
</style>
</head>
<body>
<div class="page-head">
  <h1>Stats</h1>
  <span id="live-pill"></span>
</div>
<p id="status"></p>
<p id="baseline-line"></p>
<div id="totals-container"></div>
<div id="kinds-container"></div>
<div id="gap-container"></div>
<div id="console-section" style="display:none">
  <h2>Console</h2>
  <p>Read-only verbs only: <code>scan</code>, <code>info</code>, <code>export</code>. Everything else is refused.</p>
  <pre id="console-log"></pre>
  <div class="console-row">
    <span class="prompt" aria-hidden="true">❯</span>
    <input id="console-input" type="text" placeholder="scan --count {}"
           aria-label="strfry console command">
    <button id="console-run" type="button">Run</button>
  </div>
</div>
<script src="/common86.js"></script>
<script>
var KNOWN_KINDS = {
  0: 'profile', 1: 'note', 5: 'deletion', 6: 'repost', 7: 'reaction',
  1059: 'gift wrap', 1984: 'report', 9735: 'zap receipt',
  10002: 'relay list', 10050: 'DM relay list', 30023: 'long-form'
};
var adminPubkey = null;
var isAdmin = false;
var lastTotals = null;
var lastWalk = null;
var lastBaselineAt = null;

var statusEl = document.getElementById('status');
var livePill = document.getElementById('live-pill');
var chrome = s86BuildPageChrome(statusEl);
var loginBtn = chrome.loginBtn;
var baselineLine = document.getElementById('baseline-line');
var totalsContainer = document.getElementById('totals-container');
var kindsContainer = document.getElementById('kinds-container');
var gapContainer = document.getElementById('gap-container');
var consoleSection = document.getElementById('console-section');
var consoleLog = document.getElementById('console-log');
var consoleInput = document.getElementById('console-input');
var consoleRun = document.getElementById('console-run');

function setStatus(text) { statusEl.textContent = text; }

function setLivePill(label, isLive) {
  livePill.textContent = '';
  livePill.appendChild(s86BuildPill(label, isLive));
}

setLivePill('CONNECTING', false);

function kindLabel(kind) {
  return KNOWN_KINDS[kind] ? (kind + ' ' + KNOWN_KINDS[kind]) : String(kind);
}

// Baseline + delta model (CLAUDE.md "/stats"): figures are the last
// walk/totals cache PLUS the live layer's running delta since that cache's
// own scanned_at. Kind-5 deletes are shown alongside new events, never
// netted into one number — strfry-internal NIP-40 expiry does NOT appear
// here at all; only the next walk corrects for it.
function renderBaselineLine(live) {
  var totals = lastTotals;
  var baselineAt = (totals && totals.scanned_at != null) ? totals.scanned_at
    : (lastWalk && lastWalk.scanned_at != null ? lastWalk.scanned_at : null);
  if (baselineAt == null) {
    baselineLine.textContent = 'no walk/totals baseline yet — run a full database walk or refresh totals on Report to establish one.';
    return;
  }
  var line = 'baseline ' + s86FormatDate(baselineAt) + ' (' + s86FormatRelativeAge(baselineAt) + ')';
  if (live && live.baseline_at === baselineAt) {
    var sign = live.new_events >= 0 ? '+' : '';
    line += ' · ' + sign + live.new_events.toLocaleString() + ' events, -'
      + live.deletes.toLocaleString() + ' deletes since';
  }
  if (live && live.error) {
    setLivePill('STALLED', false);
    line += ' — live layer could not run: ' + live.error;
  } else if (live) {
    setLivePill('LIVE', true);
  }
  baselineLine.textContent = line;
}

function renderStats(data) {
  totalsContainer.textContent = '';
  kindsContainer.textContent = '';
  gapContainer.textContent = '';
  lastTotals = data.totals;
  lastWalk = data.walk;

  var totals = data.totals;
  if (totals && totals.scanned_at != null) {
    var nonGw = totals.total_events - totals.giftwrap_events;
    totalsContainer.appendChild(s86BuildKeyValueTable([
      ['all events', totals.total_events, ''],
      ['gift wraps', totals.giftwrap_events, (totals.giftwrap_share * 100).toFixed(1) + '% of all'],
      ['non-gift-wrap', nonGw, ''],
      ['— in allowlist', totals.allowlist_events, ((1 - totals.gap_share) * 100).toFixed(1) + '% of non-gift-wrap'],
      ['— not in allowlist', totals.gap_events, (totals.gap_share * 100).toFixed(1) + '% of non-gift-wrap']
    ]));
    if (totals.gap_level === 'stale') {
      gapContainer.appendChild(s86El('p', 'allowlist alarm: a single unlisted kind is large enough to act on — see Report.'));
    } else if (totals.gap_level === 'notice') {
      gapContainer.appendChild(s86El('p', 'allowlist covers '
        + ((1 - totals.gap_share) * 100).toFixed(1)
        + '% of non-gift-wrap; remaining share is long-tail shaped (see Report walk).'));
    } else if (totals.gap_level === 'ok') {
      gapContainer.appendChild(s86El('p', 'allowlist covers '
        + ((1 - totals.gap_share) * 100).toFixed(1) + '% of non-gift-wrap events.'));
    }
  }

  var walk = data.walk;
  if (walk && walk.kinds) {
    var kindRows = Object.keys(walk.kinds).map(function (k) {
      return [kindLabel(parseInt(k, 10)), walk.kinds[k]];
    }).sort(function (a, b) { return b[1] - a[1]; });
    if (kindRows.length) {
      kindsContainer.appendChild(s86El('h2', 'Kinds (walk baseline)'));
      kindsContainer.appendChild(s86BuildRankedFigureTable(kindRows, {
        unit: 'kinds',
        grandTotal: walk.events_read || null
      }));
    }
    if (walk.expired_events != null) {
      kindsContainer.appendChild(s86El('p', walk.expired_events.toLocaleString()
        + ' expired events on disk (NIP-40) — a size figure, not an alarm; purge only via the walk-driven forms.'));
    }
  }

  renderBaselineLine(null);
}

function loadStats() {
  return fetch('/api/stats')
    .then(function (res) { return res.json(); })
    .then(renderStats)
    .catch(function () { setStatus('failed to load stats'); });
}

function appendConsole(text) {
  consoleLog.textContent = (consoleLog.textContent ? consoleLog.textContent + '\n' : '') + text;
  consoleLog.scrollTop = consoleLog.scrollHeight;
}

function runConsole() {
  if (!isAdmin) {
    return;
  }
  var cmd = consoleInput.value.trim();
  if (!cmd) {
    return;
  }
  appendConsole('> ' + cmd);
  s86SignAndPost('/api/console', { command: cmd })
    .then(function (result) {
      var body = result.body || {};
      if (body.error && !body.ok) {
        appendConsole('refused/error: ' + body.error);
      }
      if (body.stdout) {
        appendConsole(body.stdout);
      }
      if (body.stderr) {
        appendConsole(body.stderr);
      }
      if (body.exit_code != null && body.ok) {
        appendConsole('(exit ' + body.exit_code + ')');
      }
    })
    .catch(function () {
      appendConsole('request failed');
    });
}

function onLogin() {
  isAdmin = true;
  consoleSection.style.display = '';
  setStatus('logged in as admin');
}

s86WireLogin(loginBtn, statusEl, function () { return adminPubkey; }, onLogin);
consoleRun.addEventListener('click', runConsole);
consoleInput.addEventListener('keydown', function (evt) {
  if (evt.key === 'Enter') {
    evt.preventDefault();
    runConsole();
  }
});

fetch('/api/banned')
  .then(function (res) { return res.json(); })
  .then(function (data) {
    adminPubkey = data.admin;
    s86TryAutoLogin(adminPubkey, loginBtn, statusEl, onLogin);
  })
  .catch(function () {});

loadStats();

// Live layer: the shared SSE connection drives the delta line continuously.
// If its baseline_at ever differs from what we last rendered (an admin
// pressed refresh totals / run walk, here or on another tab), that means
// the report cache moved — pull the new totals/walk record once rather
// than trying to reconstruct it from deltas.
s86ConnectLive(function (live) {
  if (live.baseline_at !== lastBaselineAt) {
    lastBaselineAt = live.baseline_at;
    loadStats().then(function () { renderBaselineLine(live); });
    return;
  }
  renderBaselineLine(live);
}, function () {
  setLivePill('RECONNECTING', false);
  setStatus('live layer disconnected — retrying');
});
</script>
</body>
</html>
