##
## strfry config for the throwaway test relay — dockurr/strfry's own
## default template, verbatim, EXCEPT writePolicy.plugin is blank.
##
## Why this file exists at all instead of letting the container write its
## own default: dockurr/strfry's shipped template pre-wires
## writePolicy.plugin to its own no-op "/app/write-policy.py". The real
## strfry-86-updater.py refuses to overwrite an already-non-empty plugin
## line (see edit_strfry_conf() in strfry-86-updater.py) — so installing
## against that image's default conf, completely unmodified, leaves
## plugin86.py never wired in and the updater only prints a WARNING, no
## error. Confirmed by actually running the installer against the
## untouched default. Blanking the line here is the one change needed for
## the updater's normal (empty-plugin) path to run, which is what actually
## exercises edit_strfry_conf()'s intended behavior.
##
## auth.enabled is also flipped to false: NIP-42 has no bearing on
## anything this test relay is used for, and turning it off keeps the
## seeder's raw websocket publish simple (no AUTH challenge round-trip).

db = "./strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
    noReadAhead = false
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 524288
    realIpHeader = ""

    auth {
        enabled = false
        serviceUrl = ""
    }

    info {
        name = "strfry-86 test relay"
        description = "Throwaway relay for strfry-86 measurement/delete testing. Not production."
        pubkey = ""
        self = ""
        contact = ""
        icon = ""
        banner = ""
        privacy = ""
        terms = ""
        nips = ""
    }

    maxWebsocketPayloadSize = 131072
    maxReqFilterSize = 200
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxTagsPerFilter = 3
    maxFilterLimitCount = 1000000
    maxSubsPerConnection = 200
    maxPendingOutboundBytes = 33554432

    writePolicy {
        plugin = ""
        timeoutSeconds = 10
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        negentropy = 2
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }

    filterValidation {
        enabled = false
        maxFiltersPerReq = 3
        minFiltersPerReq = 1
        maxKindsPerFilter = 3
        allowedKinds = ""
        requireAuthorOrTag = false
    }
}
