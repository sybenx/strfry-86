<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var s86t=localStorage.getItem('strfry86_theme');if(s86t==='light'||s86t==='dark'){document.documentElement.style.colorScheme=s86t;}}catch(e){}</script>
<title>strfry-86 — userlist</title>
<style>
body { max-width:40em; margin:0 auto; padding:0 1em; }
li { overflow-wrap:anywhere; }
pre { white-space:pre-wrap; overflow-wrap:anywhere; }   /* commands only — WHY.md §2 */
@media (max-width:600px){ body{ font-size:1.15em; } }
:root { color-scheme: light dark; }
body { background:Canvas; color:CanvasText; }           /* required — WHY.md §3 */
header#s86 { position:sticky; top:0; background:Canvas; display:flex;
             gap:1em; align-items:center; padding:.5em 0; }
header#s86 a.logo { text-decoration:none; color:inherit; font-weight:bold; }
header#s86 input#q { flex:1; min-width:8em; }
</style>
</head>
<body>
<h1>Userlist</h1>
<p id="status"></p>
<div id="admin-section" style="display:none">
  <p id="empty-state-line"></p>
  <p id="provenance-line"></p>
  <p><input id="filter-input" type="search" placeholder="filter — name, nip05, or npub" size="40"></p>
  <p id="truncated-line"></p>
  <div id="table-container"></div>
</div>
<script src="/common86.js"></script>
<script>
var RENDER_MAX_CLIENT = 500;
var adminPubkey = null;
var isAdmin = false;
var lastData = null;

var statusEl = document.getElementById('status');
var chrome = s86BuildPageChrome(statusEl);
var loginBtn = chrome.loginBtn;
var adminSection = document.getElementById('admin-section');
var emptyStateLine = document.getElementById('empty-state-line');
var provenanceLine = document.getElementById('provenance-line');
var filterInput = document.getElementById('filter-input');
var truncatedLine = document.getElementById('truncated-line');
var tableContainer = document.getElementById('table-container');

function setStatus(text) { statusEl.textContent = text; }

function dash(v) {
  return (v === null || v === undefined || v === '') ? '—' : v;
}

function shortNpub(npub) {
  if (!npub || npub.length < 20) {
    return npub || '—';
  }
  return npub.slice(0, 12) + '…' + npub.slice(-8);
}

function giftwrapLabel(count, saturated) {
  if (count === null || count === undefined) {
    return '—';
  }
  if (saturated) {
    return '≥ ' + Number(count).toLocaleString();
  }
  return Number(count).toLocaleString();
}

function emptyStateText(data) {
  var modes = (data && data.authors_modes) || {};
  var recent = modes.recent || {};
  var recentDuration = recent.typical_seconds
    ? ('about ' + s86FormatDuration(recent.typical_seconds))
    : 'a few seconds once measured';
  return 'no author scan yet. Open Authors and run a recent scan (' + recentDuration
    + ') to fill this list. Gift-wrap columns fill from the recipients scan on Report.';
}

function renderTable(data) {
  lastData = data;
  tableContainer.textContent = '';
  truncatedLine.textContent = '';

  if (!data.authors_scanned_at) {
    emptyStateLine.textContent = data.authors_error
      ? ('could not run — ' + data.authors_error)
      : emptyStateText(data);
  } else {
    emptyStateLine.textContent = '';
  }

  var parts = [];
  if (data.authors_scanned_at) {
    parts.push('authors scanned ' + s86FormatDate(data.authors_scanned_at)
      + ' (' + s86FormatRelativeAge(data.authors_scanned_at) + ')');
  }
  if (data.recipients_scanned_at) {
    parts.push('recipients scanned ' + s86FormatRelativeAge(data.recipients_scanned_at)
      + (data.recipients_saturated ? ' — SATURATED (gift-wrap counts are floors)' : ''));
  } else {
    parts.push('recipients never run — gift-wrap column is —');
  }
  if (data.reports_scanned_at) {
    parts.push('reports scanned ' + s86FormatRelativeAge(data.reports_scanned_at));
  } else {
    parts.push('reports never run — reports column is —');
  }
  provenanceLine.textContent = parts.join('. ');

  var rows = data.rows || [];
  var query = filterInput.value.trim().toLowerCase();
  var filtered = rows.filter(function (r) {
    if (!query) {
      return true;
    }
    var blob = [r.name, r.nip05, r.npub, r.pubkey].join(' ').toLowerCase();
    return blob.indexOf(query) !== -1;
  });
  var truncation = s86TruncateForRender(filtered, RENDER_MAX_CLIENT);
  var shown = truncation.shown;

  if (shown.length === 0) {
    tableContainer.appendChild(s86El('p', rows.length === 0 ? 'no members yet' : 'no matches'));
    return;
  }

  var table = document.createElement('table');
  var thead = document.createElement('thead');
  var hr = document.createElement('tr');
  var giftwrapHeader = data.recipients_saturated ? 'gift wraps (floor — scan capped)' : 'gift wraps';
  ['name', 'nip-05', 'npub', 'events', giftwrapHeader, 'reports'].forEach(function (h) {
    hr.appendChild(s86El('th', h));
  });
  thead.appendChild(hr);
  table.appendChild(thead);
  var tbody = document.createElement('tbody');
  shown.forEach(function (r) {
    var tr = document.createElement('tr');
    tr.appendChild(s86El('td', dash(r.name)));
    tr.appendChild(s86El('td', dash(r.nip05)));
    var npubTd = document.createElement('td');
    if (r.npub && r.pubkey) {
      var a = s86NpubLink(r.npub, r.pubkey, true);
      a.textContent = shortNpub(r.npub);
      a.title = r.npub;
      npubTd.appendChild(a);
    } else {
      npubTd.textContent = '—';
    }
    tr.appendChild(npubTd);
    tr.appendChild(s86El('td', r.event_count != null ? Number(r.event_count).toLocaleString() : '—'));
    tr.appendChild(s86El('td', giftwrapLabel(r.giftwrap_count, data.recipients_saturated)));
    tr.appendChild(s86El('td', r.reporters != null ? Number(r.reporters).toLocaleString() : '—'));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableContainer.appendChild(table);

  if (truncation.truncatedCount > 0) {
    truncatedLine.textContent = 'showing top ' + RENDER_MAX_CLIENT + ' of '
      + truncation.totalCount.toLocaleString() + ' — filter to narrow';
  }
}

function loadUserlist() {
  return fetch('/api/userlist')
    .then(function (res) { return res.json(); })
    .then(renderTable)
    .catch(function () { setStatus('failed to load userlist'); });
}

function onLogin() {
  isAdmin = true;
  adminSection.style.display = '';
  loadUserlist();
}

s86WireLogin(loginBtn, statusEl, function () { return adminPubkey; }, onLogin);
filterInput.addEventListener('input', function () {
  if (lastData) {
    renderTable(lastData);
  }
});

fetch('/api/banned')
  .then(function (res) { return res.json(); })
  .then(function (data) {
    adminPubkey = data.admin;
    s86TryAutoLogin(adminPubkey, loginBtn, statusEl, onLogin);
  })
  .catch(function () {});
</script>
</body>
</html>
